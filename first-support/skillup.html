<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>スキルアッププロシリーズ｜Skyarc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../beta.css">
<meta name="theme-color" content="#4E6FD8">
<script src="../loading.js"></script>
<script src="../login.js"></script>
<style>
  :root{ --ink:#232A44; --main:#4E6FD8; --deep:#3450B0; --soft:#EEF2FD; --line:#D3DCF6; --shadow:0 4px 18px rgba(40,60,150,.12); }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);line-height:1.9;font-size:15px;background:#F8F9FE;}
  button{font-family:inherit;cursor:pointer;border:none;}
  #skyNav{position:sticky;top:0;z-index:30;background:rgba(52,80,176,.96);}
  #skyNav .inner{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;gap:10px;}
  #skyNav a{background:rgba(255,255,255,.2);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:6px 13px;text-decoration:none;}
  @media (max-width:700px){ #skyNav .inner{padding-right:74px;} }
  .wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;}
  .card{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:18px 16px 16px;margin:12px 0;}
  h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;color:var(--deep);text-align:center;margin:6px 0 4px;}
  .lead{text-align:center;font-size:13.5px;color:#5B6386;}
  .box{background:var(--soft);border-radius:12px;padding:11px 13px;margin:8px 0;font-size:14.5px;}
  .cnt{text-align:center;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:17px;margin:6px 0;}
  .flag{display:inline-block;background:#FFB300;color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:900;margin-left:6px;}
  .agree{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 4px;font-weight:700;cursor:pointer;}
  .agree input{width:22px;height:22px;accent-color:var(--main);flex:0 0 auto;}
  .btn{display:block;width:100%;background:var(--main);color:#fff;border-radius:13px;padding:13px;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:16px;margin-top:10px;}
  .btn:disabled{opacity:.4;}
  .msg{font-size:13.5px;font-weight:700;margin-top:8px;min-height:1em;}
  .sub{font-size:13px;color:#6A7192;}
  #conf{position:fixed;inset:0;z-index:9000;background:rgba(20,25,60,.45);display:flex;align-items:center;justify-content:center;padding:16px;}
  #conf .p{background:#fff;border-radius:18px;max-width:400px;width:100%;padding:18px 16px;}
  #conf .row{display:flex;gap:8px;margin-top:12px;}
  #conf .row button{flex:1;border-radius:12px;padding:12px;font-weight:700;font-size:15px;}
  .ask{text-align:center;font-weight:700;font-size:16px;margin:14px 0 4px;}
  .okbadge{background:#FF9800;color:#fff;border-radius:13px;padding:12px;text-align:center;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:14.5px;margin:12px 0 4px;box-shadow:0 4px 12px rgba(255,152,0,.3);}
  .verTag{display:block;text-align:center;font-size:9.5px;color:#C2C8DE;font-family:monospace;padding:16px 0 20px;}
</style>
</head>
<body>
<div id="skyNav"><div class="inner">
  <a href="../index.html" class="back-btn">↩️ もどる</a>
  <a class="sky-home" href="../index.html">🏠 ホーム</a>
</div></div>
<div class="wrap">
  <h1>🚀 スキルアッププロシリーズ</h1>
  <p class="lead">本気でLINKを広げていく方のための学びです</p>
  <div class="card" id="main"><p class="sub">読み込んでいます…</p></div>
  <div class="verTag"></div>
</div>
<script>
/* ================================================================
   スキルアッププロシリーズを学ぶ（v1.2.076）
   ・直紹介が2人以上いて、本気でLINKを拡大する活動ができる方だけ、ここから先に進めます
   ・v1.2.092：直紹介の人数は数えません。クリエーターズ以上は自動で開放。開放されたら「了承が降りています」と「次へ進む」（中身は準備中）
   ・「大丈夫です」にチェック → アップクリエの方に通知で開放をお願いします
   ・アップクリエの方が通知から「開放する」を押すと、開放されます（中身は準備中）
================================================================ */
const $ = q => document.querySelector(q);
const GAS_URL = window.SKY_GAS_URL;
let member = null;
try{ const raw = localStorage.getItem("skyarc_member"); if(raw && raw !== "null") member = JSON.parse(raw); }catch(e){}
if(member && !member.id) member = null;
/* v1.2.088：アップクリエの方が名簿にいないときは、いったん交通整備課統括（さかいあたる）へ届きます */
const FALLBACK_MSG = "✅ 送りました。ただいまアップクリエの方が見当たらないため、いったん交通整備課統括のさかいあたるさんに連絡が行くことになりますが、順次、返事や反応が来るのをお待ちください。";
const q = o => Object.keys(o).map(k => k + "=" + encodeURIComponent(o[k])).join("&");

async function load(){
  const box = $("#main");
  if(!member){
    box.innerHTML = '<p>このページを見るには、ログインが必要です。</p><button class="btn" onclick="skyLoginRequired(function(){ location.reload(); })">🌱 ログインする</button>';
    return;
  }
  let j = null;
  try{ j = await (await fetch(GAS_URL + "?" + q({ action:"skillStatus", id:member.id, pin:member.pin }))).json(); }catch(e){}
  if(!j || !j.ok){
    box.innerHTML = '<p class="sub">' + (j && j.error === "unknown_action" ? "まだしくみが用意できていません（GASの更新待ち）。" : "読み込めませんでした。少しおいてお試しください。") + '</p>';
    return;
  }
  /* v1.2.092：直紹介の人数は出しません（名簿の直紹介は、LINKをやめた方もふくむため）。
     クリエーターズ・アドバンス・系列代表・チーム代表の方は、自動で開放されています */
  const head = '<div class="box">直紹介が<b>2人以上</b>いて、<b>本気でLINKを拡大する活動をすると決めている方</b>のみ、ここから先に参加できます。</div>';
  if(j.open){
    box.innerHTML = head +
      '<div class="okbadge">✅ ' + (j.auto ? 'クリエーターズ以上の方は、開放されています' : 'アップクリエの方の了承が降りています') + '</div>' +
      '<button class="btn" id="next">次へ進む ›</button><p class="sub" id="wipMsg" style="text-align:center;margin-top:10px;" hidden>🚧 学びの中身は、ただいま準備中です。もうしばらくお待ちください。</p>';
    $("#next").onclick = () => { $("#wipMsg").hidden = false; };
    return;
  }
  if(j.pending){
    box.innerHTML = head + '<p>✉️ アップクリエの方に、開放のお願いを出しています。開放されるまで、しばらくお待ちください。</p>';
    return;
  }
  box.innerHTML = head + '<p class="ask">よろしいですか？</p>' +
    '<label class="agree"><input type="checkbox" id="ok"> 大丈夫です。本気でLINKを拡大する活動をしていきます</label>' +
    '<button class="btn" id="go" disabled>アップクリエの方に開放をお願いする</button><p class="msg" id="msg"></p>';
  $("#ok").onchange = e => { $("#go").disabled = !e.target.checked; };
  $("#go").onclick = () => confirmBox("アップクリエの方に、スキルアッププロの開放をお願いする通知が行きます。送りますか？", send);
}
async function send(){
  const m = $("#msg"); m.style.color = "#5B6386"; m.textContent = "送っています…"; $("#go").disabled = true;
  try{
    const j = await (await fetch(GAS_URL, { method:"POST", body:new URLSearchParams({ action:"skillReq", id:member.id, pin:member.pin }) })).json();
    if(j && j.ok){ m.style.color = "#2E7D32"; m.textContent = j.fallback ? FALLBACK_MSG : "✅ " + j.to + "さんに通知を送りました。開放されるまで、しばらくお待ちください。"; return; }
    m.style.color = "#C62828";
    m.textContent = j && j.error === "noreceiver" ? "アップクリエの方が名簿に入っていません。アップラインの方に直接ご相談ください。" : "送れませんでした。少しおいてお試しください。";
  }catch(e){ m.style.color = "#C62828"; m.textContent = "通信できませんでした。"; }
  $("#go").disabled = false;
}
function confirmBox(text, yes){
  const d = document.createElement("div"); d.id = "conf";
  d.innerHTML = '<div class="p"><p>' + text + '</p><div class="row"><button type="button" style="background:#fff;border:2px solid #D3DCF6;color:#5B6386" id="cNo">いいえ</button><button type="button" style="background:#4E6FD8;color:#fff" id="cYes">はい</button></div></div>';
  document.body.appendChild(d);
  d.querySelector("#cNo").onclick = () => d.remove();
  d.querySelector("#cYes").onclick = () => { d.remove(); yes(); };
}
load();
</script>
<script src="../track.js"></script>
<script src="../menu.js"></script>
</body>
</html>
