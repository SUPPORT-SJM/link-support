<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>イベントの申込み｜スカイアーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../beta.css">
<meta name="theme-color" content="#FF7043">
<script src="../config.js"></script>
<script src="../loading.js"></script>
<script src="../login.js"></script>
<style>
  :root{
    --ink:#3E2F28; --main:#FF7043; --deep:#E65100; --leaf:#3FA98A;
    --mist:#FFF3EC; --paper:#FFFBF7; --line:#FFE0CC;
    --shadow:0 3px 14px rgba(230,81,0,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);line-height:1.8;font-size:15px;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;}

  #skyNav{position:sticky;top:0;z-index:30;background:rgba(230,81,0,.96);
    backdrop-filter:blur(6px);color:#fff;}
  #skyNav .inner{max-width:560px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;}
  #skyNav .who{opacity:.92;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #skyNav a{background:rgba(255,255,255,.2);color:#fff;font-size:11.5px;font-weight:700;
    border-radius:999px;padding:6px 13px;text-decoration:none;flex-shrink:0;}

  .hero{background:linear-gradient(150deg,#FFB74D,#FF7043 55%,#E65100);color:#fff;
    padding:28px 0 24px;text-align:center;}
  .hero .em{font-size:34px;line-height:1;}
  .hero h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;margin:7px 0 5px;}
  .hero p{font-size:12.5px;opacity:.94;line-height:1.8;}

  main{padding:18px 0 60px;}

  .sec{font-size:11.5px;font-weight:700;color:#B0866E;letter-spacing:.05em;margin:20px 0 8px;}
  .sec:first-child{margin-top:0;}

  /* どれを見るか選ぶところ */
  .ask{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;
    color:var(--deep);text-align:center;margin:6px 0 14px;}
  .cats{display:flex;flex-direction:column;gap:10px;}
  .cats button{background:#fff;border-radius:15px;padding:16px 18px;box-shadow:var(--shadow);
    border-left:6px solid var(--main);display:flex;align-items:center;gap:13px;text-align:left;}
  .cats button[data-k="support"]  {border-left-color:#FF7043;}
  .cats button[data-k="kouryu-on"]{border-left-color:#5E8FD8;}
  .cats button[data-k="kouryu-re"]{border-left-color:#5E8FD8;}
  .cats button[data-k="douga"]    {border-left-color:#9575CD;}
  .cats button[data-k="support"]   .cnt{color:#FF7043;}
  .cats button[data-k="kouryu-on"] .cnt,
  .cats button[data-k="kouryu-re"] .cnt{color:#5E8FD8;}
  .cats button[data-k="douga"]     .cnt{color:#9575CD;}
  .cats button:active{transform:scale(.99);}
  .cats .ic{font-size:26px;line-height:1;flex-shrink:0;}
  .cats .tx{flex:1;}
  .cats .nm{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;color:var(--deep);}
  .cats .sub{font-size:11.5px;color:#A9917F;line-height:1.7;}
  .cats .cnt{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:19px;
    color:var(--main);flex-shrink:0;}
  .cats .cnt small{font-size:11px;font-weight:400;color:#A9917F;}
  .cats button.zero{border-left-color:#E0D5CE;opacity:.6;}
  .cats button.all{border-left-color:var(--leaf);}
  .cats button.all .cnt{color:var(--leaf);}

  .backcat{background:none;color:#A97B62;font-size:12.5px;font-weight:700;
    padding:8px 0;margin-bottom:4px;}
  .nowcat{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14.5px;
    color:var(--deep);margin-bottom:12px;}

  .ev{background:#fff;border-radius:15px;box-shadow:var(--shadow);
    margin-bottom:12px;overflow:hidden;}
  /* 種類の帯（何の会かを、はっきりお伝えします） */
  .ev .kindbar{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:15px;
    color:#fff;padding:11px 16px;letter-spacing:.02em;}
  .ev > *:not(.kindbar){margin-left:16px;margin-right:16px;}
  .ev .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:13px;margin-bottom:3px;}
  .ev .when{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:17px;color:#3E2F28;}
  .ev .detail{font-size:12px;line-height:1.95;color:#4A4038;background:#F7F4F1;
    border-radius:10px;padding:11px 13px;margin-bottom:10px;word-break:break-word;}
  .ev .detail b{color:#3E2F28;}
  .ev .caution{font-size:11px;line-height:1.85;color:#8A6A57;background:#FFF8F4;
    border-radius:9px;padding:9px 11px;margin-bottom:11px;}
  .ev .caution b{color:#C2410C;}
  .ev > *:last-child{margin-bottom:15px;}

  /* ユーザーサポート会 … オレンジ */
  .ev.k-support   .kindbar{background:#FF7043;}
  .ev.k-support   .btn{background:#FF7043;}
  .ev.k-support   .cal a{background:#FFF0EB;color:#B0603A;}
  /* チーム交流会（オンライン・リアル）… 青 */
  .ev.k-kouryu-on .kindbar,
  .ev.k-kouryu-re .kindbar{background:#5E8FD8;}
  .ev.k-kouryu-on .btn,
  .ev.k-kouryu-re .btn{background:#5E8FD8;}
  .ev.k-kouryu-on .cal a,
  .ev.k-kouryu-re .cal a{background:#EDF3FB;color:#2B5C93;}
  /* 動画視聴会 … むらさき */
  .ev.k-douga     .kindbar{background:#9575CD;}
  .ev.k-douga     .btn{background:#9575CD;}
  .ev.k-douga     .cal a{background:#F2EFF9;color:#5E42A6;}
  .ev .raw{font-size:11.5px;color:#A9917F;margin-bottom:9px;word-break:break-all;}
  .ev .meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:#A9917F;margin-bottom:10px;}
  .ev .zoomtag{color:#2B5C93;}
  .ev .btn{width:100%;padding:12px;border-radius:11px;background:var(--main);color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;}
  .ev .btn:active{transform:scale(.99);}
  .ev .btn:disabled{background:#E8E0DA;color:#A9917F;}
  .ev .btn.joined{background:var(--leaf);}
  .ev .zoom{display:block;margin-top:8px;font-size:11.5px;color:#2B5C93;
    text-decoration:none;word-break:break-all;line-height:1.7;
    background:#F2F7FC;border-radius:9px;padding:9px 11px;}

  .mine{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);border-radius:15px;
    padding:15px 16px;margin-bottom:16px;}
  .mine h2{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;
    color:var(--deep);margin-bottom:8px;}
  .mine .row{display:flex;gap:9px;font-size:13px;padding:5px 0;
    border-bottom:1px dashed rgba(230,81,0,.2);}
  .mine .row:last-child{border-bottom:none;}
  .mine .row b{color:var(--deep);white-space:nowrap;}

  .empty{text-align:center;padding:40px 20px;color:#A9917F;font-size:13.5px;line-height:2;
    background:#fff;border-radius:15px;box-shadow:var(--shadow);}
  .note{background:var(--mist);border-radius:13px;padding:13px 15px;font-size:11.5px;
    color:#8A6A57;line-height:1.9;margin-top:14px;}
  .note b{color:var(--deep);}
  .verTag{display:block;text-align:center;font-size:9.5px;color:#C4B8B0;
    font-family:monospace;padding:18px 0 24px;}

  /* 確かめの画面 */
  .ov{position:fixed;inset:0;z-index:9000;background:rgba(62,47,40,.6);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;padding:20px;}
  .ov.show{display:flex;}
  .ov .card{background:#fff;border-radius:20px;padding:26px 22px;max-width:340px;width:100%;
    box-shadow:0 14px 40px rgba(0,0,0,.28);}
  .ov h3{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:17px;
    color:var(--deep);text-align:center;margin-bottom:14px;}
  .ov .line{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--line);}
  .ov .line:last-of-type{border-bottom:none;}
  .ov .line span:first-child{color:#A9917F;min-width:72px;flex-shrink:0;}
  .ov .line span:last-child{font-weight:700;word-break:break-all;}
  .ov .go{width:100%;padding:14px;border-radius:12px;background:var(--main);color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;margin-top:16px;}
  .ov .cancel{display:block;width:100%;text-align:center;font-size:12.5px;color:#A9917F;
    padding:11px;margin-top:4px;background:none;}
  .ov .pick{margin-top:14px;}
  .ov .pick label{display:block;font-size:12px;font-weight:700;color:var(--deep);margin-bottom:7px;}
  .ov .opts{display:flex;gap:6px;flex-wrap:wrap;}
  .ov .opts button{flex:1;min-width:70px;padding:9px 6px;border-radius:10px;
    background:#fff;border:1.5px solid var(--line);color:#A97B62;font-size:12px;font-weight:700;}
  .ov .opts button.on{background:var(--main);border-color:var(--main);color:#fff;}
  .ov .guide-note{font-size:12px;color:#8A6A57;line-height:1.85;
    background:var(--mist);border-radius:10px;padding:11px 13px;margin-top:14px;}
  .ov .guide-note b{color:var(--deep);}
  .ov .copy-name{display:flex;align-items:center;gap:8px;margin-top:10px;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;}
  .ov .copy-name span{flex:1;font-size:13.5px;font-weight:700;}
  .ov .copy-name button{background:var(--sun,#F2B33D);color:#4A3400;border-radius:999px;
    padding:6px 13px;font-size:11.5px;font-weight:700;flex-shrink:0;}

  /* カレンダーに入れるところ */
  .cal{display:flex;gap:6px;margin-top:8px;}
  .cal a{flex:1;text-align:center;padding:9px;border-radius:10px;background:var(--mist);
    color:#A0603A;font-size:11.5px;font-weight:700;text-decoration:none;}
  .cal a:active{background:#FFE4D3;}
  .sheetlink{display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:8px;padding:9px;border-radius:10px;background:#F2F7F2;
    color:#3F7A4F;font-size:11.5px;font-weight:700;text-decoration:none;}
  .sheetlink span{font-weight:400;color:#8AA890;font-size:10.5px;}
  .sheetlink:active{background:#E4F0E6;}
</style>
</head>
<body>

<div id="skyNav"><div class="inner">
  <span class="who" id="navWho"></span>
  <a href="./index.html">‹ もどる</a>
</div></div>

<header class="hero">
  <div class="wrap">
    <div class="em">📅</div>
    <h1>イベントの申込み</h1>
    <p>これからの予定です。そのままお申し込みいただけます</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="mineBox"></div>

    <!-- どれを見るか、まず選んでいただきます -->
    <div id="pickBox" style="display:none;">
      <p class="ask">どの予定をご覧になりますか？</p>
      <div class="cats" id="cats"></div>
    </div>

    <!-- 選んだあとの一覧 -->
    <div id="listBox" style="display:none;">
      <button class="backcat" onclick="backToCats()">‹ ほかの予定を見る</button>
      <p class="nowcat" id="nowCat"></p>
      <div id="list"></div>
    </div>

    <div id="firstLoad" class="empty">読み込んでいます…</div>

    <div class="note" id="noteBox" style="display:none;">
      <b>お申し込みについて</b><br>
      ボタンを押すと、<b>申込みシートのその場所が開きます</b>。<br>
      空いている行に、お名前と系列をご記入ください。<br><br>
      お名前はコピーできるので、貼り付けるだけで済みます。<br>
      取り消したいときは、シートのご自身の行を消してください。
    </div>

    <div class="verTag"></div>
  </div>
</main>

<!-- 確かめの画面 -->
<div class="ov" id="ov">
  <div class="card">
    <h3>この内容でお申し込みください</h3>
    <div class="line"><span>イベント</span><span id="cKind"></span></div>
    <div class="line"><span>開催日時</span><span id="cWhen"></span></div>
    <div class="line"><span>お名前</span><span id="cName"></span></div>
    <div class="line"><span>系列</span><span id="cTeam"></span></div>

    <p class="guide-note">
      シートを開いたら、<b>空いている行</b>に下の内容をご記入ください。
    </p>
    <div class="copy-name">
      <span id="cCopyName"></span>
      <button onclick="copyMyName()">📋 コピー</button>
    </div>

    <div class="pick" id="markWrap">
      <label>ご参加のしかた</label>
      <div class="opts" id="markOpts">
        <button data-v="初" onclick="setMark(this)">はじめて</button>
        <button data-v="" class="on" onclick="setMark(this)">2回目以降</button>
        <button data-v="見学" onclick="setMark(this)">見学</button>
        <button data-v="海外・初" onclick="setMark(this)">海外から(初)</button>
      </div>
    </div>

    <div class="pick" id="devWrap">
      <label>ご参加の端末</label>
      <div class="opts" id="devOpts">
        <button data-v="パソコン" class="on" onclick="setDev(this)">パソコン</button>
        <button data-v="スマホ" onclick="setDev(this)">スマホ</button>
      </div>
    </div>

    <button class="go" onclick="openSheet()">📋 申込みシートを開く</button>
    <button class="cancel" onclick="closeOv()">とじる</button>
  </div>
</div>

<script>
const GAS_URL = window.SKY_GAS_URL;

let member = null, events = [], filter = null, picked = null;
let myMark = "", myDevice = "パソコン";

/* ================================================================
   種類ごとの、しるしと注意書き
================================================================ */
const KIND = {
  "support":   { ic:"🎧", note:
      "⚠️ <b>オープンチャットのお名前と、お申し込みのお名前をそろえてください。</b><br>" +
      "⚠️ ご自身の<b>会員番号とパスワード</b>がすぐ分かる状態で、<b>LINKポータルにご登録ずみ</b>でご参加ください。" },
  "kouryu-on": { ic:"💻", note:
      "⚠️ <b>オープンチャットのお名前と、お申し込みのお名前をそろえてください。</b>" },
  "kouryu-re": { ic:"🤝", note:
      "⚠️ <b>オープンチャットのお名前と、お申し込みのお名前をそろえてください。</b>" },
  "douga":     { ic:"🎬", note:
      "⚠️ <b>オープンチャットのお名前と、お申し込みのお名前をそろえてください。</b>" },
};

/* 予定の種類 */
const CATS = [
  { key:"all",       ic:"📋", nm:"すべての予定",             sub:"これから開かれるもの全部" },
  { key:"support",   ic:"🎧", nm:"ユーザーサポート会",        sub:"はじめての方の疑問にお答えします" },
  { key:"kouryu-on", ic:"💻", nm:"チーム交流会(オンライン)",   sub:"お家から参加できます" },
  { key:"kouryu-re", ic:"🤝", nm:"チーム交流会(リアル)",      sub:"実際にお会いできます" },
  { key:"douga",     ic:"🎬", nm:"動画視聴会",               sub:"みんなで一緒に見ます" },
];

function $(q){ return document.querySelector(q); }

/* ---------- 読み込み ---------- */
(function(){
  try{
    const raw = localStorage.getItem("skyarc_member");
    if(raw && raw !== "null" && raw !== "undefined") member = JSON.parse(raw);
  }catch(e){}
  if(member && !member.id) member = null;

  if(!member){
    $("#list").innerHTML =
      '<div class="empty">お申し込みには、ログインが必要です。<br><br>' +
      '<button onclick="skyLoginRequired(function(){ location.reload(); })" ' +
      'style="background:#FF7043;color:#fff;border-radius:11px;padding:12px 26px;' +
      'font-weight:700;font-size:14px;">🌱 ログインする</button></div>';
    return;
  }
  $("#navWho").textContent =
    (member.name ? member.name + "さん" : "会員番号 " + member.id)
    + (member.keiretsu ? "｜" + member.keiretsu : "");
  load();
})();

async function load(){
  if(typeof skyLoading === "function") skyLoading("予定を読み込んでいます");
  try{
    const q = `id=${encodeURIComponent(member.id)}&pin=${encodeURIComponent(member.pin)}`;
    /* 45秒たっても返らないときは、いったんあきらめます */
    const [r1, r2] = await withLimit(Promise.all([
      fetch(`${GAS_URL}?action=eventList&${q}`),
      fetch(`${GAS_URL}?action=myEvents&${q}`)
    ]), 45000);
    const j1 = await r1.json();
    const j2 = await r2.json();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j1)) return;
    if(typeof skyLoadingDone === "function") skyLoadingDone();

    if(j1.ok === false){
      $("#firstLoad").innerHTML = `<div class="empty">${
        {pin:"パスコードが違います", nomember:"会員番号が見つかりません",
         busy:"いま混み合っています。少しおいてお試しください"}[j1.error] || "読み込めませんでした"
      }</div>`;
      return;
    }
    events = j1.events || [];
    $("#firstLoad").style.display = "none";
    renderMine((j2 && j2.events) || []);
    renderCats();
  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    $("#firstLoad").style.display = "block";
    $("#firstLoad").innerHTML = (String(e && e.message) === "timeout")
      ? '<div class="empty">読み込みに時間がかかっています。<br>' +
        '<span style="font-size:12px;">少し時間をおいて、もう一度お試しください。</span><br><br>' +
        '<button onclick="location.reload()" style="background:#FF7043;color:#fff;' +
        'border-radius:11px;padding:12px 26px;font-weight:700;font-size:14px;">' +
        '🔄 もう一度読み込む</button></div>'
      : '<div class="empty">通信できませんでした。<br>電波のよい場所でお試しください。</div>';
  }
}

/* ---------- お申し込み済みの予定 ---------- */
function renderMine(list){
  const box = $("#mineBox");
  if(!list.length){ box.innerHTML = ""; return; }
  box.innerHTML = `<div class="mine">
    <h2>🔔 シートを開いた予定</h2>
    ${list.map(e => `<div class="row"><b>${e.md}</b><span>${e.label}</span></div>`).join("")}
  </div>`;
}

/* ---------- どれを見るか選んでいただきます ---------- */
function renderCats(){
  if(!events.length){
    $("#pickBox").style.display = "none";
    $("#firstLoad").style.display = "block";
    $("#firstLoad").innerHTML =
      '<div class="empty">これからの予定が見つかりませんでした。<br>' +
      '<span style="font-size:12px;">日程が出ましたら、ここに並びます📅</span></div>';
    return;
  }
  $("#pickBox").style.display = "block";
  $("#listBox").style.display = "none";
  $("#noteBox").style.display = "none";

  $("#cats").innerHTML = CATS.map(c=>{
    const n = c.key === "all" ? events.length
            : events.filter(e => e.book === c.key).length;
    return `<button data-k="${c.key}" class="${c.key==="all"?"all":""} ${n?"":"zero"}" onclick="setF('${c.key}')">
      <span class="ic">${c.ic}</span>
      <span class="tx"><span class="nm">${c.nm}</span><br><span class="sub">${c.sub}</span></span>
      <span class="cnt">${n}<small>件</small></span>
    </button>`;
  }).join("");
}

function backToCats(){
  filter = null;
  renderCats();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- 選ばれた種類の一覧 ---------- */
function setF(f){
  filter = f;
  const c = CATS.filter(x=>x.key===f)[0];
  $("#pickBox").style.display = "none";
  $("#listBox").style.display = "block";
  $("#noteBox").style.display = "block";
  $("#nowCat").textContent = (c ? c.ic + " " + c.nm : "");
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

function render(){
  const list = $("#list");
  const shown = events.filter(e => filter === "all" ? true : e.book === filter);
  if(!shown.length){
    list.innerHTML = '<div class="empty">この種類の予定は、いまありません</div>';
    return;
  }

  list.innerHTML = shown.map(e => {
    const i = events.indexOf(e);
    return `
    <div class="ev k-${e.book}">
      <div class="kindbar">${KIND[e.book] ? KIND[e.book].ic : "📅"} ${e.label}</div>
      <div class="top">
        <span class="when">${e.md}</span>
      </div>
      <div class="raw">${e.dateText}</div>
      <div class="meta">
        <span>いま ${e.taken}名</span>
        ${e.zoom ? '<span class="zoomtag">Zoomあり</span>' : ""}
      </div>
      ${e.detail ? `<div class="detail">${fmtDetail(e.detail)}</div>` : ""}
      <div class="caution">${KIND[e.book] ? KIND[e.book].note : ""}</div>
      <button class="btn" onclick="pick(${i})">📋 申込みシートを開く</button>
      <div class="cal">
        <a href="${gcalUrl(e)}" target="_blank">📅 Googleカレンダー</a>
        <a href="#" onclick="downloadIcs(${i});return false;">🍎 iPhone・その他</a>
      </div>
      ${e.zoom ? `<a class="zoom" href="${zoomUrl(e.zoom)}" target="_blank">${e.zoom}</a>` : ""}
    </div>`;
  }).join("");
}

/* ================================================================
   カレンダーに入れる
================================================================ */
/* 「2026/09/16 21:00」から、終わりの時刻も見当をつけます */
function evTimes(e){
  const m = String(e.when).match(/(\d{4})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2})/);
  if(!m) return null;
  const st = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);

  /* 元の文字から、終わりの時刻を探します（なければ2時間後） */
  let en = new Date(st.getTime() + 2*60*60*1000);
  const times = String(e.dateText).replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
                  .match(/(\d{1,2})\s*[:：]\s*(\d{2})/g);
  if(times && times.length >= 2){
    const t2 = times[1].replace(/[:：\s]/g, ":").split(":");
    const cand = new Date(st.getFullYear(), st.getMonth(), st.getDate(), +t2[0], +t2[1]);
    if(cand.getTime() > st.getTime()) en = cand;
  }
  return { st: st, en: en };
}

function fmtCal(d){
  const p = n => String(n).padStart(2, "0");
  /* 日本時間で書き出します */
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
       + "T" + p(d.getHours()) + p(d.getMinutes()) + "00";
}

function evTitle(e){ return e.label + (e.title && e.title !== e.label ? "（" + e.title + "）" : ""); }

function gcalUrl(e){
  const t = evTimes(e);
  if(!t) return "#";
  const detail = (e.zoom || "") + "\n\nSkyarc 育成システムから申し込みました";
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(evTitle(e))
    + "&dates=" + fmtCal(t.st) + "/" + fmtCal(t.en)
    + "&details=" + encodeURIComponent(detail)
    + "&ctz=Asia/Tokyo";
}

/* iPhone・Outlookなど向けのファイルをお作りします */
function downloadIcs(i){
  const e = events[i];
  const t = evTimes(e);
  if(!e || !t) return;
  const z = d => {
    const u = new Date(d.getTime() - 9*60*60*1000);   // 日本時間 → 世界標準時
    const p = n => String(n).padStart(2, "0");
    return u.getUTCFullYear() + p(u.getUTCMonth()+1) + p(u.getUTCDate())
         + "T" + p(u.getUTCHours()) + p(u.getUTCMinutes()) + "00Z";
  };
  const esc = x => String(x||"").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n");
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Skyarc//JP","CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    "UID:" + Date.now() + "@skyarc",
    "DTSTAMP:" + z(new Date()),
    "DTSTART:" + z(t.st),
    "DTEND:" + z(t.en),
    "SUMMARY:" + esc(evTitle(e)),
    "DESCRIPTION:" + esc((e.zoom || "") + "\nSkyarc 育成システムから申し込みました"),
    "BEGIN:VALARM","TRIGGER:-PT30M","ACTION:DISPLAY","DESCRIPTION:まもなく始まります","END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");

  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "skyarc-" + fmtCal(t.st).slice(0,8) + ".ics";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* 場所・住所・会費などの案内を、読みやすく並べます */
function fmtDetail(text){
  let t = String(text || "").replace(/\s+/g, " ").trim();
  /* 項目のあたまで改行します */
  t = t.replace(/(場所|住所|最寄り駅|最寄駅|お店URL|会費|集合|受付|持ち物)\s*[：:]/g, "<br><b>$1：</b>");
  /* ※ のあたまでも改行します */
  t = t.replace(/\s*※/g, "<br>※");
  /* リンクは押せるようにします */
  t = t.replace(/(https?:\/\/[^\s<]+)/g,
    '<a href="$1" target="_blank" rel="noopener" style="color:#2B5C93;word-break:break-all;">$1</a>');
  return t.replace(/^(<br>)+/, "");
}

/* Zoomの案内から、リンクだけ取り出します */
function zoomUrl(text){
  const m = String(text).match(/https?:\/\/\S+/);
  return m ? m[0] : "#";
}

/* ---------- 確かめの画面 ---------- */
function setMark(b){
  document.querySelectorAll("#markOpts button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  myMark = b.dataset.v;
}
function setDev(b){
  document.querySelectorAll("#devOpts button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  myDevice = b.dataset.v;
}

/* お名前をコピーします（シートに貼り付けやすいように） */
async function copyMyName(){
  const t = (member.name || "") + (member.keiretsu ? "\t" + member.keiretsu : "");
  try{
    await navigator.clipboard.writeText(t);
    alert("✅ コピーしました\n\nシートのお名前の欄に貼り付けてください。\n（系列も一緒にコピーしています）");
  }catch(e){
    alert("コピーできませんでした。\nお手数ですが、手で入力してください。");
  }
}

function pick(i){
  picked = events[i];
  if(!picked) return;
  $("#cKind").textContent = picked.label;
  $("#cWhen").textContent = picked.dateText;
  $("#cName").textContent = member.name || "(お名前未登録)";
  $("#cTeam").textContent = member.keiretsu || "(未設定)";
  $("#cCopyName").textContent = (member.name || "") + (member.keiretsu ? "　" + member.keiretsu : "");

  /* そのシートに欄があるときだけ、お選びいただきます */
  $("#markWrap").style.display = (picked.hasMark === false) ? "none" : "block";
  $("#devWrap").style.display  = (picked.hasDevice === false) ? "none" : "block";

  $("#ov").classList.add("show");
}
function closeOv(){ $("#ov").classList.remove("show"); picked = null; }

/* ================================================================
   申込みシートを開きます
   ----------------------------------------------------------------
   こちらから書き込むことはしません。
   ご自身で、空いている行にご記入いただきます。
================================================================ */
function openSheet(){
  if(!picked) return;
  const ev = picked;
  closeOv();

  if(!ev.url){
    alert("シートの場所が分かりませんでした。\n読み込み直してお試しください。");
    return;
  }

  /* 開いたことを控えておきます（あとで見返せるように） */
  try{
    const q = `id=${encodeURIComponent(member.id)}&pin=${encodeURIComponent(member.pin)}`
            + `&book=${encodeURIComponent(ev.book)}&sheet=${encodeURIComponent(ev.sheet)}`
            + `&dateText=${encodeURIComponent(ev.dateText)}`
            + `&mark=${encodeURIComponent(myMark)}&device=${encodeURIComponent(myDevice)}`;
    new Image().src = `${GAS_URL}?action=eventOpened&${q}&_=${Date.now()}`;
  }catch(e){}

  window.open(ev.url, "_blank", "noopener");
}

$("#ov").addEventListener("click", e => { if(e.target.id === "ov") closeOv(); });
