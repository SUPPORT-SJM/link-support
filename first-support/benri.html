<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Zen Kaku Gothic New",sans-serif;background:radial-gradient(ellipse at 50% 45%,#FFFFFF 0%,#F2F8FF 55%,#E8F1FB 100%);color:#37474F;font-size:15px;line-height:1.8}
.back-btn{position:fixed;left:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:20;display:inline-block;color:#1565C0;font-size:14px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;box-shadow:0 2px 8px rgba(30,80,140,.12)}
#stage{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden}
.orb{position:absolute;border:1.5px dashed rgba(66,133,214,.28);border-radius:50%;pointer-events:none}
.bub{position:absolute;left:0;top:0;width:92px;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#263238;
  cursor:pointer;-webkit-tap-highlight-color:transparent;will-change:transform;background:none;border:none;font-family:inherit;padding:0}
.bub .ball{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:25px;background:#fff;border:3px solid var(--c);
  box-shadow:0 6px 16px rgba(30,80,140,.16)}
.bub .nm{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:11px;line-height:1.25;text-align:center;white-space:pre;
  background:rgba(255,255,255,.9);border-radius:8px;padding:2px 6px}
.bub.in{--c:#4E86D6}
.bub.out{--c:#E8873A}
.bub.out .ball{width:58px;height:58px}
.sun{position:absolute;left:0;top:0;width:120px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.sun .ball{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:32px;
  background:radial-gradient(circle at 35% 30%,#FFF9C4,#FFD54F 60%,#FFB300);box-shadow:0 0 0 8px rgba(255,213,79,.25),0 0 34px rgba(255,193,7,.45)}
.sun .nm{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:15px;color:#0D47A1;line-height:1.25;text-align:center;
  background:rgba(255,255,255,.85);border-radius:10px;padding:2px 8px}
/* ポップアップ */
.sheet{position:fixed;inset:0;z-index:8500;background:rgba(20,40,70,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.pop{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:20px;padding:18px 16px 16px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.pop h2{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:17px;color:#1565C0;margin:0 0 10px;padding-bottom:5px;border-bottom:3px solid #BBDEFB}
.pop .closeb{display:block;width:100%;margin-top:14px;padding:12px;border-radius:12px;border:2px solid #CFD8DC;background:#fff;color:#455A64;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.row{padding:8px 0;border-bottom:1px dashed #E3E8F0}
.row:last-child{border-bottom:none}
.k{font-size:13px;font-weight:700;color:#1565C0}
.v{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;letter-spacing:.05em}
.v.url{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:12.5px;letter-spacing:0;word-break:break-all;line-height:1.5}
.idrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cpy{flex:none;padding:10px 14px;border-radius:12px;border:2px solid #43A047;background:#fff;color:#2E7D32;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
.cpy.done{background:#43A047;color:#fff}
.cpy.wide{width:100%;margin-top:6px;font-size:15px;padding:12px}
.cpmsg{display:block;font-size:13px;font-weight:700;color:#2E7D32;margin-top:4px;min-height:1em}
.cpmsg a{color:#1565C0}
.gen-label{font-size:13px;font-weight:700;color:#1565C0;margin:4px 0 5px;display:block}
.gen-input,.gen-select{width:100%;border:1.5px solid #BBDEFB;border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;color:#37474F;background:#fff;margin-bottom:10px}
.result-box{background:#E3F2FD;border:2px solid #42A5F5;border-radius:10px;padding:12px;font-size:17px;font-weight:700;color:#0D47A1;text-align:center;word-break:break-all;margin-bottom:10px}
.go{display:block;width:100%;padding:13px;border:none;border-radius:12px;background:#1E88E5;color:#fff;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:16px;cursor:pointer}
.go.done{background:#43A047}
.hint{font-size:12.5px;color:#607D8B;text-align:center;margin-top:6px}
@media (prefers-reduced-motion: reduce){ .bub{will-change:auto} }
@media (max-width:380px){ .sun .ball{width:60px;height:60px;font-size:27px} .sun .nm{font-size:13.5px} }   /* せまい画面では、まんなかを少し小さく */
</style>

<!-- 太陽系：まんなかに「便利な情報一覧」、内がわの輪にLINKのサイト（押すとそのページへ）、外がわの輪にポップアップ -->
<div id="stage">
  <div class="orb" id="orbIn"></div>
  <div class="orb" id="orbOut"></div>
  <div class="sun" id="sun"><div class="ball">🧰</div><div class="nm">便利な<br>情報一覧</div></div>
  <a class="bub in" href="https://app.link-event-x.com" target="_blank" rel="noopener"><span class="ball">🏠</span><span class="nm">LINKポータル</span></a>

マイページ</span></a>
  <a class="bub in" href="https://link-event-x.com/" target="_blank" rel="noopener"><span class="ball">🗓</span><span class="nm">LINK公認公式
スケジュール</span></a>

マッチング</span></a>

サイト</span></a>

紹介コード</span></button>

<!-- 会員情報／紹介コード -->
<div class="sheet" id="popMem" hidden><div class="pop" role="dialog" aria-modal="true">

  <div id="memCard">
    <div class="row"><span class="k">会員番号</span>
      <div class="idrow"><span class="v" id="mId">–</span><button type="button" class="cpy" id="mCopy">📋 コピー</button></div>

<!-- オープンチャットの名前 -->
<div class="sheet" id="popNick" hidden><div class="pop" role="dialog" aria-modal="true">
  <h2>🏷️ オープンチャットの名前づくり</h2>
  <label class="gen-label" for="nameInput">👤 あなたのお名前</label>
  <input class="gen-input" id="nameInput" type="text" autocomplete="nickname" placeholder="例：しょうこ">

  <button type="button" class="closeb">とじる</button>
</div></div>

<!-- Zoom -->
<div class="sheet" id="popZoom" hidden><div class="pop" role="dialog" aria-modal="true">
  <h2>🎥 LINKセミナー・LINK主催イベントのZoom</h2>
  <div class="row"><span class="k">URL</span>
    <div class="idrow"><span class="v url" id="zUrl"></span><button type="button" class="cpy" data-copy="url">📋 コピー</button></div>
    <span class="cpmsg" aria-live="polite"></span></div>
  <div class="row"><span class="k">ミーティングID</span>
    <div class="idrow"><span class="v" id="zId"></span><button type="button" class="cpy" data-copy="id">📋 コピー</button></div>
    <span class="cpmsg" aria-live="polite"></span></div>
  <div class="row"><span class="k">パスコード</span>
    <div class="idrow"><span class="v" id="zPw"></span><button type="button" class="cpy" data-copy="pw">📋 コピー</button></div>
    <span class="cpmsg" aria-live="polite"></span></div>
  <button type="button" class="closeb">とじる</button>
</div></div>
<script>
/* ================================================================
   便利な情報一覧（トップページの「便利な情報一覧」の丸から開きます）
   ・LINKのサイト：LINKポータル・ビジネスマイページ・公認公式スケジュールサイト・SASAEAI・LINK-BASE
   ・会員情報／紹介コード：ログインしている方の会員番号と、紹介URL（会員名簿の「紹介URL」）をコピーできます
   ・オープンチャットの名前づくり：nickname.js の決まり（20文字）で作ります
   ・Zoom：LINKセミナー・LINK主催イベントのZoom（URL・ミーティングID・パスコード、それぞれコピー）
   v1.219：トップページのように、丸がぐるぐるまわる「太陽系」の形にしました。
     まんなか：便利な情報一覧／内がわの輪：LINKのサイト5つ（押すとそのページへ）
     外がわの輪：会員情報・紹介コード／オープンチャットの名前づくり／Zoom（押すとポップアップ）
================================================================ */
const $ = s => document.querySelector(s);
let me = null;
try{ me = JSON.parse(localStorage.getItem("skyarc_member") || "null"); }catch(e){}
if(me && !me.id) me = null;

async function copyText(t){
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.top = "-1000px"; ta.style.fontSize = "16px";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}
/* 会員番号は、LINKの会員番号の形（8けた）で見せます */
function idText(id){ const t = String(id || "").trim(); return /^\d{1,7}$/.test(t) ? t.padStart(8, "0") : t; }

/* ---------- 会員情報／紹介コード ---------- */
if(!me){
  $("#memCard").innerHTML = '<p style="text-align:center;font-size:14px;">ログインすると、会員番号と紹介コードが出ます。</p>';
}else{
  $("#mId").textContent = idText(me.id);
  $("#mCopy").addEventListener("click", async ()=>{
    const ok = await copyText(idText(me.id));
    $("#mCopy").classList.toggle("done", ok); $("#mCopy").textContent = ok ? "✓ コピーしました" : "📋 コピー";
    $("#mMsg").textContent = ok ? "そのまま、貼りつけて使えます" : "コピーできませんでした。番号を長押ししてコピーしてください";
  });
  $("#rCopy").addEventListener("click", async ()=>{
    const url = String(me.refUrl || "").trim();
    if(!url){
      $("#rMsg").innerHTML = "紹介コードがまだ登録されていません。<br>"
        + "<span style='font-weight:500;color:#37474F;'>紹介コード（URL）は、<b>ビジネスマイページ</b>を開いてログインし、右上のメニューの<b>「新規会員紹介」</b>から発行できます。発行したら、アカウントのページに貼りつけて登録してください。</span><br>"
        + "<a href='https://member.link-platform.jp' target='_blank' rel='noopener'>ビジネスマイページを開く ›</a><br>"
        + "<a href='../ikusei/account.html'>アカウントのページで登録する ›</a>";
      return;
    }
    const ok = await copyText(url);
    $("#rCopy").classList.toggle("done", ok); $("#rCopy").textContent = ok ? "✓ コピーしました" : "🔗 紹介コードをコピーする";
    $("#rMsg").textContent = ok ? "招待コードのURLがコピーされました" : "コピーできませんでした。アカウントのページで、URLを長押ししてコピーしてください";
  });
}

/* ---------- オープンチャットの名前づくり ---------- */
(function(){
  const sel = $("#seriesSelect"), nm = $("#nameInput"), box = $("#resultBox"), btn = $("#nickCopy"), hint = $("#nickHint");
  sel.innerHTML = '<option value="">選んでください</option>' + (window.SKY_KEIRETSU || []).map(k=>`<option value="${k}">${k}</option>`).join("");
  function update(){
    const n = nm.value.trim(), k = sel.value;
    if(!n || !k){ skyNick.clearWarn(box); box.textContent = !n && !k ? "👆 お名前と系列を入れてください" : (!n ? "👆 お名前を入れてください" : "👆 系列を選んでください"); return; }
    skyNick.render(box, n, k);
  }
  nm.addEventListener("input", update); sel.addEventListener("change", update);
  if(me){
    if(me.name) nm.value = me.name;
    if(me.keiretsu && Array.from(sel.options).some(o=>o.value === me.keiretsu)) sel.value = me.keiretsu;
  }
  update();
  btn.addEventListener("click", async ()=>{
    if(!nm.value.trim() || !sel.value){ hint.textContent = "⚠️ 先にお名前と系列を入れてください"; return; }
    const ok = await copyText(skyNick.make(nm.value.trim(), sel.value).text);
    btn.classList.toggle("done", ok); btn.textContent = ok ? "✓ コピーしました" : "📋 タップしてコピー";
    hint.textContent = ok ? "オープンチャットのニックネームに貼りつけてください" : "コピーできませんでした。上の名前を長押ししてコピーしてください";
  });
})();

/* ---------- Zoom ---------- */
const ZOOM = {
  url: "https://us02web.zoom.us/j/5460266005?pwd=bDBqOVdxQmFLWGwzTW1zWXB1YTRRdz09",
  id:  "546 026 6005",
  pw:  "LINK"
};
$("#zUrl").textContent = ZOOM.url; $("#zId").textContent = ZOOM.id; $("#zPw").textContent = ZOOM.pw;
document.querySelectorAll("#popZoom [data-copy]").forEach(b=>{
  b.addEventListener("click", async ()=>{
    const k = b.dataset.copy;
    const t = k === "id" ? ZOOM.id.replace(/\s/g, "") : ZOOM[k];   /* ミーティングIDは、すきまなしの数字でコピー */
    const ok = await copyText(t);
    document.querySelectorAll("#popZoom [data-copy]").forEach(x=>{ x.classList.remove("done"); x.textContent = "📋 コピー"; x.closest(".row").querySelector(".cpmsg").textContent = ""; });
    b.classList.toggle("done", ok); b.textContent = ok ? "✓ コピー済" : "📋 コピー";
    b.closest(".row").querySelector(".cpmsg").textContent = ok ? "コピーしました" : "コピーできませんでした。長押ししてコピーしてください";
  });
});

/* ---------- ポップアップ ---------- */
let popOpen = false;
function openPop(id){ const s = document.getElementById(id); if(!s) return; s.hidden = false; popOpen = true; }
function closePops(){ document.querySelectorAll(".sheet").forEach(s=>s.hidden = true); popOpen = false; }
document.querySelectorAll(".bub[data-pop]").forEach(b=>b.addEventListener("click", ()=>openPop(b.dataset.pop)));
document.querySelectorAll(".sheet").forEach(s=>{
  s.addEventListener("click", e=>{ if(e.target === s) closePops(); });
  s.querySelector(".closeb").addEventListener("click", closePops);
});
document.addEventListener("keydown", e=>{ if(e.key === "Escape") closePops(); });

/* ---------- 太陽系（ぐるぐる） ---------- */
(function(){
  const stage = $("#stage"), sun = $("#sun");
  const ins = [...document.querySelectorAll(".bub.in")], outs = [...document.querySelectorAll(".bub.out")];
  const all = ins.concat(outs);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, cx, cy, ri, ro;
  function size(){
    W = innerWidth; H = innerHeight;
    /* 上：戻る・メニューのボタンの下から（丸の上はし）／下：名前の下はしが、管理者モードのボタンにかからないところまで */
    const yTop = 64 + 46, yBot = H - 50 - 72;
    cx = W / 2; cy = (yTop + yBot) / 2;
    ro = { x: Math.min(W / 2 - 54, 300), y: Math.max(120, Math.min((yBot - yTop) / 2, 330)) };
    ri = { x: Math.max(82, ro.x * 0.62), y: Math.max(125, ro.y * 0.66) };
    const o1 = $("#orbIn"), o2 = $("#orbOut");
    o1.style.cssText = `left:${cx-ri.x}px;top:${cy-ri.y}px;width:${ri.x*2}px;height:${ri.y*2}px`;
    o2.style.cssText = `left:${cx-ro.x}px;top:${cy-ro.y}px;width:${ro.x*2}px;height:${ro.y*2}px`;
    sun.style.transform = `translate(${cx - sun.offsetWidth/2}px,${cy - sun.querySelector(".ball").offsetHeight/2}px)`;
  }
  size(); addEventListener("resize", size);
  /* 丸の中心（ボールの中心）を、軌道の上に置きます */
  const off = el => ({ x: el.offsetWidth / 2, y: el.querySelector(".ball").offsetHeight / 2 });
  let held = false, last = performance.now(), ang = -Math.PI / 2;
  stage.addEventListener("pointerdown", e=>{ if(e.target.closest(".bub")) held = true; });
  addEventListener("pointerup", ()=>{ held = false; }); addEventListener("pointercancel", ()=>{ held = false; });
  /* 内がわ5つは等間隔。外がわ3つは、内がわの丸と丸のあいだ（すき間のまんなか）に置き、
     内と外がいっしょにまわるので、すれちがって重なることがありません */
  const G = 2 * Math.PI / 5;
  const outAt = [0.5 * G, 2.5 * G, 3.5 * G];
  const pos = all.map(()=>({ x: 0, y: 0 }));
  function frame(t){
    const dt = Math.min(64, t - last); last = t;
    if(!reduce && !held && !popOpen) ang += dt * (2 * Math.PI / 80000);   /* 80秒でひとまわり */
    all.forEach((el, i)=>{
      const isIn = i < ins.length, k = isIn ? i : i - ins.length;
      const a = ang + (isIn ? k * G : outAt[k]), r = isIn ? ri : ro;
      pos[i].x = cx + r.x * Math.cos(a); pos[i].y = cy + r.y * Math.sin(a);
    });
    all.forEach((el, i)=>{
      const o = off(el), p = pos[i];
      /* 名前が画面の左右からはみ出さないように */
      const hw = Math.max(o.x, el.querySelector(".nm").offsetWidth / 2) + 4;
      const x = Math.min(Math.max(p.x, hw), W - hw);
      el.style.transform = `translate(${(x - o.x).toFixed(1)}px,${(p.y - o.y).toFixed(1)}px)`;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

<script src="../menu.js"></script>
