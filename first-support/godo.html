<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>合同説明会｜Skyarc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../beta.css">
<meta name="theme-color" content="#E8663D">
<script src="../loading.js"></script>
<script src="../login.js"></script>
<style>
  :root{ --ink:#3E2C24; --main:#E8663D; --deep:#B8462A; --soft:#FFF1EA; --line:#F3D3C4; --shadow:0 4px 18px rgba(140,70,30,.12); --ok:#2E8A6E; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);line-height:1.85;font-size:15px;background:#FFFAF6;}
  button,textarea,input{font-family:inherit;}
  button{cursor:pointer;border:none;}
  #skyNav{position:sticky;top:0;z-index:30;background:rgba(184,70,42,.96);color:#fff;}
  #skyNav .inner{max-width:560px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;}
  #skyNav a{background:rgba(255,255,255,.2);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:6px 13px;text-decoration:none;}
  @media (max-width:700px){ #skyNav .inner{padding-right:74px;} .wip{margin-right:62px !important;} .prog{margin-right:62px;} }
  .wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px;}
  .wip{background:#FFF3E0;border:2px dashed #FFB74D;color:#E65100;border-radius:12px;padding:8px 6px;font-size:min(12.5px,3.1vw);font-weight:700;text-align:center;margin:4px 0 10px;white-space:nowrap;}
  .prog{display:flex;gap:5px;margin:2px 0 12px;}
  .prog i{flex:1;height:7px;border-radius:9px;background:#F1DED4;}
  .prog i.on{background:var(--main);}
  .card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px 16px 16px;animation:cin .35s ease both;}
  @keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tag{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:var(--main);border-radius:999px;padding:1px 11px;margin-bottom:8px;}
  h2{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:18px;line-height:1.6;margin-bottom:8px;}
  h3{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:15px;color:var(--deep);margin:14px 0 4px;}
  p{margin-bottom:8px;}
  .sub{font-size:13px;color:#7A6258;}
  .box{background:var(--soft);border-radius:14px;padding:11px 13px;margin:8px 0;font-size:14.5px;}
  .talk{background:#FFF8E1;border-left:4px solid #FFB74D;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap;}
  .agree{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0 4px;font-weight:700;font-size:15px;cursor:pointer;}
  .agree input{width:22px;height:22px;accent-color:var(--main);}
  .nav{display:flex;gap:8px;margin-top:14px;}
  .nav .back{flex:0 0 auto;background:#fff;border:2px solid var(--line);color:#7A6258;border-radius:13px;padding:12px 16px;font-weight:700;font-size:14px;}
  .nav .next{flex:1;background:var(--main);color:#fff;border-radius:13px;padding:13px;font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:16px;}
  .nav .next:disabled{opacity:.4;}
  .adv{margin-top:12px;}
  .adv .an{font-weight:900;color:var(--deep);font-size:14.5px;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
  .allck{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:#7A6258;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;}
  .allck input{width:17px;height:17px;accent-color:var(--main);}
  .pick label{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;font-size:14.5px;cursor:pointer;}
  .pick input{width:20px;height:20px;accent-color:var(--main);}
  input[type=text]{width:100%;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;}
  .urls{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;word-break:break-all;}
  .slot{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0;background:#fff;cursor:pointer;font-size:14.5px;}
  .slot input{width:20px;height:20px;accent-color:var(--main);flex:0 0 auto;}
  .slot.on{border-color:var(--main);background:var(--soft);}
  .slot .cnt{margin-left:auto;font-size:11.5px;color:#9A8278;white-space:nowrap;}
  .acts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .acts button,.acts a{display:block;width:100%;text-align:center;border-radius:12px;padding:11px;font-weight:700;font-size:14.5px;text-decoration:none;}
  .b1{background:var(--main);color:#fff;} .b2{background:#fff;color:var(--deep);border:2px solid var(--main) !important;} .b3{background:#4E8FD8;color:#fff;}
  .calbox{background:#F3F8FE;border-radius:14px;padding:10px 12px;margin-top:8px;}
  .calbox a{display:block;background:#fff;border:1.5px solid #B9D3F2;border-radius:10px;padding:8px 10px;margin:5px 0;color:#2B5E9E;font-size:13.5px;font-weight:700;text-decoration:none;}
  textarea{width:100%;min-height:230px;font-size:15px;line-height:1.7;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:#FFFDFB;color:var(--ink);resize:vertical;}
  ul.lst{margin:4px 0 8px 1.2em;font-size:14.5px;} ul.lst li{margin:3px 0;}
  .msg{font-size:13px;font-weight:700;min-height:1em;margin-top:6px;}
  .at{font-size:11.5px;color:#9A8278;margin-top:4px;}
  .verTag{display:block;text-align:center;font-size:9.5px;color:#D4C0B4;font-family:monospace;padding:16px 0 20px;}
</style>
</head>
<body>
<div id="skyNav"><div class="inner">
  <a href="skyarc.html" class="back-btn">↩️ LINK活用法へ</a>
  <a class="sky-home" href="../index.html">🏠 ホーム</a>
</div></div>

<div class="wrap">
  <p class="wip">🚧 更新中です。足りないところは、これから足していきます</p>
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
  <div class="verTag"></div>
</div>

<script>
/* ================================================================
   合同説明会（v1.2.075／v1.2.121：はじめに、集客ニーズの方に特化した説明会であることの案内を追加）
   ----------------------------------------------------------------
   ① はじめに（流れを理解してから使ってください → 「わかりました」）
   ② アドバイザーの合同説明会の日程（スプレッドシートから、その時の最新を読みます）
      ・同席できる日にチェック → カレンダーに入れる／文章をコピー
   ③ 紹介したい方への日程調整の連絡（アドバイザーごとに日程を並べた文章をコピー）
   ④ 日程が決まったら：詳細の文章（日時・Zoom・アドバイザーのプロフィール）をコピーして送る（v1.2.075）
   ⑤ スプレッドシートに書く
   ⑥ 説明会の前に（本当にやりたいことを、直前の電話で聞く）
   ⑦ 説明会の当日・終わったら（登録が終わったら、Skyarc LINKサポートとLINKポータルを教える）
   ・いまはいと・すけさん・佐藤律子さんの合同説明会だけ。高山翔子さんの分などは、アップラインの方へ
================================================================ */
const $ = q => document.querySelector(q);
const GAS_URL = window.SKY_GAS_URL;
let member = null;
try{ const raw = localStorage.getItem("skyarc_member"); if(raw && raw !== "null") member = JSON.parse(raw); }catch(e){}
if(member && !member.id) member = null;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let step = 0, agreed = false, data = null, picked = {}, msgText = null, decided = null, guest = "", detText = null;
const STEPS = 7;

function setProg(){ $("#prog").innerHTML = Array.from({length:STEPS}, (_, i) => '<i class="' + (i <= step ? "on" : "") + '"></i>').join(""); }
function go(n){ step = n; draw(); scrollTo(0, 0); }
function nav(nextLabel, canNext){
  return '<div class="nav">' + (step > 0 ? '<button type="button" class="back" id="bBack">‹ もどる</button>' : "") +
    (nextLabel ? '<button type="button" class="next" id="bNext"' + (canNext === false ? " disabled" : "") + '>' + nextLabel + '</button>' : "") + '</div>';
}
function bindNav(){
  const b = $("#bBack"), n = $("#bNext");
  if(b) b.onclick = () => go(step - 1);
  if(n) n.onclick = () => go(step + 1);
}
/* 日付の見せ方：11月18日（水）13:00〜15:00 */
function slotText(x){ const p = x.date.split("/"); return Number(p[1]) + "月" + Number(p[2]) + "日（" + x.wd + "）" + x.start + "〜" + x.end; }
function pickedList(){ return (data && data.list || []).filter((x, i) => picked[i]); }
function key(x){ return x.adv + "|" + x.date + "|" + x.start; }

function draw(){
  setProg();
  [drawIntro, drawSlots, drawMsg, drawDecided, drawSheet, drawBefore, drawDay][step]();
  bindNav();
}

/* ① はじめに */
function drawIntro(){
  $("#stage").innerHTML = '<div class="card"><span class="tag">はじめに</span>' +
    '<h2>🎤 Skyarc LINK 合同説明会</h2>' +
    '<div class="box" style="background:#FFF3E0;border-left:4px solid #FB8C00;">この合同説明会は<b>集客（何かしら広げたいものがあるかどうか）にニーズのある方に特化した事業説明会</b>になっています。<br>お勤めの方や、表面ニーズが分からない方は、ぜひ<b>個別でヒアリングできるアドバイザーの資格のある、自分のグループの方</b>に依頼をかけてください。</div>' +
    '<p>LINKのことが気になる方がいたら、アドバイザーの合同説明会に、<b>その方と一緒に参加</b>することができます。</p>' +
    '<div class="box">合同説明会の申し込みなどは、<b>このあとの流れに沿って、内容を理解したうえで</b>ご利用ください。</div>' +
    '<label class="agree"><input type="checkbox" id="agree"' + (agreed ? " checked" : "") + '> わかりました</label>' +
    nav("次へ ›", agreed) + '</div>';
  $("#agree").onchange = e => { agreed = e.target.checked; $("#bNext").disabled = !agreed; };
}

/* ② 日程 */
function drawSlots(){
  let h = '<div class="card"><span class="tag">日程</span><h2>アドバイザーの合同説明会の日程</h2>' +
    '<p class="sub">いまご案内しているのは、<b>いと・すけさん</b>と<b>佐藤律子さん</b>の合同説明会です。<br>高山翔子さんの合同説明会などについては、<b>アップラインの方に直接お尋ねください</b>。</p>' +
    '<div class="box">あなたが<b>同席できる日</b>にチェックしてください。<br>説明会は<b>はじめの1時間が説明</b>、<b>あとの1時間が質疑応答</b>の、あわせて2時間です。</div>' +
    '<div id="slots"><p class="sub">日程を読み込んでいます…</p></div>' +
    '<div class="acts"><button type="button" class="b1" id="bCal">📅 チェックした日をカレンダーに入れる</button></div>' +
    '<div id="calArea"></div><p class="msg" id="m1"></p>' +
    nav("紹介したい方への連絡へ ›") + '</div>';
  $("#stage").innerHTML = h;
  $("#bCal").onclick = showCal;
  if(data) drawSlotList(); else loadSlots(false);
}
async function loadSlots(fresh){
  if(!member){
    $("#slots").innerHTML = '<p class="sub">日程を見るには、ログインが必要です。</p><div class="acts"><button type="button" class="b1" onclick="skyLoginRequired(function(){ location.reload(); })">🌱 ログインする</button></div>';
    return;
  }
  try{
    const r = await fetch(GAS_URL + "?action=godoList&id=" + encodeURIComponent(member.id) + "&pin=" + encodeURIComponent(member.pin) + (fresh ? "&fresh=1" : ""));
    const j = await r.json();
    if(!j || !j.ok){
      $("#slots").innerHTML = '<p class="sub">' + (j && j.error === "unknown_action" ? "まだ日程を読むしくみが用意できていません（GASの更新待ち）。" : "日程を読み込めませんでした。少しおいてお試しください。") + '</p>';
      return;
    }
    data = j; picked = {}; drawSlotList();
  }catch(e){ $("#slots").innerHTML = '<p class="sub">通信できませんでした。電波のよい場所でお試しください。</p>'; }
}
function drawSlotList(){
  const box = $("#slots"); if(!box) return;
  const advs = [];
  data.list.forEach(x => { if(advs.indexOf(x.adv) < 0) advs.push(x.adv); });
  (data.sheets || []).forEach(s => { if(advs.indexOf(s.adv) < 0) advs.push(s.adv); });
  box.innerHTML = advs.map(a => {
    const items = data.list.map((x, i) => ({ x, i })).filter(o => o.x.adv === a);
    const allOn = items.length && items.every(o => picked[o.i]);
    return '<div class="adv"><p class="an">🎤 ' + esc(a) + 'さん' +
      (items.length ? '<label class="allck"><input type="checkbox" data-adv="' + esc(a) + '"' + (allOn ? " checked" : "") + '> すべてチェック</label>' : "") + '</p>' +
      (items.length ? items.map(o => '<label class="slot' + (picked[o.i] ? " on" : "") + '"><input type="checkbox" data-i="' + o.i + '"' + (picked[o.i] ? " checked" : "") + '>' +
        '<span>' + esc(slotText(o.x)) + '</span><span class="cnt">いま' + o.x.n + '名</span></label>').join("")
        : '<p class="sub">これからの日程は、まだ入っていません。</p>') + '</div>';
  }).join("") +
  '<p class="at">' + esc(data.at) + ' に読み込んだ日程です（「いま◯名」は、スプレッドシートに名前が入っている人数）。<a href="#" id="reload">🔄 もう一度読み込む</a></p>';
  box.querySelectorAll(".slot input").forEach(c => c.onchange = () => { picked[+c.dataset.i] = c.checked; msgText = null; decided = null; $("#calArea").innerHTML = ""; drawSlotList(); });
  box.querySelectorAll(".allck input").forEach(c => c.onchange = () => {
    data.list.forEach((x, i) => { if(x.adv === c.dataset.adv) picked[i] = c.checked; });
    msgText = null; decided = null; $("#calArea").innerHTML = ""; drawSlotList();
  });
  $("#reload").onclick = e => { e.preventDefault(); box.innerHTML = '<p class="sub">日程を読み込んでいます…</p>'; loadSlots(true); };
}
/* カレンダーに入れる：Googleカレンダーは1件ずつ、iPhone（iCloud）は .ics でまとめて */
function gcalUrl(x){
  const p = x.date.replace(/\//g, ""), s = x.start.replace(":", ""), e = x.end.replace(":", "");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent("LINK合同説明会（" + x.adv + "さん）同席") +
    "&dates=" + p + "T" + s + "00/" + p + "T" + e + "00&ctz=Asia/Tokyo&details=" + encodeURIComponent("はじめの1時間が説明会、あとの1時間が質疑応答です。");
}
function showCal(){
  const l = pickedList();
  if(!l.length) return say("#m1", "先に、同席できる日にチェックしてください", true);
  say("#m1", "");
  $("#calArea").innerHTML = '<div class="calbox"><p style="font-weight:700;font-size:13.5px;">Googleカレンダーの方（1件ずつ開きます）</p>' +
    l.map(x => '<a href="' + gcalUrl(x) + '" target="_blank" rel="noopener">＋ ' + esc(slotText(x)) + '　' + esc(x.adv) + 'さん</a>').join("") +
    '<p style="font-weight:700;font-size:13.5px;margin-top:10px;">iPhone（iCloud）のカレンダーの方</p>' +
    '<a href="#" id="ics">＋ チェックした' + l.length + '件を、まとめて入れる</a></div>';
  $("#ics").onclick = e => { e.preventDefault(); downloadIcs(l); };
}
function downloadIcs(l){
  const st = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = l.map((x, i) => {
    const p = x.date.replace(/\//g, "");
    return ["BEGIN:VEVENT", "UID:godo-" + p + x.start.replace(":", "") + "-" + i + "@skyarc", "DTSTAMP:" + st,
      "DTSTART;TZID=Asia/Tokyo:" + p + "T" + x.start.replace(":", "") + "00", "DTEND;TZID=Asia/Tokyo:" + p + "T" + x.end.replace(":", "") + "00",
      "SUMMARY:LINK合同説明会（" + x.adv + "さん）同席", "DESCRIPTION:はじめの1時間が説明会、あとの1時間が質疑応答です。", "END:VEVENT"].join("\r\n");
  }).join("\r\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Skyarc//godo//JA",
    "BEGIN:VTIMEZONE", "TZID:Asia/Tokyo", "BEGIN:STANDARD", "DTSTART:19700101T000000", "TZOFFSETFROM:+0900", "TZOFFSETTO:+0900", "TZNAME:JST", "END:STANDARD", "END:VTIMEZONE",
    ev, "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type:"text/calendar" }));
  a.download = "goudou-setsumeikai.ics";
  document.body.appendChild(a); a.click(); a.remove();
}

/* ③ 日程調整の連絡 */
function defaultMsg(){
  const l = pickedList();
  const advs = []; l.forEach(x => { if(advs.indexOf(x.adv) < 0) advs.push(x.adv); });
  return "〇〇さん、LINKの合同説明会の日程をお送りしますね😊\n次の中から、ご都合のよい日を教えてください。\n\n" +
    (l.length ? advs.map(a => "【" + a + "さんの合同説明会】\n" + l.filter(x => x.adv === a).map(x => "・" + slotText(x)).join("\n")).join("\n\n") : "・（日程）") +
    "\n\nはじめの1時間が説明会、あとの1時間が質問の時間です（Zoomで参加できます）。\n私も一緒に参加します！よろしくお願いします。";
}
function drawMsg(){
  if(msgText === null) msgText = defaultMsg();
  $("#stage").innerHTML = '<div class="card"><span class="tag">連絡</span><h2>紹介したい方に、日程調整の連絡をしましょう</h2>' +
    '<p>チェックした日程で、文章を作りました。「〇〇さん」などを書きかえて、コピーして送ってください。</p>' +
    (pickedList().length ? "" : '<p class="sub" style="color:#C62828;">まだ日程にチェックがありません。「もどる」でチェックすると、日程が入ります。</p>') +
    '<textarea id="msg"></textarea>' +
    '<div class="acts"><button type="button" class="b1" id="bCopy2">📋 この文章をコピー</button></div><p class="msg" id="m2"></p>' +
    nav("コピーして送ったら、次の工程を見る ›") + '</div>';
  $("#msg").value = msgText;
  $("#msg").oninput = e => { msgText = e.target.value; };
  $("#bCopy2").onclick = () => copy($("#msg").value, "#m2");
}

/* ④ 日程が決まったら：詳細の文章 */
function sheetOf(adv){ return (data && data.sheets || []).filter(s => s.adv === adv)[0] || {}; }
function detailMsg(){
  if(!decided) return "";
  const sh = sheetOf(decided.adv);
  const p = decided.date.split("/");
  return (guest || "〇〇") + "さん、" + Number(p[1]) + "月" + Number(p[2]) + "日（" + decided.wd + "）" + decided.start + "から、LINKの説明会のお申し込み、ありがとうございます😊\n" +
    "私も一緒に参加しますので、ご安心くださいね。\n\n" +
    "では、当日のオンライン（Zoom）の情報をお送りします。\n" + (sh.zoom || "（Zoomの情報）") + "\n\n" +
    "当日、LINKのことを説明してくださる" + decided.adv + "さんのプロフィールをお預かりしていますので、お送りしますね。\n\n" +
    (sh.profile || "（プロフィール）") + "\n\n" +
    "改めまして、当日よろしくお願いします。\n" +
    "当日はオンラインでの参加になりますので、電波状況の確認のために、お電話させていただくこともありますが、よろしくお願いしますね。";
}
function drawDecided(){
  const l = pickedList().length ? pickedList() : (data && data.list || []);
  let h = '<div class="card"><span class="tag">日程が決まったら</span><h2>決まった日の詳細を送りましょう</h2>' +
    '<p>日程が決まったら、「この日でお願いします、ありがとうございます。では詳細をお送りしますね」とお返事して、次の文章を送ります。</p>' +
    '<p class="lab" style="font-weight:700;font-size:13.5px;margin-top:8px;">① 決まった日を選んでください</p>' +
    (l.length ? '<div class="pick">' + l.map(x => { const i = data.list.indexOf(x);
      return '<label><input type="radio" name="dec" data-i="' + i + '"' + (decided === x ? " checked" : "") + '><span>' + esc(slotText(x)) + '　' + esc(x.adv) + 'さん</span></label>'; }).join("") + '</div>'
      : '<p class="sub">日程が読み込まれていません。「もどる」で日程の画面へ。</p>') +
    '<p class="lab" style="font-weight:700;font-size:13.5px;margin-top:8px;">② お相手のお名前（なくても大丈夫です）</p><input type="text" id="guest" placeholder="〇〇" value="' + esc(guest) + '">' +
    '<p class="lab" style="font-weight:700;font-size:13.5px;margin-top:10px;">③ 送る文章（書きかえてからコピーできます）</p>' +
    '<textarea id="det" style="min-height:300px"></textarea>' +
    '<div class="acts"><button type="button" class="b1" id="bCopy3">📋 この文章をコピー</button></div><p class="msg" id="m3"></p>' +
    nav("コピーして送ったら、次へ ›") + '</div>';
  $("#stage").innerHTML = h;
  const refresh = () => { detText = detailMsg(); $("#det").value = detText || "先に、決まった日を選んでください。"; };
  if(detText) $("#det").value = detText; else refresh();
  document.querySelectorAll('.pick input').forEach(r => r.onchange = () => { decided = data.list[+r.dataset.i]; refresh(); });
  $("#guest").oninput = e => { guest = e.target.value.trim(); if(decided) refresh(); };
  $("#det").oninput = e => { detText = e.target.value; };
  $("#bCopy3").onclick = () => { if(!decided) return say("#m3", "先に、決まった日を選んでください", true); copy($("#det").value, "#m3"); };
}

      : '<p class="sub">スプレッドシートの場所は、日程を読み込むと出ます（「もどる」で日程の画面へ）。</p>') + '</div>' +
    nav("次へ ›") + '</div>';
}

function say(sel, t, bad){ const m = $(sel); if(!m) return; m.style.color = bad ? "#C62828" : "#2E7D32"; m.textContent = t; }
async function copy(t, sel){
  try{ await navigator.clipboard.writeText(t); say(sel, "✅ コピーしました"); }
  catch(e){
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); say(sel, "✅ コピーしました"); }catch(_){ say(sel, "コピーできませんでした。長押しで選んでコピーしてください", true); }
    ta.remove();
  }
}
