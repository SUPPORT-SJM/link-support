<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BAM</title>
<style>
  :root{ --bg:#7494C0; --bubble:#fff; --text:#333; --bar:rgba(0,0,0,.28); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
    min-height:100vh;color:var(--text);overscroll-behavior-y:contain;
  }
  #bar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
    background:var(--bar);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    color:#fff;font-size:14px;
  }
  #bar a,#bar button{
    color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:8px;
    padding:6px 10px;font-size:13px;text-decoration:none;cursor:pointer;
    line-height:1;font-family:inherit;
  }
  #daytitle{flex:1;text-align:center;font-weight:600;font-size:14px}

  #chat{max-width:600px;margin:0 auto;padding:18px 12px 160px}
  .date-header{text-align:center;margin:6px 0 18px}
  .date-header span{background:rgba(0,0,0,.2);color:#fff;font-size:12px;padding:5px 12px;border-radius:20px}
  .msg{display:none;margin-bottom:14px;justify-content:flex-start}
  .msg.shown{display:flex;animation:popup .28s cubic-bezier(.175,.885,.32,1.1) both}
  @keyframes popup{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
  .bubble{
    max-width:90%;padding:10px 14px;border-radius:18px;border-top-left-radius:3px;
    font-size:15px;line-height:1.65;word-break:break-word;background:var(--bubble);
    box-shadow:0 1px 2px rgba(0,0,0,.12);
  }
  .bubble a{color:#1a6fd4}
  /* 画像・動画は中央に置く。横に広がりすぎないよう上限を付ける */
  .msg.center{justify-content:center}
  .bare{padding:0;background:transparent;box-shadow:none;border-radius:12px;
        max-width:min(100%,460px)}
  .bare img,.bubble img{max-width:100%;height:auto;border-radius:12px;display:block;cursor:zoom-in}
  .bare video{max-width:100%;border-radius:12px;display:block;background:#000}
  /* Googleドライブの埋め込み */
  .gdrive{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;display:block;background:#000}
  /* チェックボタン（リアクション） */
  .msg{align-items:flex-end;gap:7px}
  .check{
    flex:0 0 auto;width:27px;height:27px;padding:0;margin-bottom:2px;
    border-radius:50%;border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.16);color:rgba(255,255,255,.85);
    font-size:13px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,transform .12s;
  }
  .check:hover{background:rgba(255,255,255,.3)}
  /* 中央寄せの行でチェックボタンの幅を打ち消し、画像を本当の中央に保つ */
  .spacer{flex:0 0 27px}
  .check.on{background:#41a05e;border-color:#41a05e;color:#fff;transform:scale(1.06)}

  /* 動画の視聴状況 */
  .vwrap{display:flex;flex-direction:column;gap:5px}
  .vprog{
    font-size:11px;line-height:1.5;color:rgba(255,255,255,.85);
    background:rgba(0,0,0,.22);border-radius:20px;padding:3px 10px;
    align-self:center;white-space:nowrap;
  }
  .vprog.done{background:#41a05e;color:#fff}

  .pagenote{
    margin:28px auto 0;max-width:460px;text-align:center;
    background:rgba(0,0,0,.2);border-left:3px solid #ffd66b;
    color:rgba(255,255,255,.9);font-size:11.5px;line-height:1.7;
    padding:9px 12px;border-radius:8px;
  }
  /* リンク先の記事（Evernote）の保存版を、新しいタブで開くカード */
  .bubble a.art{
    display:flex;align-items:center;gap:9px;margin:10px 0 0;
    border:1px solid #d9e0ea;border-radius:10px;background:#eef3fa;
    padding:10px 12px;font-size:13.5px;line-height:1.5;
    color:#33517a;text-decoration:none;
  }
  .bubble a.art + a.art{margin-top:8px}
  a.art .ico{flex:0 0 auto;font-size:14px}
  a.art .tt{flex:1;min-width:0;font-weight:700;word-break:break-word}
  a.art .cv{flex:0 0 auto;font-size:11px;color:#7b8ba6;white-space:nowrap}

  .note{justify-content:center}
  .note .pill{background:rgba(0,0,0,.22);color:#fff;font-size:12px;padding:6px 14px;border-radius:20px;max-width:90%;text-align:center;line-height:1.5}

  /* 読み込めなかったファイルの表示 */
  .broken{
    background:#ffe9e9;border:1px dashed #d15;border-radius:10px;
    padding:10px 12px;font-size:12px;color:#b00;line-height:1.6;
    word-break:break-all;max-width:100%;
  }
  .broken b{display:block;margin-bottom:4px}

  #tap-guide{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    background:rgba(0,0,0,.5);color:#fff;padding:8px 16px;border-radius:20px;
    font-size:13px;pointer-events:none;animation:pulse 1.6s infinite;z-index:20;
  }
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  #footer{
    position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:10px;justify-content:center;
    padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,0));
  }
  #footer button,#footer a{
    background:#fff;color:#33517a;border:0;border-radius:22px;padding:11px 20px;
    font-size:14px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.2);
    cursor:pointer;text-decoration:none;font-family:inherit;
  }
  #footer .ghost{background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
  .hide{display:none !important}

  /* 記事の保存版を、この画面の上に重ねて開く */
  #artview{position:fixed;inset:0;z-index:95;background:#fff;display:none;flex-direction:column}
  #artview.on{display:flex}
  #artbar{
    flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px;
    background:#fff;border-bottom:1px solid #e3e7ee;
  }
  #artbar button{
    flex:0 0 auto;font-family:inherit;font-size:13.5px;font-weight:700;color:#33517a;
    background:#eef3fa;border:0;border-radius:18px;padding:8px 14px;cursor:pointer;
  }
  #artbar button.hide{display:none}
  #arttitle{flex:1;min-width:0;font-size:12.5px;color:#556;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #artframe{flex:1 1 auto;min-height:0;position:relative;background:#fff}
  #artframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #artload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#889}

  #lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain}

  #resume{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:24px}
  #resume.on{display:flex}
  #resume .card{background:#fff;border-radius:16px;padding:24px 22px;max-width:320px;width:100%;text-align:center}
  #resume p{margin:0 0 18px;font-size:15px;line-height:1.6}
  #resume button{display:block;width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;font-size:15px;font-family:inherit;cursor:pointer}
  #resume .primary{background:#33517a;color:#fff}
  #resume .second{background:#eef1f6;color:#33517a}

  /* 診断パネル */
  #diag{
    max-width:600px;margin:0 auto 16px;background:#fffbe6;border:1px solid #e0c060;
    border-radius:12px;padding:14px 16px;font-size:12.5px;line-height:1.75;color:#5c4600;
    word-break:break-all;
  }
  #diag h3{margin:0 0 8px;font-size:13px}
  #diag code{background:rgba(0,0,0,.07);padding:1px 5px;border-radius:4px}
  #diag .ok{color:#0a7a3d}
  #diag .ng{color:#c00;font-weight:700}
  #diag button{margin-top:12px;background:#5c4600;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:12px;font-family:inherit;cursor:pointer}
  #diag hr{border:0;border-top:1px solid #e0c060;margin:12px 0}
  #diag b{color:#8a3b00}

  /* ---------- 絵文字の見た目（LINEの録画を見て近づけたもの） ----------
     本文の {{…}} が飾りの指定。文字そのものは変えていない。 */
  .dU{text-decoration-line:underline;text-decoration-color:var(--c,currentColor);
      text-decoration-thickness:4px;text-underline-offset:7px;text-decoration-skip-ink:none}
  .dU-wavy{text-decoration-style:wavy;text-decoration-thickness:2px}
  .dU-double{text-decoration-style:double;text-decoration-thickness:3px}
  .dU-dotted{text-decoration-style:dotted;text-decoration-thickness:3px}
  .dU-thin{text-decoration-thickness:1.5px;text-underline-offset:6px}
  .dW{font-weight:800;color:var(--c,#e0245e);font-size:1.15em;letter-spacing:.03em}
  .dW-box{background:var(--c,#3d6fd8);color:#fff;padding:0 .25em;border-radius:4px;margin:0 .05em}
  .dW-boxl{background:var(--c,#f5ff70);color:#2a2a2a;padding:0 .25em;border-radius:4px;margin:0 .05em}
  .dW-banner{background:var(--c,#e0203a);color:#fff;padding:.05em .45em;border-radius:3px;
             font-size:1.25em;letter-spacing:.06em;display:inline-block;line-height:1.35;margin:2px 0}
  .dT{display:inline-block;font-weight:800;line-height:1.4}
  .dT-note{font-size:.85em;letter-spacing:.04em;padding-left:1.2em}
  .dT-tag{background:#3a3a3a;color:#e9f53a;font-size:.78em;padding:.15em .7em;border-radius:3px;letter-spacing:.06em}
  .dT-sign{background:#b9762c;color:#fff;font-size:.85em;padding:.05em .9em;border-radius:4px;border:2px solid #7d4c18}
  .dT-ribbon{background:var(--c,#e8508a);color:#fff;font-size:.95em;padding:.15em 1.4em;border-radius:3px}
  .dT-icon{font-size:.68em;color:#3f8a62;border:1.5px solid #3f8a62;border-radius:999px;
           padding:0 .45em;margin-right:.35em;vertical-align:.18em}
  .dR{color:var(--c,inherit);font-weight:700}
  .dSv{display:inline-block;height:1.6em;vertical-align:-.45em}
  .dSv-b{width:1.05em;margin:0 .3em}
  .dSv-a{width:1.75em;height:1.5em;margin:0 .1em;vertical-align:-.4em}
  /* LINEの絵文字は文字より大きく出るので、同じくらいの大きさにそろえる */
  .dR-emo{font-size:1.35em;line-height:1;vertical-align:-.12em;margin:0 .04em;font-weight:400;
          font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .dR-txt{font-weight:400}
  .dR-brk{font-size:1.5em;line-height:1;font-weight:900;vertical-align:-.14em;margin:0 .22em;
          -webkit-text-stroke:.6px rgba(60,20,40,.55);text-shadow:1px 1px 0 rgba(0,0,0,.18)}
  .dR-kome{font-size:1.35em;line-height:1;font-weight:900;vertical-align:-.1em}
  .dR-qq{font-size:1.3em;font-weight:900;letter-spacing:-.12em;line-height:1;
         background:linear-gradient(90deg,#e05aa0,#b070e0,#f0c040);-webkit-background-clip:text;background-clip:text;color:transparent}
  .dR-bang{font-size:1.3em;font-weight:900;letter-spacing:-.02em;margin:0 .12em;line-height:1;color:#f0a020;-webkit-text-stroke:.6px #b06a10}
  .dR-dbl{font-size:1.3em;font-weight:900;font-style:italic;color:#f2c21b;-webkit-text-stroke:.6px #a07a00;letter-spacing:-.04em;margin:0 .18em}
  .dR-excl{font-size:1.3em;font-weight:900;color:#3fae5a;margin:0 .15em}
  .dR-ring{font-size:1.1em;color:#9b3fb0}
  .dR-arrow{font-size:1.35em!important;line-height:1;vertical-align:-.1em;font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif;font-size:1.05em;margin:0 .08em}
  .dR-arrowbox{background:var(--c,#3b8fe0);color:#fff;border-radius:3px;padding:0 .18em;margin:0 .1em;
               font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",sans-serif}
  .dR-mark{font-size:.9em;margin-right:.15em}
  .dR-box{font-size:1.3em;line-height:1;vertical-align:-.1em;margin-right:.1em}
  .dR-check{font-size:1.3em;line-height:1;vertical-align:-.1em}
  .dS{display:block;width:62%;height:0;margin:.55em 0;border-top:3px dotted #d6b84a}
  .dS-sprout{border-top-color:#6aa84f}
</style>
</head>
<body>

<header id="bar">
  <a href="index.html">≡ 目次</a>
  <span id="daytitle">読み込み中…</span>
  <button id="sound-btn" title="効果音">🔔</button>
</header>

<div id="chat"></div>

<div id="tap-guide">画面をタップして次へ ▼</div>

<div id="footer">
  <button id="all-btn" class="ghost">全部表示</button>
  <a id="next-btn" class="hide" href="#">次の日へ →</a>
</div>

<div id="artview" aria-hidden="true">
  <div id="artbar">
    <button type="button" id="artclose">✕ 閉じる</button>
    <button type="button" id="artback" class="hide">← 前の記事</button>
    <div id="arttitle"></div>
  </div>
  <div id="artframe"><div id="artload">読み込み中…</div></div>
</div>
<div id="lightbox"><img alt=""></div>

<div id="resume">
  <div class="card">
    <p>前回の続きから読みますか？</p>
    <button class="primary" id="r-continue">続きから</button>
    <button class="second" id="r-restart">最初から</button>
  </div>
</div>

<audio id="pop" src="assets/pop.mp3" preload="auto"></audio>

<!-- ===========================================================
     データ読み込み。
     動的読み込みは file:// でブロックされることがあるので、
     ここに静的に並べる。存在しない日は黙って無視される。
     Day9以降を足すときは、この行を1本コピーして増やす。
     =========================================================== -->
<script src="data/manifest.js"></script>
<script src="data/notes.js"></script>
<script src="data/day0.js"></script>
<script src="data/day1.js"></script>
<script src="data/day2.js"></script>
<script src="data/day3.js"></script>
<script src="data/day4.js"></script>
<script src="data/day5.js"></script>
<script src="data/day6.js"></script>
<script src="data/day7.js"></script>
<script src="data/day8.js"></script>
<script src="data/day9.js"></script>

<script>
(function(){
  "use strict";

  var store = {
    get:function(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  var sigSeen={};
  var dayNum = new URLSearchParams(location.search).get('day');
  if(dayNum===null) dayNum = '0';

  var manifest = window.BAM_MANIFEST || null;
  var days     = window.BAM_DAYS || null;
  var data     = days ? days[dayNum] : null;

  var chat=document.getElementById('chat'), guide=document.getElementById('tap-guide'),
      allBtn=document.getElementById('all-btn'), nextBtn=document.getElementById('next-btn'),
      soundBtn=document.getElementById('sound-btn'), pop=document.getElementById('pop'),
      lightbox=document.getElementById('lightbox'), lbImg=lightbox.querySelector('img'),
      resume=document.getElementById('resume');

  /* ---------- データが読めていない場合は診断を出して終了 ---------- */
  if(!manifest || !data){
    guide.classList.add('hide');
    document.getElementById('footer').classList.add('hide');

    var made = days ? Object.keys(days).sort(function(a,b){return a-b;}) : [];
    var d = document.createElement('div');
    d.id = 'diag';
    var h = '';

    if(!manifest){
      /* --- data フォルダ自体が読めていない --- */
      document.getElementById('daytitle').textContent = '読み込みエラー';
      h = '<h3>data フォルダが見つかりません</h3>'
        + '<div>今いる場所： <code>' + esc(decodeURIComponent(location.href)) + '</code></div>'
        + '<div>data/manifest.js … <span class="ng">読めていない</span></div>'
        + '<hr>'
        + (/Temp|Tmp|AppData/i.test(location.href)
            ? '<b>zipを展開せずに開いています。</b>zipファイルを右クリック →「すべて展開」してから、'
              + '展開先の index.html を開いてください。'
            : '<code>viewer.html</code> と同じ階層に <code>data</code> フォルダがあり、'
              + 'その中に <code>manifest.js</code> があるか確認してください。');

    } else {
      /* --- data は読めている。その日の中身が無いだけ --- */
      document.getElementById('daytitle').textContent = dayNum + '日目：準備中';
      h = '<h3>' + esc(dayNum) + '日目の中身は、まだ作られていません</h3>'
        + '<div>data/manifest.js … <span class="ok">読めた</span></div>'
        + '<div>いま中身があるのは … <b>'
        + (made.length ? made.map(function(k){return k+'日目';}).join('、') : 'なし')
        + '</b></div>'
        + '<hr>'
        + 'エラーではありません。<code>data/day' + esc(dayNum) + '.js</code> を作れば表示されます。'
        + '<br><br>作り方は <code>day0.js</code> をコピーして、'
        + '<code>window.BAM_DAYS[0]</code> の <b>0</b> を <b>' + esc(dayNum) + '</b> に変えるだけです。'
        + '<br><span style="opacity:.75">※ この番号を変え忘れると、0日目の中身を上書きしてしまうので注意してください。</span>';
    }

    d.innerHTML = h + '<button onclick="location.href=\'index.html\'">目次に戻る</button>';
    chat.appendChild(d);
    return;
  }

  var nodes=[], idx=0, soundOn = store.get('bam-sound','on')==='on',
      PKEY = 'bam-progress-' + dayNum;
  soundBtn.textContent = soundOn ? '🔔' : '🔕';

  document.title = data.title || ('BAM ' + dayNum + '日目');
  document.getElementById('daytitle').textContent = data.title || '';

  var head=document.createElement('div');
  head.className='date-header';
  head.innerHTML='<span></span>';
  head.firstChild.textContent = data.title || '';
  chat.appendChild(head);

  (data.messages||[]).forEach(function(m){
    var el=render(m); chat.appendChild(el); nodes.push(el);
  });

  /* 各ページ下部の注意書き。文面はここを直接書き換えてください */
  var pagenote=document.createElement('div');
  pagenote.className='pagenote';
  pagenote.textContent='⚠️ 2026年下旬のBAM（AKI CEO）の記録です。Skyarc内限定。外部への共有はしないでください。';
  chat.appendChild(pagenote);

  var hasNext=false;
  if(manifest){
    var pos = manifest.map(function(m){return String(m.day);}).indexOf(String(dayNum));
    if(pos>-1 && manifest[pos+1]){
      nextBtn.href='viewer.html?day='+manifest[pos+1].day;
      nextBtn.textContent=(manifest[pos+1].title||'次の日')+' →';
      hasNext=true;
    }
  }

  var saved = parseInt(store.get(PKEY,'0'),10)||0;
  if(saved>0 && saved<nodes.length){
    resume.classList.add('on');
    document.getElementById('r-continue').onclick=function(){ resume.classList.remove('on'); reveal(saved,false); };
    document.getElementById('r-restart').onclick =function(){ resume.classList.remove('on'); store.set(PKEY,'0'); reveal(1,false); };
  } else {
    reveal(1,false);
  }

  /* ---------- 1件を DOM に ---------- */
  function render(m){
    var wrap=document.createElement('div');
    wrap.className='msg';
    var chk=null, msig=sig(m);

    if(m.type==='note'){
      wrap.className+=' note';
      var pill=document.createElement('div');
      pill.className='pill'; pill.textContent=plainText(m.text);
      wrap.appendChild(pill); return wrap;
    }

    var b=document.createElement('div');
    b.className='bubble';

    if(m.type==='image'||m.type==='sticker'){
      wrap.className+=' center';
      b.className+=' bare';
      var img=document.createElement('img');
      img.src=m.src; img.alt=m.alt||''; img.loading='lazy';
      img.addEventListener('click',function(e){ e.stopPropagation(); lbImg.src=m.src; lightbox.classList.add('on'); });
      img.addEventListener('load', bottom);
      img.addEventListener('error', function(){
        b.className='bubble';
        b.innerHTML='';
        var w=document.createElement('div');
        w.className='broken';
        w.innerHTML='<b>画像が見つかりません</b>';
        var p=document.createElement('div'); p.textContent=m.src;
        w.appendChild(p);
        var h=document.createElement('div');
        h.style.marginTop='6px'; h.style.opacity='.8';
        h.textContent='この場所にこの名前のファイルがあるか確認してください。';
        w.appendChild(h);
        b.appendChild(w);
      });
      b.appendChild(img);

    } else if(m.type==='video' && /drive\.google\.com/.test(m.src||'')){
      /* Googleドライブの動画は iframe で埋め込む。
         別サイト扱いになるため、何%まで見たかは取得できない。 */
      wrap.className+=' center';
      b.className+=' bare';
      var fr=document.createElement('iframe');
      fr.className='gdrive';
      fr.src=m.src;
      fr.loading='lazy';
      fr.allowFullscreen=true;
      fr.setAttribute('allow','autoplay; fullscreen');
      b.appendChild(fr);

    } else if(m.type==='video'){
      wrap.className+=' center';
      b.className+=' bare vwrap';
      var v=document.createElement('video');
      v.src=m.src; v.controls=true; v.playsInline=true; v.preload='metadata';
      if(m.poster) v.poster=m.poster;
      v.addEventListener('click',function(e){ e.stopPropagation(); });

      /* --- 視聴状況の記録 --- */
      var VKEY='bam-vid-'+dayNum+'-'+msig;
      var badge=document.createElement('div');
      badge.className='vprog';
      var seen=parseFloat(store.get(VKEY,'0'))||0;
      paintBadge();
      function paintBadge(){
        if(seen>=0.95){ badge.className='vprog done'; badge.textContent='✓ 最後まで視聴しました'; }
        else if(seen>0){ badge.className='vprog'; badge.textContent='▶ '+Math.round(seen*100)+'% まで視聴'; }
        else { badge.className='vprog'; badge.textContent='未視聴'; }
      }
      var lastSave=0;
      v.addEventListener('timeupdate',function(){
        if(!v.duration || !isFinite(v.duration)) return;
        var r=v.currentTime/v.duration;
        if(r>seen) seen=r;
        var now=Date.now();
        if(now-lastSave>2000){ lastSave=now; store.set(VKEY,String(seen)); paintBadge(); }
      });
      v.addEventListener('ended',function(){
        seen=1; store.set(VKEY,'1'); paintBadge();
        if(chk && !chk.classList.contains('on')) chk.click();   // 見終わったら自動でチェック
      });
      v.addEventListener('error', function(){
        b.className='bubble';
        b.innerHTML='';
        var w=document.createElement('div'); w.className='broken';
        w.innerHTML='<b>動画が見つかりません／再生できません</b>';
        var p=document.createElement('div'); p.textContent=m.src;
        w.appendChild(p); b.appendChild(w);
      });
      b.appendChild(v);
      b.appendChild(badge);

    } else {
      b.innerHTML=renderText(m.text||'');
      Array.prototype.forEach.call(b.querySelectorAll('a'),function(a){
        a.addEventListener('click',function(e){ e.stopPropagation(); });
      });
      attachArticles(b, plainText(m.text));
    }

    wrap.appendChild(b);

    /* --- チェックボタン（この端末にだけ残る） --- */
    if(m.type!=='note'){
      var CKEY='bam-chk-'+dayNum+'-'+msig;
      chk=document.createElement('button');
      chk.className='check';
      chk.type='button';
      chk.title='確認したらチェック';
      var on=store.get(CKEY,'')==='1';
      chk.textContent=on?'✓':'';
      if(on) chk.classList.add('on');
      chk.addEventListener('click',function(e){
        e.stopPropagation();
        var nowOn=!chk.classList.contains('on');
        chk.classList.toggle('on',nowOn);
        chk.textContent=nowOn?'✓':'';
        store.set(CKEY, nowOn?'1':'0');
      });
      if(wrap.classList.contains('center')){
        var sp=document.createElement('span');
        sp.className='spacer';
        wrap.insertBefore(sp, wrap.firstChild);
      }
      wrap.appendChild(chk);
    }
    return wrap;
  }

  /* メッセージの識別子。
     内容から作るのでデータを作り直しても鍵が変わらない。
     同じ内容が複数ある場合は出てきた順に枝番を付けて衝突を避ける。 */
  function sig(m){
    var base=(m.type||'')+'|'+(m.src||plainText(m.text).slice(0,60));
    var h=5381;
    for(var i=0;i<base.length;i++){ h=((h*33)^base.charCodeAt(i))>>>0; }
    var k=h.toString(36);
    var n=sigSeen[k]||0;
    sigSeen[k]=n+1;
    return n? k+'.'+n : k;
  }


  /* ---------- 絵文字の見た目 ----------
     本文の中の {{種類:指定|文字}} は飾りの指定（u=下線 w=文字の強調 t=札・アイコン s=区切り r=記号の置き換え）。
     ・画面に出すときだけ飾りに変える
     ・チェックの記録や記事の判定には、飾りを外した元の文字を使う（今までの記録がそのまま使える） */

  /* カッコと矢印は、LINEの絵文字と同じように太く大きな形で描く */
  function decoSvg(kind,g,c){
    var BRKP={'『':'15,4 5,4 5,26','』':'5,26 15,26 15,4','「':'15,7 5,7 5,19','」':'5,23 15,23 15,11',
            '‹':'14,4 6,15 14,26','›':'6,4 14,15 6,26'};
    var ARR={'➡':'2,11 13,11 13,4 24,15 13,26 13,19 2,19','⬆':'11,28 11,15 4,15 15,3 26,15 19,15 19,28','⬇':'11,2 11,15 4,15 15,27 26,15 19,15 19,2'};
    if(kind==='arrow'){
      var pt=ARR[g]; if(!pt) return esc(g);
      return '<svg class="dSv dSv-a" viewBox="0 0 28 30" aria-hidden="true"><polygon points="'+pt+'" fill="'+c+'" stroke="rgba(0,0,0,.35)" stroke-width="1.2" stroke-linejoin="round"/></svg>';
    }
    var ps=[];
    if(g==='【'||g==='】'){
      var d0=g==='【'?'M15,3 C3,7 3,23 15,27':'M5,3 C17,7 17,23 5,27';
      return '<svg class="dSv dSv-b" viewBox="0 0 20 30" aria-hidden="true"><path d="'+d0+'" fill="none" stroke="rgba(40,10,30,.55)" stroke-width="7.5" stroke-linecap="round"/><path d="'+d0+'" fill="none" stroke="'+c+'" stroke-width="5" stroke-linecap="round"/></svg>';
    }
    if(g==='《') ps=['12,4 4,15 12,26','19,4 11,15 19,26'];
    else if(g==='》') ps=['8,4 16,15 8,26','1,4 9,15 1,26'];
    else if(BRKP[g]) ps=[BRKP[g]];
    else return esc(g);
    var thick=(g==='「'||g==='」');
    var w=(g==='《'||g==='》')?22:20, o='<svg class="dSv dSv-b" viewBox="0 0 '+w+' 30" aria-hidden="true">';
    ps.forEach(function(pt){ o+='<polyline points="'+pt+'" fill="none" stroke="rgba(40,10,30,.55)" stroke-width="'+(thick?10:7)+'" stroke-linejoin="round" stroke-linecap="round"/>'+
                                 '<polyline points="'+pt+'" fill="none" stroke="'+c+'" stroke-width="'+(thick?7.5:4.4)+'" stroke-linejoin="round" stroke-linecap="round"/>'+
                                 '<polyline points="'+pt+'" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>'; });
    return o+'</svg>';
  }
  function decoParse(t){
    var out=[],i=0,buf='';
    while(i<t.length){
      if(t.charAt(i)==='{' && t.charAt(i+1)==='{'){
        var depth=0,j=i,bar=-1;
        for(;j<t.length;j++){
          if(t.charAt(j)==='{'&&t.charAt(j+1)==='{'){depth++;j++;continue;}
          if(t.charAt(j)==='}'&&t.charAt(j+1)==='}'){depth--;if(depth===0)break;j++;continue;}
          if(t.charAt(j)==='|'&&depth===1&&bar<0) bar=j;
        }
        if(j>=t.length){ buf+=t.slice(i); break; }
        if(buf){ out.push({k:'x',s:buf}); buf=''; }
        var head=t.slice(i+2, bar>=0?bar:j).split(':');
        out.push({k:head[0],a:head.slice(1),kids:bar>=0?decoParse(t.slice(bar+1,j)):[]});
        i=j+2;
      } else { buf+=t.charAt(i); i++; }
    }
    if(buf) out.push({k:'x',s:buf});
    return out;
  }
  function decoPlainNodes(ns){
    var s='';
    ns.forEach(function(n){
      if(n.k==='x') s+=n.s;
      else if(n.k==='u'||n.k==='w'||n.k==='r') s+=decoPlainNodes(n.kids);
    });
    return s;
  }
  function plainText(t){ return (t&&t.indexOf('{{')>=0)? decoPlainNodes(decoParse(t)) : (t||''); }
  function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c||'')? c : ''; }
  function decoHtml(ns){
    return ns.map(function(n){
      if(n.k==='x') return linkify(n.s);
      var c=safeColor(n.a[1]), st=c?' style="--c:'+c+'"':'';
      if(n.k==='u') return '<span class="dU dU-'+esc(n.a[0]||'solid')+'"'+st+'>'+decoHtml(n.kids)+'</span>';
      if(n.k==='w') return '<span class="dW dW-'+esc(n.a[0]||'pop')+'"'+st+'>'+decoHtml(n.kids)+'</span>';
      if(n.k==='t'){
        var label=n.a.slice(2).join(':');
        var col=(n.a[0]==='note'&&c)?' style="color:'+c+'"':st;
        return '<span class="dT dT-'+esc(n.a[0]||'note')+'"'+col+'>'+esc(label)+'</span>';
      }
      if(n.k==='r' && (n.a[0]==='brk'||n.a[0]==='arrow')){
        var lab2=n.a.slice(2).join(':'), c2=safeColor(n.a[1])||'#8e2a4a';
        return decoSvg(n.a[0],lab2.charAt(0),c2);
      }
      if(n.k==='r'){
        var lab=n.a.slice(2).join(':'), rc=safeColor(n.a[1]);
        return '<span class="dR dR-'+esc(n.a[0]||'mark')+'"'+(rc?' style="--c:'+rc+'"':'')+'>'+esc(lab)+'</span>';
      }
      if(n.k==='g'){ var k2=parseInt(n.a[0]||'1',10)||1, o=''; for(var q=0;q<k2;q++) o+='<br>'; return o; }
      if(n.k==='s') return '<span class="dS dS-'+esc(n.a[0]||'dots')+'"></span>';
      return '';
    }).join('');
  }
  function renderText(t){ return (t&&t.indexOf('{{')>=0)? decoHtml(decoParse(t)) : linkify(t||''); }
  function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function linkify(t){
    return esc(t)
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g,'<br>');
  }

  /* ---------- リンク先の記事（Evernote）を保存版につなぐ ----------
     data/notes.js に載っているURLが本文に出てきたら、
       1) 本文中のそのURLを押したとき
       2) 吹き出しの下に出す「📄 記事名」のカードを押したとき
     のどちらでも、evernote_archive/ に保存してある記事を、この画面の上に重ねて開く。
     「✕ 閉じる」で、読んでいた場所にそのまま戻る（別のタブは使わない）。
     （本文に見えているURLの文字は、当時のまま変えていない） */
  /* 記事を重ねて開く／閉じる
     ・別タブを使わないので、閉じたときに必ずこの画面の読んでいた場所に戻る
     ・記事の中から別の記事へのリンクは、同じ重ね画面の中で切り替える（「← 前の記事」で戻れる）
     ・スマホの「戻る」でも閉じられる */
  var artview=document.getElementById('artview'),
      artframe=document.getElementById('artframe'),
      arttitle=document.getElementById('arttitle'),
      artback=document.getElementById('artback'),
      artStack=[], artIframe=null, artTimer=null, artPushed=false;

  function hookArticle(a, title){
    a.addEventListener('click',function(e){
      e.stopPropagation();
      /* Ctrl・Shift・中クリックなどで「別タブで開く」を選んだときは、ブラウザに任せる */
      if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||e.button===1) return;
      e.preventDefault();
      openArt(a.href, title||'');
    });
  }

  function openArt(url, title){
    artStack=[{u:url,t:title}];
    artview.classList.add('on');
    artview.setAttribute('aria-hidden','false');
    loadArt();
    if(!artPushed){ try{ history.pushState({bamArt:true},''); artPushed=true; }catch(e){} }
  }

  function loadArt(){
    var cur=artStack[artStack.length-1];
    arttitle.textContent=cur.t||'';
    artback.classList.toggle('hide', artStack.length<2);
    if(artTimer){ clearInterval(artTimer); artTimer=null; }
    if(artIframe){ artIframe.remove(); artIframe=null; }
    /* 毎回あたらしい枠を作る（枠の中の移動がブラウザの「戻る」の履歴に積まれないようにするため） */
    var fr=document.createElement('iframe');
    fr.title=cur.t||'記事';
    fr.src=cur.u;
    artframe.appendChild(fr);
    artIframe=fr;
    var n=0;
    artTimer=setInterval(function(){
      n++;
      if(prepArt(fr) || n>600){ clearInterval(artTimer); artTimer=null; }
    },100);
    fr.addEventListener('load',function(){ prepArt(fr); });
  }

  /* 開いた記事の側を整える：記事自身の「閉じて戻る」バーは隠し、記事内リンクをこの重ね画面の中で扱う */
  function prepArt(fr){
    var d;
    try{ d=fr.contentDocument; }catch(e){ return true; }   /* 中を触れない環境ではそのまま表示する */
    if(!d || !d.head || !d.body) return false;
    if(d.documentElement.getAttribute('data-bam-prep')) return true;
    if(d.location.href==='about:blank') return false;
    d.documentElement.setAttribute('data-bam-prep','1');
    var st=d.createElement('style');
    st.textContent='.bam-bar{display:none !important} html{overscroll-behavior:contain}';
    d.head.appendChild(st);
    if(!arttitle.textContent && d.title) arttitle.textContent=d.title;
    d.addEventListener('click',function(e){
      var t=e.target, a=t && t.closest ? t.closest('a[href]') : null;
      if(t && t.closest && t.closest('#bamClose')){ e.preventDefault(); e.stopImmediatePropagation(); closeArt(false); return; }
      if(!a) return;
      var h=a.getAttribute('href')||'';
      if(/^\d\d_[A-Za-z0-9_-]+\.html$/.test(h)){
        /* 保存してある別の記事へのリンク */
        e.preventDefault(); e.stopImmediatePropagation();
        artStack.push({u:a.href, t:''});   /* 見出しは開いた記事のタイトルから取る */
        loadArt();
      }
    },true);
    d.addEventListener('keydown',function(e){ if(e.key==='Escape') closeArt(false); });
    return true;
  }

  function closeArt(fromPop){
    if(!artview.classList.contains('on')) return;
    artview.classList.remove('on');
    artview.setAttribute('aria-hidden','true');
    if(artTimer){ clearInterval(artTimer); artTimer=null; }
    if(artIframe){ artIframe.remove(); artIframe=null; }
    artStack=[];
    if(artPushed){
      artPushed=false;
      if(!fromPop){ try{ history.back(); }catch(e){} }
    }
  }
  document.getElementById('artclose').addEventListener('click',function(e){ e.stopPropagation(); closeArt(false); });
  artback.addEventListener('click',function(e){
    e.stopPropagation();
    if(artStack.length>1){ artStack.pop(); loadArt(); }
  });
  window.addEventListener('popstate',function(){ if(artview.classList.contains('on')){ closeArt(true); } });

  function archBase(){
    /* 画像を ../day3/ のように一つ上から読んでいる置き方（PCでの確認用）なら、
       保存版も一つ上にある。そうでなければ、このページと同じ場所にある。 */
    var up=false;
    try{
      var ms=(window.BAM_DAYS[dayNum]||{}).messages||[];
      for(var i=0;i<ms.length;i++){
        if(ms[i].src && /^(\.\.\/)?day\d+\//.test(ms[i].src)){ up=(ms[i].src.indexOf('../')===0); break; }
      }
    }catch(e){}
    return (up?'../':'')+'evernote_archive/';
  }

  function attachArticles(b, text){
    var db=window.BAM_NOTES;
    if(!db) return;
    var base=archBase();

    /* 1) 本文中のURL */
    var hit=[];
    Array.prototype.forEach.call(b.querySelectorAll('a'),function(a){
      var key=a.getAttribute('href');
      var n=db[key];
      if(!n || !n.a) return;
      a.setAttribute('href', base+n.a);
      a.setAttribute('target','_blank');
      a.setAttribute('rel','noopener');
      a.title=(n.t||'')+'（保存版を開きます）';
      hookArticle(a, n.t);
      if(hit.indexOf(key)<0) hit.push(key);
    });

    /* 2) 記事名のカード（本文に出てきた順） */
    for(var i=0;i<hit.length;i++){
      var n=db[hit[i]];
      var card=document.createElement('a');
      card.className='art';
      card.href=base+n.a;
      card.target='_blank';
      card.rel='noopener';
      var ico=document.createElement('span'); ico.className='ico'; ico.textContent='📄';
      var tt=document.createElement('span');  tt.className='tt';  tt.textContent=n.t||'記事';
      var cv=document.createElement('span');  cv.className='cv';  cv.textContent='開く';
      card.appendChild(ico); card.appendChild(tt); card.appendChild(cv);
      hookArticle(card, n.t);
      b.appendChild(card);
    }
  }

  function reveal(upTo,withSound){
    for(var i=idx;i<upTo&&i<nodes.length;i++) nodes[i].classList.add('shown');
    idx=Math.min(upTo,nodes.length);
    store.set(PKEY,String(idx));
    if(withSound&&soundOn){ try{ pop.currentTime=0; pop.play().catch(function(){}); }catch(e){} }
    setTimeout(bottom,60);
    if(idx>=nodes.length){
      guide.classList.add('hide'); allBtn.classList.add('hide');
      if(hasNext) nextBtn.classList.remove('hide');
    }
  }
  function bottom(){ window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'}); }

  document.addEventListener('click',function(e){
    if(e.target.closest('#bar,#footer,#lightbox,#resume,#artview,a,button,video,iframe')) return;
    if(idx<nodes.length) reveal(idx+1,true);
  });
  document.addEventListener('keydown',function(e){
    if(artview.classList.contains('on')){ if(e.key==='Escape') closeArt(false); return; }
    if(e.key===' '||e.key==='ArrowDown'||e.key==='Enter'){ if(idx<nodes.length){ e.preventDefault(); reveal(idx+1,true); } }
    if(e.key==='Escape') lightbox.classList.remove('on');
  });
  allBtn.addEventListener('click',function(e){ e.stopPropagation(); reveal(nodes.length,false); });
  soundBtn.addEventListener('click',function(e){
    e.stopPropagation(); soundOn=!soundOn;
    soundBtn.textContent=soundOn?'🔔':'🔕';
    store.set('bam-sound',soundOn?'on':'off');
  });
  lightbox.addEventListener('click',function(){ lightbox.classList.remove('on'); });
})();
</script>
