<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ファーストサポート 仮組み</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo","Noto Sans JP",sans-serif;background:radial-gradient(ellipse at 50% 45%,#FFFFFF 0%,#FFF8F0 55%,#FDEFE3 100%);color:#3E2723}
.ttl{position:fixed;left:16px;top:16px;z-index:20;font-weight:900;font-size:18px;pointer-events:none}
.ttl small{display:block;font-size:11.5px;font-weight:700;color:#8D6E63}
#stage{position:fixed;inset:0;overflow:hidden}
.orb{position:absolute;left:0;top:0;border:1px dashed rgba(230,120,50,.16);border-radius:50%;pointer-events:none}
.bub{position:absolute;left:0;top:0;width:118px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;background:none;border:none;font-family:inherit;color:inherit;padding:0;transition:opacity .4s}
.bub .ball{position:relative;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#fff;border:3px solid #FF8A50;box-shadow:0 6px 16px rgba(140,70,30,.16)}
.bub .num{position:absolute;left:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#FF7043;color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.bub .nm{font-weight:700;font-size:13px;line-height:1.3;text-align:center;white-space:pre;background:rgba(255,255,255,.92);border-radius:8px;padding:2px 7px}
.bub.center .ball{width:62px;height:62px;font-size:26px;border-color:#8E86C8}
.bub.center .nm{color:#6E5FB5;font-size:12.5px}
/* 自分で完了：青く光る */
.bub.me .ball{border-color:#29B6F6;animation:glowB 1.8s ease-in-out infinite}
@keyframes glowB{0%,100%{box-shadow:0 0 0 4px rgba(41,182,246,.35),0 0 18px rgba(41,182,246,.55)}50%{box-shadow:0 0 0 8px rgba(41,182,246,.18),0 0 30px rgba(41,182,246,.8)}}
.bub.me .num{background:#29B6F6}
/* サポーター（先生）の丸もついた：虹色に光る */
.bub.ok .ball{border-color:transparent;animation:none;box-shadow:0 0 26px rgba(255,170,120,.7)}
.bub.ok .ball::before{content:"";position:absolute;inset:-7px;border-radius:50%;z-index:-1;
  background:conic-gradient(#F49AC1,#F5A97A,#F5D06A,#8FD9A8,#6FC7D9,#7BA3E8,#A88BE0,#F49AC1);animation:spin 3s linear infinite;filter:blur(1px)}
.bub.ok .ball::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.bub.ok .num{background:linear-gradient(135deg,#F49AC1,#7BA3E8)}
.bub .mark{position:absolute;right:-8px;bottom:-6px;font-size:18px}
/* 次へ */
.bub.next .ball{font-size:32px;border-color:#FFA726;animation:glowY 1.8s ease-in-out infinite}   /* 次へ：ほかの丸と同じ形で、黄色・オレンジに光る（できた！の青と見分けるため） */
@keyframes glowY{0%,100%{box-shadow:0 0 0 4px rgba(255,167,38,.4),0 0 18px rgba(255,193,7,.6)}50%{box-shadow:0 0 0 9px rgba(255,167,38,.18),0 0 32px rgba(255,193,7,.9)}}
.bub.next .nm{color:#E65100;font-weight:900}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.hidden{opacity:0;pointer-events:none}
.bub.home .ball{width:74px;height:74px;font-size:32px;border-color:#9A93B0}
.bub.lock{opacity:.38}
.bub .finger{position:absolute;left:-30px;top:-14px;font-size:34px;animation:poke 1s ease-in-out infinite;pointer-events:none}
@keyframes poke{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,4px)}}
.bub.newb .ball{animation:newIn 1.4s ease-in-out infinite}
@keyframes newIn{0%,100%{box-shadow:0 0 0 0 rgba(255,138,80,.5)}50%{box-shadow:0 0 0 12px rgba(255,138,80,0)}}
.bub.moon .ball{width:46px;height:46px;font-size:20px;border-width:2.5px;border-color:#9A93B0}
.bub.moon .nm{font-size:10.5px;padding:1px 5px}
.bub.moon.tiny .ball{width:36px;height:36px;font-size:16px;border-color:#FFB74D}
.bub.moon.tiny .nm{font-size:9.5px}
.bub.ph .ball{border-style:dashed;border-color:#BDBDBD;color:#9E9E9E}
.bub.ph .nm{color:#9E9E9E}
.bub.opt .ball{border-color:#90A4AE}
.bub.opt .num{background:#90A4AE}
.bub.sup .ball{border-color:#D9A21E;background:#FFFBEA}
.bub.kids .ball::after{content:"";}
.bub .more{position:absolute;right:-10px;top:-8px;font-size:11px;font-weight:900;background:#6E5FB5;color:#fff;border-radius:999px;padding:1px 6px}
.demo .reset{flex:none;min-width:auto;padding:7px 10px;background:#FFF3E0;border-color:#FFB74D}
/* 中身のシート */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(60,30,10,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.pop{width:100%;max-width:460px;max-height:86vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 22px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.pop .st{font-size:12.5px;font-weight:900;color:#FF7043}
.pop h2{font-size:20px;font-weight:900;margin:2px 0 10px}
.pop p{font-size:15.5px;line-height:1.85;margin-bottom:10px}
.pop .talk{background:#FFF8E1;border-left:4px solid #FFB74D;border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.85;margin-bottom:12px}
.pop .act{display:block;width:100%;padding:13px;border-radius:12px;border:2px solid #90CAF9;background:#F2F8FF;color:#1565C0;font-family:inherit;font-weight:700;font-size:15px;margin-bottom:8px;text-align:center;text-decoration:none}
.pop .done{display:block;width:100%;padding:15px;border-radius:14px;border:none;background:#29B6F6;color:#fff;font-family:inherit;font-weight:900;font-size:17px;margin-top:6px;cursor:pointer}
.pop .done.undo{background:#ECEFF1;color:#546E7A;font-size:14px}
.pop .close{display:block;width:100%;padding:12px;border-radius:12px;border:2px solid #CFD8DC;background:#fff;color:#455A64;font-family:inherit;font-weight:700;font-size:15px;margin-top:8px;cursor:pointer}
/* 見本用の操作 */
.demo{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;background:rgba(255,255,255,.95);border:2px dashed #B0BEC5;border-radius:14px;padding:8px 10px;font-size:12px;color:#546E7A}
.demo b{color:#37474F}
.demo .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.demo button{flex:1;min-width:64px;padding:7px 4px;border-radius:9px;border:1.5px solid #B0BEC5;background:#fff;font-family:inherit;font-size:12px;font-weight:700;color:#37474F;cursor:pointer}
.demo button.on{background:linear-gradient(135deg,#FCE4EC,#E3F2FD);border-color:#A88BE0}
.toast{position:fixed;left:50%;top:22%;width:min(86vw,330px);transform:translateX(-50%);z-index:60;background:#fff;border-radius:18px;padding:16px 20px;font-size:17px;font-weight:900;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.2);animation:up .3s ease-out}
.conf{position:fixed;top:-20px;z-index:55;font-size:20px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="ttl" id="ttl"></div>
<div id="stage"><div class="orb" id="orb"></div></div>

<div class="sheet" id="sheet" hidden><div class="pop" id="pop"></div></div>

<div class="demo" id="demo"></div>

<script>
/* ===== 仮組み：ファーストサポートの流れ（中身は入れず「できた！」だけ）
   はじめの一歩 → LINKを知ろう（旧：初期サポートガイド） → LINKを使おう（旧：活用の1stステップ） ===== */
const T = {
  hajime:{ title:"👋 はじめの一歩", sub:"入会したその日に", ic:"👋", nm:"はじめの一歩", base:0, next:{to:"know", nm:"次のステップへ\nLINKを知ろう"},
    steps:[{ic:"📲",nm:"2つのサイトを\nホームに置く"},{ic:"💬",nm:"LINK information\nを追加"},{ic:"🫧",nm:"3つの\nオープンチャット"},{ic:"🔗",nm:"紹介URLを\n発行・保存"}] },
  know:{ title:"🔎 LINKを知ろう", sub:"後日、サポーターといっしょに", ic:"🔎", nm:"LINKを\n知ろう", base:0, next:{to:"use", nm:"次のステップへ\nLINKを使おう"},
    steps:[
      {ic:"？",nm:"（0番）\nあとで決める",ph:true},
      {ic:"💬",nm:"LINK information\nについて",note:"LINK informationとはどんなものかを知って、リッチメニューの解放まで進めます"},
      {ic:"🏁",nm:"1stステップを\n完了しよう",kids:{title:"🏁 1stステップを完了しよう", steps:[{ic:"🤝",nm:"ユーザー\nサポート会"},{ic:"📚",nm:"LINKセミナー"},{ic:"🎓",nm:"グルコン"},{ic:"🎪",nm:"チーム\n交流会"}]}},
      {ic:"🪞",nm:"自分を\n整えよう",kids:{title:"🪞 自分を整えよう", steps:[{ic:"🤝",nm:"SASAEAIに\nプロフィール掲載"},{ic:"🏰",nm:"LINK-BASEに\n事業を掲載"}]}}
    ] },
  use:{ title:"🚀 LINKを使おう", sub:"つながる先を知って、使っていく", ic:"🚀", nm:"LINKを\n使おう", base:1, next:{to:"home", nm:"OK！\nホームへ"},
    steps:[
      {ic:"☑️",nm:"1stステップ\n参加確認",opt:true,note:"番号なし（やってもやらなくても進めます）"},
      {ic:"👥",nm:"チームの\nチャット"},
      {ic:"🌏",nm:"LINK全体の\nチャット"},
      {ic:"🏘",nm:"地域コミュニティ\n趣味のサークル",note:"注意書きを分かったうえで入る／あなたの地域のもの／海外の方の使い方など。LINK informationでも詳しく分かります"},
      {ic:"🐣",nm:"もっと\n使いこなすには",sup:true}
    ] }
};
const ORDER = ["hajime","know","use"];
let S, supOK = false, finished = false;
function initState(){
  S = {};
  ORDER.forEach(k=>{ S[k] = T[k].steps.map(s=>({ me:false, ok:false, kids: s.kids ? s.kids.steps.map(()=>({me:false, ok:false})) : null })); });
  supOK = false; finished = false;
}
initState();
const need = (k, i)=>{ const s = T[k].steps[i]; return !s.ph && !s.opt && !s.sup; };
const stepMe = (k, i)=>{ const st = S[k][i]; return st.kids ? st.kids.every(x=>x.me) : st.me; };
const stepOk = (k, i)=>{ const st = S[k][i]; return st.kids ? st.kids.every(x=>x.ok) : st.ok; };
const pageMe = k=>T[k].steps.every((s, i)=>!need(k, i) || stepMe(k, i));
const pageOk = k=>T[k].steps.every((s, i)=>!need(k, i) || stepOk(k, i));
const allDone = ()=>ORDER.every(pageMe);
const nextPage = ()=>ORDER.find(k=>!pageMe(k)) || null;

let path = [];   /* [] = ホーム／["know"] = ページ／["know", 2] = その中の小さな段 */
const $ = s=>document.querySelector(s);
const stage = $("#stage"), orb = $("#orb");
let N = [], W, H, cx, cy, R, MO, drag = null, lastDragEnd = 0, popOpen = false;

function size(){
  W = innerWidth; H = innerHeight;
  const yTop = 70 + 50, yBot = H - 110 - 70;
  cx = W/2; cy = (yTop + yBot)/2;
  R = { x: Math.min(W/2 - 64, 200), y: 0 }; R.y = Math.min((yBot - yTop)/2, R.x * 1.5);
  MO = { x: Math.min(R.x * .6, 120), y: Math.min(R.y * .5, 140) };
  orb.style.cssText = `width:${R.x*2}px;height:${R.y*2}px;transform:translate(${cx-R.x}px,${cy-R.y}px)`;
}
addEventListener("resize", size);
function mk(html, cls){ const b = document.createElement("button"); b.type = "button"; b.className = "bub " + cls; b.innerHTML = html; stage.appendChild(b); return b; }
function ball(ic, extra){ return `<span class="ball">${ic}${extra || ""}<span class="mark"></span></span>`; }
const plain = t=>t.replace(/\n/g, "");

function build(fx, fy){
  N.forEach(n=>n.el.remove()); N = [];
  if(!path.length) buildHome(); else if(path.length === 1) buildPage(path[0]); else buildKids(path[0], path[1]);
  N.forEach(n=>{ n.x = fx ?? cx; n.y = fy ?? cy; n.vx = 0; n.vy = 0; n.s = .3; n.ts = 1; hook(n); });
  paint(); demoPanel();
}
function ring(list){ list.forEach((o, i)=>{ o.kind = "step"; o.k = i; o.n = list.length; o.ph = 1 + i*1.3; N.push(o); }); }

function buildHome(){
  $("#ttl").innerHTML = "🏠 ホーム<small>" + (allDone() ? "3つとも終わりました" : "はじめて登録したところから") + "</small>";
  N.push({ el: mk(ball("👤") + '<span class="nm">アカウント</span>', "center home"), kind:"center", ph:0, act:()=>toast("（見本）アカウントのページ") });
  /* アカウントのまわりを回る小さな丸（月） */
  const moons = [
    { ic:"💌", nm:"新しい仲間へ\nこのサイトを教える", cls:"moon", act:()=>toast("（見本）新しい仲間へこのサイトを教える") },
    { ic:"🧰", nm:"便利な\n情報一覧", cls:"moon", act:()=>toast("（見本）便利な情報一覧") },
    { ic:"❓", nm:"入りたいと\n言われたら", cls:"moon tiny", act:()=>openInfo("❓ 入りたいと言われたら", "（見本）「LINKに入りたい」「気になる」と言われたときに、最低限やることが、ここに入ります。") }
  ];
  moons.forEach((m, i)=>N.push({ el: mk(ball(m.ic) + `<span class="nm">${m.nm}</span>`, "step " + m.cls), kind:"moon", k:i, n:moons.length, ph:2 + i, act:m.act }));
  const list = ORDER.map(k=>({ el: mk(ball(T[k].ic) + `<span class="nm">${T[k].nm}</span>`, "step pg"), page:k,
    act:()=>{ const i = ORDER.indexOf(k); if(i > 0 && !pageMe(ORDER[i - 1])){ toast("先に「" + plain(T[ORDER[i - 1]].nm) + "」を進めましょう"); return; } go([k]); } }));
  list.push({ el: mk(ball("📋") + '<span class="nm">各種スケジュール\n情報</span>', "step"), act:()=>toast("（見本）各種スケジュール情報") });
  if(allDone()) list.push({ el: mk(ball("🌈") + '<span class="nm">チーム情報</span>', "step newb"), act:()=>toast("（見本）チーム情報") });
  if(supOK) list.push({ el: mk(ball("🐣") + '<span class="nm">サポーターの\n部屋</span>', "step newb"), act:()=>toast("（見本）サポーターの部屋（スクリプト集もここで見られます）") });
  ring(list);
}
function buildPage(k){
  const P = T[k];
  $("#ttl").innerHTML = `${P.title}<small>${P.sub}</small>`;
  N.push({ el: mk(ball("↩️") + '<span class="nm">もどる</span>', "center"), kind:"center", ph:0, act:()=>go([]) });
  let num = P.base;
  const list = P.steps.map((s, i)=>{
    const numbered = !s.opt && !s.sup;
    const cls = "step" + (s.ph ? " ph" : "") + (s.opt ? " opt" : "") + (s.sup ? " sup" : "");
    const badge = numbered ? `<span class="num">${num++}</span>` : "";
    const more = s.kids ? `<span class="more">${s.kids.steps.length}つ</span>` : "";
    return { el: mk(ball(s.ic, badge + more) + `<span class="nm">${s.nm}</span>`, cls), si:i,
      act:()=>{ if(s.ph){ toast("0番は、あとで決めます"); return; } if(s.sup){ openSupporter(); return; } if(s.kids){ go([k, i]); return; } openStep(k, i, null); } };
  });
  list.push({ el: mk(`<span class="ball">👍</span><span class="nm">${P.next.nm}</span>`, "next hidden"), isNext:true,
    act:()=>{ if(pageMe(k)) go(P.next.to === "home" ? [] : [P.next.to]); } });
  ring(list);
}
function buildKids(k, i){
  const K = T[k].steps[i].kids;
  $("#ttl").innerHTML = `${K.title}<small>${plain(T[k].nm)} の中</small>`;
  N.push({ el: mk(ball("↩️") + '<span class="nm">もどる</span>', "center"), kind:"center", ph:0, act:()=>go([k]) });
  ring(K.steps.map((s, j)=>({ el: mk(ball(s.ic) + `<span class="nm">${s.nm}</span>`, "step"), kj:j, act:()=>openStep(k, i, j) })));
}
function setMark(n, me, ok){
  n.el.classList.toggle("me", me && !ok); n.el.classList.toggle("ok", ok);
  n.el.querySelector(".mark").textContent = ok ? "🌈" : me ? "✅" : "";
}
function paint(){
  N.forEach(n=>{
    if(n.kind !== "step") return;
    if(!path.length){
      if(!n.page) return;
      setMark(n, pageMe(n.page), pageOk(n.page));
      const i = ORDER.indexOf(n.page);
      n.el.classList.toggle("lock", i > 0 && !pageMe(ORDER[i - 1]));
      const f = n.el.querySelector(".finger");
      if(nextPage() === n.page){ if(!f) n.el.querySelector(".ball").insertAdjacentHTML("beforeend", '<span class="finger">👉</span>'); } else if(f) f.remove();
    }else if(path.length === 1){
      const k = path[0];
      if(n.isNext){ n.el.classList.toggle("hidden", !pageMe(k)); return; }
      const s = T[k].steps[n.si];
      if(s.ph || s.sup) return;
      setMark(n, stepMe(k, n.si), stepOk(k, n.si));
    }else{
      const st = S[path[0]][path[1]].kids[n.kj];
      setMark(n, st.me, st.ok);
    }
  });
}
function go(to){
  const x = N[0].x, y = N[0].y;
  N.forEach(n=>{ n.ts = .2; });
  setTimeout(()=>{ path = to; build(x, y);
    if(!path.length && allDone() && !finished){ finished = true; celebrate("🎉 3つとも終わりました！<br><span style='font-size:13px'>「チーム情報」が開きました</span>"); } }, 220);
}
function hook(n){
  const el = n.el; let sx, sy, ox, oy, pid = null, moved = false;
  el.addEventListener("pointerdown", e=>{ pid = e.pointerId; sx = e.clientX; sy = e.clientY; moved = false; ox = e.clientX - n.x; oy = e.clientY - n.y; try{ el.setPointerCapture(pid); }catch(_){} });
  el.addEventListener("pointermove", e=>{
    if(pid !== e.pointerId) return;
    if(!moved && Math.hypot(e.clientX - sx, e.clientY - sy) > 8){ moved = true; drag = n; n.ts = 1.12; }
    if(moved){ const nx = e.clientX - ox, ny = e.clientY - oy; n.vx = nx - n.x; n.vy = ny - n.y; n.x = nx; n.y = ny; }
  });
  const end = e=>{ if(pid !== e.pointerId) return; pid = null; if(moved){ drag = null; n.ts = 1; lastDragEnd = performance.now(); } };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("click", ()=>{ if(performance.now() - lastDragEnd < 400) return; n.act(); });
}

/* ---- 中身（見本なので「できた！」だけ） ---- */
function sheet(html){ $("#pop").innerHTML = html + `<button class="close" id="cl">← もどる</button>`; $("#sheet").hidden = false; popOpen = true; $("#cl").onclick = closeSheet; }
function openInfo(h, body){ sheet(`<h2>${h}</h2><p>${body}</p>`); }
function openStep(k, i, j){
  const s = j == null ? T[k].steps[i] : T[k].steps[i].kids.steps[j];
  const st = j == null ? S[k][i] : S[k][i].kids[j];
  const where = j == null ? plain(T[k].nm) : plain(T[k].nm) + " › " + plain(T[k].steps[i].nm);
  sheet(`<div class="st">${where}</div><h2>${s.ic} ${plain(s.nm)}</h2>`
    + (s.note ? `<p style="font-size:14px">${s.note}</p>` : "")
    + `<p style="color:#9E9E9E;font-size:13.5px">（見本なので、中身は入れていません）</p>`
    + (st.me ? `<button class="done undo" id="dn">もどす（まだ終わっていない）</button>` : `<button class="done" id="dn">✅ できた！</button>`)
    + (st.ok ? `<p style="text-align:center;font-size:13px;color:#8E24AA;margin-top:8px">🌈 サポーターの確認もついています</p>` : st.me ? `<p style="text-align:center;font-size:13px;color:#0288D1;margin-top:8px">🔵 サポーターの確認を待っています</p>` : ""));
  $("#dn").onclick = ()=>{
    const wasStep = stepMe(k, i), wasPage = pageMe(k);
    st.me = !st.me; if(!st.me) st.ok = false; closeSheet(); paint(); demoPanel();
    if(!wasPage && pageMe(k)) celebrate(`🎉 ${plain(T[k].nm)}、ぜんぶできました！<br><span style='font-size:13px'>👍 の丸から次へ進めます</span>`);
    else if(j != null && !wasStep && stepMe(k, i)) celebrate(`🎉 ${plain(T[k].steps[i].nm)}、ぜんぶできました！<br><span style='font-size:13px'>「もどる」で前の段へ</span>`);
  };
}
function openSupporter(){
  sheet(`<div class="st">LINKを使おう</div><h2>🐣 もっと使いこなすには</h2>`
    + `<p>（見本）サポーターという動き方をすると、あなたのやりたいことが、より叶いやすくなっていきます。</p>`
    + `<p>（見本）サポーターになりたいとき・なるにはどうしたらいいかの連絡方法が、ここに入ります。</p>`
    + (supOK ? `<p style="text-align:center;color:#8E24AA;font-weight:700">🐣 OKをもらいました。ホームに「サポーターの部屋」が開いています</p>`
             : `<button class="done" id="sp" style="background:#D9A21E">（見本）サポーターからOKをもらった</button>`));
  const b = $("#sp"); if(b) b.onclick = ()=>{ supOK = true; closeSheet(); celebrate("🐣 サポーターの部屋が開きました！<br><span style='font-size:13px'>ホームに出ています</span>"); };
}
function closeSheet(){ $("#sheet").hidden = true; popOpen = false; }
$("#sheet").addEventListener("click", e=>{ if(e.target.id === "sheet") closeSheet(); });
function toast(t, ms){ const d = document.createElement("div"); d.className = "toast"; d.innerHTML = t; document.body.appendChild(d); setTimeout(()=>d.remove(), ms || 1600); }
function celebrate(t){
  toast(t, 2400);
  const em = ["🎉","✨","🌈","⭐","💫"];
  for(let i=0;i<26;i++){ const c = document.createElement("div"); c.className = "conf"; c.textContent = em[i % em.length];
    c.style.left = Math.random()*100 + "vw"; c.style.animationDuration = (1.6 + Math.random()*1.4) + "s"; c.style.animationDelay = (Math.random()*.4) + "s";
    document.body.appendChild(c); setTimeout(()=>c.remove(), 3600); }
}

/* ---- 見本用の操作：先生の丸 ---- */
function demoPanel(){
  let h = `<b>見本用の操作</b>（本番では、サポーターが自分の画面で丸をつけます）<div class="row">`;
  const items = [];
  if(path.length === 1){ T[path[0]].steps.forEach((s, i)=>{ if(need(path[0], i) && !s.kids) items.push({ st:S[path[0]][i], lb:plain(s.nm).slice(0, 6) }); }); }
  if(path.length === 2){ T[path[0]].steps[path[1]].kids.steps.forEach((s, j)=>items.push({ st:S[path[0]][path[1]].kids[j], lb:plain(s.nm).slice(0, 6) })); }
  h += items.map((x, i)=>`<button data-i="${i}" class="${x.st.ok ? "on" : ""}">${x.st.ok ? "🌈" : "先生の丸"}<br>${x.lb}</button>`).join("");
  h += `<button class="reset" id="rs">最初から</button></div>`;
  $("#demo").innerHTML = h;
  $("#demo").querySelectorAll("button[data-i]").forEach(b=>b.onclick = ()=>{
    const st = items[+b.dataset.i].st;
    if(!st.me){ toast("先に、本人が「できた！」を押します"); return; }
    st.ok = !st.ok; paint(); demoPanel();
  });
  $("#rs").onclick = ()=>{ initState(); go([]); };
}

/* ---- うごき ---- */
let last = null, sec = 0;
function frame(t){
  const dt = last == null ? 0 : Math.min(64, t - last); last = t;
  if(!popOpen) sec += dt / 1000;
  N.forEach(n=>{
    let hx = cx, hy = cy;
    if(n.kind === "step"){ const a = sec * 2*Math.PI/50 + n.k * 2*Math.PI/n.n - Math.PI/2; hx = cx + R.x*Math.cos(a); hy = cy + R.y*Math.sin(a); }
    if(n.kind === "moon"){ const a = Math.PI/2 + sec * 2*Math.PI/30 + n.k * 2*Math.PI/n.n; hx = cx + MO.x*Math.cos(a); hy = cy + MO.y*Math.sin(a); }
    if(n !== drag){
      let ax = (hx - n.x)*.055, ay = (hy - n.y)*.055;
      if(drag){ const dx = n.x - drag.x, dy = n.y - drag.y, d = Math.hypot(dx, dy) || 1, RR = 130;
        if(d < RR){ const f = (RR - d)/RR*7; ax += dx/d*f; ay += dy/d*f; } }
      n.vx = (n.vx + ax)*.84; n.vy = (n.vy + ay)*.84; n.x += n.vx; n.y += n.vy;
      const lim = Math.max(n.kind === "moon" ? 40 : 59, n.el.querySelector(".nm").offsetWidth/2 + 4); n.x = Math.min(Math.max(n.x, lim), W - lim);
    }
    n.s += (n.ts - n.s)*.2;
    const fy = n === drag ? 0 : Math.sin(t/650 + n.ph)*5, fx = n === drag ? 0 : Math.cos(t/900 + n.ph)*2.5;
    const hb = n.el.querySelector(".ball").offsetHeight/2;
    n.el.style.transformOrigin = `50% ${hb}px`;
    n.el.style.transform = `translate(${(n.x - n.el.offsetWidth/2 + fx).toFixed(1)}px,${(n.y - hb + fy).toFixed(1)}px) scale(${n.s.toFixed(3)})`;
    n.el.style.zIndex = n === drag ? 9 : (n.kind === "moon" ? 5 : 4);
  });
  requestAnimationFrame(frame);
}
size(); build(); requestAnimationFrame(frame);
