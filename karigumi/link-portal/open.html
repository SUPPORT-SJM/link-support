<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LINKポータル</title>
<!-- ホーム画面の「LINKポータル」アイコンから開くページです。すぐに LINKポータル へ移ります -->
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="../img/portal-icon-180.png">
<meta name="apple-mobile-web-app-title" content="LINKポータル">
<meta name="theme-color" content="#F06A6A">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FFFBF8;
       font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#4A4560;text-align:center;padding:24px;box-sizing:border-box;}
  img{width:72px;height:72px;border-radius:18px;box-shadow:0 4px 14px rgba(160,60,60,.18);}
  p{font-size:14px;line-height:1.8;margin:14px 0 18px;}
  a{display:inline-block;background:linear-gradient(135deg,#FF8A5B,#E9566E);color:#fff;text-decoration:none;font-weight:700;
    padding:14px 26px;border-radius:14px;font-size:15px;}
</style>
</head>
<body>
<div>
  <img src="../img/portal-icon-180.png" alt="">
  <p id="msg">LINKポータルを開いています…</p>
  <a href="https://app.link-event-x.com" id="go">LINKポータルを開く</a>
</div>
<script>
/* LINKポータルへ移ります。もどってきたとき（ポータルを閉じたとき）は、ボタンでもう一度開けます */
(function(){
  var URL_PORTAL = "https://app.link-event-x.com";
  var once = false;
  try{ once = sessionStorage.getItem("lp_opened") === "1"; }catch(e){}
  if(!once){
    try{ sessionStorage.setItem("lp_opened", "1"); }catch(e){}
    location.replace(URL_PORTAL);
  }else{
    document.getElementById("msg").textContent = "下のボタンから、LINKポータルを開けます";
  }
  window.addEventListener("pageshow", function(e){
    if(e.persisted) document.getElementById("msg").textContent = "下のボタンから、LINKポータルを開けます";
  });
  if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
})();
</script>
</body>
</html>
