<!DOCTYPE html>
<html lang="ja">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Skyarc LINKサポート</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="./img/app-icon-64.png">
<link rel="apple-touch-icon" href="./img/app-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LINKサポート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6E5FB5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./beta.css">
<style>
/* レイアウト：ログイン後のトップ。丸いまとまりの中に、アイコンと名前がひとかたまりで浮かぶ。
   つまんで動かすと周りがよけて混ざり、離すと元の場所へ。押すとその色が画面いっぱいに広がる */
:root{
  --ink:#2A2438; --sub:#7A7390; --deep:#6E5FB5; --mist:#F0EDF9; --paper:#FCFBFF; --line:#E4E0F0; --card:#FFFFFF;
  --g-member:#3FA98A; --g-apply:#E8873A; --g-team:#4E86D6; --g-sup:#D9A21E; --g-crie:#8A6FD6; --g-common:#9A93B0; --g-back:#8E86C8; --g-join:#5FB8E6; --join-ink:#3A9BD0; --rainbow:#F49AC1,#F5A97A,#F5D06A,#8FD9A8,#6FC7D9,#7BA3E8,#A88BE0,#F49AC1;
  --halo:rgba(110,95,181,.07);
  --shadow:0 6px 18px rgba(60,42,110,.13);
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
/* このサイトは明るい画面だけでそろえています（ほかのページと同じ） */
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{overflow-x:hidden;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 30px;}

/* 上の見出し */
.top{display:flex;align-items:center;gap:12px;padding-right:58px;}
.appicon{width:52px;height:52px;border-radius:14px;flex:none;overflow:hidden;box-shadow:var(--shadow);
  background:#6E5FB5 url("./img/app-icon-180.png") center/cover no-repeat;}   /* ホーム画面のアイコンと同じ絵 */
.top h1{font-family:var(--f-head);font-weight:900;font-size:18px;line-height:1.35;margin:0;color:var(--deep);text-wrap:balance;}
.top p{margin:0;font-size:12.5px;color:var(--sub);}

/* もどる */
.crumb{display:flex;align-items:center;gap:10px;min-height:40px;margin-top:12px;}
.back{border:none;background:var(--mist);color:var(--deep);font-family:var(--f-head);font-weight:700;
  font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none;}
.back:focus-visible,.bub:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:20px;}
.crumb h2{margin:0;font-family:var(--f-head);font-weight:900;font-size:16px;color:var(--ink);}

/* アイコンの舞台（丸いまとまり） */
.stage{position:relative;width:100%;max-width:440px;margin:6px auto 0;touch-action:none;user-select:none;-webkit-user-select:none;}
.stage::before{content:"";position:absolute;left:50%;top:50%;width:92%;aspect-ratio:1;max-height:100%;
  transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--halo) 0%,transparent 70%);
  pointer-events:none;}
.bub{position:absolute;left:0;top:0;width:96px;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;color:var(--ink);background:none;border:none;padding:0;cursor:grab;font-family:inherit;
  -webkit-tap-highlight-color:transparent;-webkit-user-drag:none;will-change:transform;}
.bub.grab{cursor:grabbing;z-index:5;}
/* サポーターの部屋：2回つづけて押すと、裏返って「サポーターとは」になります */
.bub.flipping .ball,.bub.flipping .nm{animation:bubFlip .44s ease-in-out;}
@keyframes bubFlip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@media (prefers-reduced-motion: reduce){ .bub.flipping .ball,.bub.flipping .nm{animation:none;} }
.bub .ball{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:30px;
  background:var(--card);border:3px solid var(--c);box-shadow:var(--shadow);transition:box-shadow .2s;pointer-events:none;}
.bub.grab .ball{box-shadow:0 14px 28px rgba(60,42,110,.25);}
.bub.wide .nm{white-space:pre;}   /* 「このサイトを教える」を1行に収めます */
/* アカウントのまわりを、月のようにまわる小さなアイコン（ほかのアイコンの7割ほど） */
.bub.moon{z-index:3;gap:4px;}
.orbit{position:absolute;left:0;top:0;border:1.5px dashed rgba(110,95,181,.28);border-radius:50%;pointer-events:none;
  transition:opacity .4s;}
.bub.moon .ball{width:48px;height:48px;font-size:21px;border-width:2.5px;}
.bub.moon .nm{font-size:10.5px;line-height:1.25;background:rgba(255,255,255,.9);border-radius:8px;padding:2px 6px;
  box-shadow:0 2px 6px rgba(60,42,110,.12);}   /* ほかのアイコンの前を通っても読めるように */
.bub.backb .ball{width:62px;height:62px;font-size:26px;}
.bub.backb .nm{color:var(--deep);font-size:13px;}
.bub .nm{font-family:var(--f-head);font-weight:700;font-size:12px;line-height:1.3;text-align:center;
  white-space:pre-line;pointer-events:none;}

/* 次に進むところを指さす 👉（はじめの一歩 → 初期サポートガイド → 活用の1stステップ） */
.bub.pointed{z-index:4;}
.bub .point{position:absolute;left:-14px;top:-12px;font-size:34px;line-height:1;pointer-events:none;
  transform:rotate(38deg);transform-origin:70% 50%;filter:drop-shadow(0 3px 4px rgba(60,42,110,.28));
  animation:pointPoke 1.1s ease-in-out infinite;}
@keyframes pointPoke{0%,100%{translate:0 0;}50%{translate:7px 7px;}}
@media (prefers-reduced-motion: reduce){ .bub .point{animation:none;} }

/* 案内だけの段（公式公認イベント） */
.info{margin-top:22px;background:var(--card);border:2px solid var(--g-apply);border-radius:22px;padding:22px 18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;text-align:center;
  animation:bloom .42s cubic-bezier(.25,1.3,.5,1) both;}
@keyframes bloom{from{opacity:0;transform:scale(.5);}to{opacity:1;transform:none;}}
.info p{margin:0;font-size:14px;line-height:1.9;}
.info-btn[hidden]{display:none;}
.info-btn{display:block;padding:14px;border-radius:14px;background:var(--g-apply);color:#fff;text-decoration:none;
  font-family:var(--f-head);font-weight:700;font-size:15px;}
.info-btn:focus-visible{outline:3px solid var(--deep);outline-offset:3px;}

/* 短いお知らせ */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;
  background:rgba(62,47,40,.92);color:#fff;font-size:13.5px;font-weight:700;border-radius:999px;padding:11px 20px;
  max-width:calc(100vw - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
/* ログイン中のトップの、小さな「使い方」（ほかのアイコンがよけて近づいた一瞬は、その後ろを通ります。つまむと前に出ます） */
.tut{position:absolute;left:0;top:0;z-index:0;touch-action:none;cursor:grab;width:80px;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;will-change:transform;}
.tut .tb{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--deep);display:grid;place-items:center;
  font-size:15px;box-shadow:var(--shadow);}
.tut .tt{font-family:var(--f-head);font-weight:700;font-size:10px;color:var(--deep);background:rgba(255,255,255,.92);
  border-radius:6px;padding:0 5px;white-space:nowrap;}
.tut:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:12px;}
/* ログイン中のトップの、小さな「会員情報」（左上。使い方と同じように浮いていて、つまんで動かせます） */
.tut.mem .tb{border-color:var(--g-member);}
.tut.mem .tt{color:#2E7D62;}
/* 会員情報の画面 */
.minfo{margin:6px 0 14px;border:2px solid var(--line);border-radius:16px;overflow:hidden;}
.minfo .row{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-bottom:1px dashed var(--line);}
.minfo .row:last-child{border-bottom:none;}
.minfo .k{font-size:13px;font-weight:700;color:var(--deep);}
.minfo .v{font-family:var(--f-head);font-weight:900;font-size:22px;color:var(--ink);word-break:break-all;}
.minfo .v.none{font-size:15px;font-weight:700;color:var(--sub);}
.minfo .v.num{letter-spacing:.06em;}
.minfo .idrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.cpy{flex:none;padding:10px 14px;border-radius:12px;border:2px solid var(--g-member);background:#fff;color:#2E7D62;
  font-family:var(--f-head);font-weight:900;font-size:15px;cursor:pointer;}
.cpy.done{background:var(--g-member);color:#fff;}
.cpmsg{font-size:13px;font-weight:700;color:#2E7D62;min-height:1.2em;}
.pwnote{background:#FFF8E1;border:1.5px solid #FFE08A;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.85;color:#5D4037;margin-bottom:14px;}
.pwnote b{color:#BF360C;}
.mlink{display:block;text-align:center;text-decoration:none;font-family:var(--f-head);font-weight:900;font-size:16px;color:#fff;
  background:var(--g-member);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 6px 16px rgba(63,169,138,.3);}
.mclose{display:block;width:100%;padding:12px;border:none;border-radius:14px;background:var(--mist);color:var(--deep);
  font-family:var(--f-head);font-weight:700;font-size:15px;cursor:pointer;}
/* 「登録」の右下の、小さな「使い方」 */
.howto{position:absolute;left:0;top:0;z-index:4;touch-action:none;cursor:grab;width:44px;display:flex;flex-direction:column;align-items:center;gap:2px;
  text-decoration:none;will-change:transform;}
.howto .hb{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--deep);display:grid;place-items:center;
  font-size:14px;box-shadow:var(--shadow);}
.howto .ht{font-family:var(--f-head);font-weight:900;font-size:10.5px;color:var(--deep);background:rgba(255,255,255,.92);
  border-radius:6px;padding:0 5px;white-space:nowrap;}
.tut.grab,.howto.grab{cursor:grabbing;z-index:6;}
.tut.grab .tb,.howto.grab .hb{box-shadow:0 10px 22px rgba(60,42,110,.3);}
.howto:focus-visible{outline:3px solid var(--deep);outline-offset:3px;border-radius:12px;}
/* 押したとき、その色が画面いっぱいに広がる */
.spread{position:fixed;inset:0;z-index:50;pointer-events:none;background:var(--c);
  clip-path:circle(0px at var(--x) var(--y));display:grid;place-items:center;}
.spread.go{transition:clip-path .55s cubic-bezier(.6,0,.3,1);clip-path:circle(150vmax at var(--x) var(--y));}
.spread.out{transition:opacity .35s;opacity:0;}
.spread .big{font-size:72px;transform:scale(.4);opacity:0;transition:transform .5s .12s cubic-bezier(.25,1.4,.5,1),opacity .3s .12s;}
.spread .bign{display:block;margin-top:10px;color:#fff;font-family:var(--f-head);font-weight:900;font-size:20px;
  text-align:center;white-space:pre-line;opacity:0;transition:opacity .3s .25s;}
.spread.go .big{transform:scale(1);opacity:1;}
.spread.go .bign{opacity:1;}

@media (prefers-reduced-motion: reduce){
  .info{animation:none !important;}
  .spread.go,.spread .big,.spread .bign{transition:none !important;}
}

/* はじめての方：まん中の「登録」 */
.bub.join{width:110px;}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg;}
.bub.join .ball{width:88px;height:88px;font-size:36px;border:5px solid transparent;
  /* まん中は水色の水晶玉：左上から光が当たり、下に光が抜けて、ふちが少し濃くなる球 */
  background:
    radial-gradient(ellipse 34% 22% at 35% 25%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 45%, rgba(255,255,255,0) 75%) padding-box,
    radial-gradient(ellipse 55% 30% at 58% 86%, rgba(225,250,255,.85) 0%, rgba(225,250,255,0) 70%) padding-box,
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 62%, rgba(40,110,160,.28) 100%) padding-box,
    radial-gradient(circle at 38% 32%, #F2FCFF 0%, #BDE9FA 22%, #82CBEC 52%, #4BA4D4 80%, #3A8DC0 100%) padding-box,
    conic-gradient(from var(--ang), var(--rainbow)) border-box;
  animation:spin 6s linear infinite, beacon 2.8s ease-in-out infinite;}
.bub.join .nm{font-size:14px;font-weight:900;color:var(--join-ink);}
@keyframes spin{to{--ang:360deg;}}
@keyframes beacon{
  0%,100%{box-shadow:0 0 6px 1px rgba(111,199,217,.35),var(--shadow);}
  33%{box-shadow:0 0 22px 7px rgba(123,163,232,.55),var(--shadow);}
  66%{box-shadow:0 0 22px 7px rgba(244,154,193,.5),var(--shadow);}
}

/* 登録の画面 */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;
  background:rgba(30,22,52,.35);backdrop-filter:blur(2px);}
.sheet .card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:24px 20px 20px;
  box-shadow:0 20px 50px rgba(30,22,52,.3);animation:bloom .4s cubic-bezier(.25,1.3,.5,1) both;position:relative;
  max-height:calc(100vh - 32px);overflow-y:auto;}
.sheet h3{margin:0 0 4px;font-family:var(--f-head);font-weight:900;font-size:20px;text-align:center;color:var(--ink);}
.sheet .lead{margin:0 0 18px;text-align:center;font-size:13px;color:var(--sub);}
.sheet .close{position:absolute;top:10px;right:12px;width:36px;height:36px;border-radius:50%;border:none;
  background:var(--mist);color:var(--sub);font-size:18px;cursor:pointer;}
.f{margin-bottom:14px;}
.f label{display:block;font-size:12px;font-weight:700;color:var(--deep);margin-bottom:6px;}
.f label small{font-weight:500;color:var(--sub);margin-left:4px;}
.f input{width:100%;padding:13px 14px;font-size:16px;border:2px solid var(--line);border-radius:12px;
  background:var(--paper);color:var(--ink);font-family:inherit;}
.f input:focus{outline:none;border-color:var(--g-join);}
.f input.pin{text-align:center;font-size:26px;letter-spacing:.5em;padding-left:.5em;font-family:var(--f-head);font-weight:700;}
.gbtn{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  font-family:var(--f-head);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.gbtn.done{border-color:var(--g-member);color:var(--g-member);}
.or{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:11px;color:var(--sub);}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
/* 止まったときのお知らせ：押したボタンのすぐ上に、赤い太字で出します */
.err{display:none;margin:4px 0 12px;padding:10px 12px;border-radius:12px;background:#FFF1F0;border:1.5px solid #F5B5AE;font-size:14px;font-weight:700;line-height:1.7;color:#C62828;text-align:center;}
.go-btn{width:100%;padding:15px;border:none;border-radius:14px;color:#fff;cursor:pointer;
  background:linear-gradient(110deg,var(--rainbow));text-shadow:0 1px 3px rgba(40,30,80,.35);font-family:var(--f-head);font-weight:900;font-size:16px;}
.done-msg{text-align:center;padding:10px 0 4px;}
.done-msg .em{font-size:48px;line-height:1;}
.done-msg p{margin:10px 0 0;font-family:var(--f-head);font-weight:900;font-size:18px;color:var(--ink);}


/* 登録・ログインの切りかえ */
.seg{display:flex;gap:4px;background:var(--mist);border-radius:12px;padding:4px;margin:0 0 16px;}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:9px 6px;font-family:var(--f-head);
  font-weight:700;font-size:13px;color:var(--sub);cursor:pointer;}
.seg button.on{background:var(--card);color:var(--deep);box-shadow:0 2px 8px rgba(60,42,110,.10);}
.seg.small button{font-size:12px;padding:7px 4px;}
.err a{color:var(--deep);}
.forgot{display:block;text-align:center;margin-top:12px;font-size:12px;color:var(--sub);}
.go-btn:disabled{opacity:.6;}
.foot{text-align:center;font-size:11px;color:var(--sub);line-height:2;margin-top:18px;}
.foot .verTag{font-family:monospace;font-size:9.5px;}

@media (prefers-reduced-motion: reduce){ .bub.join .ball,.sheet .card{animation:none !important;} }
</style>
<script src="loading.js"></script>
<script src="login.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="appicon" aria-hidden="true"></div>
    <div>
      <h1>Skyarc LINKサポート</h1>
      <p id="hello">ようこそ</p>
    </div>
  </div>

  <div class="crumb" id="crumb" hidden>
    <h2 id="crumbTitle"></h2>
  </div>

  <div class="info" id="info" hidden>
    <p id="infoText"></p>
    <a id="infoBtn" class="info-btn" target="_blank" rel="noopener"></a>
  </div>

  <nav class="stage" id="stage" aria-live="polite"></nav>

  <div class="foot">Presented by Skyarc-team<br><span class="verTag"></span></div>
</div>

<div class="sheet" id="memSheet" style="z-index:8100;" hidden>
  <div class="card" role="dialog" aria-labelledby="mTitle">
    <button type="button" class="close" id="mClose" aria-label="とじる">×</button>
    <h3 id="mTitle">👤 会員情報</h3>
    <p class="lead">ユーザーサポート会などで聞かれたら、ここを見せてください</p>
    <div class="minfo">
      <div class="row"><span class="k">① 登録名（ニックネーム）</span><span class="v" id="mName"></span></div>
      <div class="row"><span class="k">② 本名</span><span class="v" id="mReal"></span></div>
      <div class="row"><span class="k">③ 会員番号</span>
        <div class="idrow"><span class="v num" id="mId"></span><button type="button" class="cpy" id="mCopy">📋 コピー</button></div>
        <span class="cpmsg" id="mCopyMsg" aria-live="polite"></span></div>
    </div>
    <div class="pwnote">🔑 <b>LINKのサービスを使うためのパスワード</b>は、ここには出しません。<br>
      ほかの人に分からないように、ご自身でしっかり管理してください。<br>
      手帳にメモする、LINEのノートに書いておくなど、<b>ご自分がすぐ分かるところ</b>に残しておくと安心です。</div>
    <a class="mlink" href="./first-support/sheet-howto.html">📄 スプレッドシートの書き方<br><span style="font-size:13px;font-weight:700;">（イベントの申し込みのしかた）</span></a>
    <button type="button" class="mclose" id="mClose2">とじる</button>
  </div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-labelledby="jTitle">
    <button type="button" class="close" id="jClose" aria-label="とじる">×</button>
    <div id="jBody">
      <h3 id="jTitle">登録</h3>
      <p class="lead" id="jLead">これだけで、はじめられます</p>
      <div class="seg" id="jSeg">
        <button type="button" data-m="new" class="on">はじめての方</button>
        <button type="button" data-m="login">登録ずみの方</button>
      </div>
      <p class="err" id="jErr"></p>

      <form id="jForm" novalidate>
        <div class="f">
          <label for="jName">お名前</label>
          <input id="jName" autocomplete="name">
        </div>
        <div class="f">
          <label>Googleアカウント か メールアドレス</label>

const stage = document.getElementById("stage");

/* ---------- 丸いまとまりの中の置き場所 ---------- */
const WOBBLE = [[0,0],[4,-6],[-5,3],[6,4],[-3,-5],[5,2],[-6,-2],[3,6],[-4,5],[2,-4]];
function homes(n, centered, pair){
  if(centered === undefined) centered = n >= 7;
  if(pair && n >= 4) return homesPair(n);
  W = Math.min(stage.clientWidth || 360, 440);
  const cx = W/2;
  let pts = [], rx, ry;
  if(n === 1){ ry = centered ? Math.max(W*.39, 132) * .94 : 0; pts.push([0,0]); }
  else if(n === 2 && !centered){ rx = W*.26; ry = 0; pts.push([-rx,0],[rx,0]); }
  else{
    const ring = centered ? n-1 : n;
    rx = (ring >= 6 || (centered && ring >= 3)) ? Math.max(W*.39, 132) : Math.max(W*.32, 108);
    ry = rx * (ring >= 7 ? 1.22 : .94);   /* 7つ以上の輪は、たてに広げて重ならないように */
    if(centered) pts.push([0,0]);
    for(let i=0;i<ring;i++){
      const a = (ring === 2 ? Math.PI : -Math.PI/2) + i*2*Math.PI/ring;
      pts.push([Math.cos(a)*rx, Math.sin(a)*ry]);
    }
  }
  H = Math.max(2*(ry||0) + 140, 170);
  stage.style.height = H + "px";
  const k = W/360;
  return pts.map((p,i)=>[cx + p[0] + WOBBLE[i%10][0]*k, H/2 + p[1] + WOBBLE[i%10][1]*k]);
}

/* いちばん上の段：まん中にアカウント、そのまわりを「新しい仲間へ」が月のようにまわります。
   ほかのアイコンは、そのまわりに大きめの輪で並べます */
const ORBIT = { rx: 112, ry: 102, sec: 16 };      /* 月の通り道の大きさと、1周の秒数 */
function homesPair(n){
  W = Math.min(stage.clientWidth || 360, 440);
  const cx = W/2, ring = n-2;
  const rx = Math.max(W*.41, 140), ry = Math.max(W*.64, 235);
  const pts = [[0, 0], [0, ORBIT.ry]];
  for(let i=0;i<ring;i++){
    const a = -Math.PI/2 + i*2*Math.PI/ring;
    pts.push([Math.cos(a)*rx, Math.sin(a)*ry]);
  }
  H = Math.max(2*ry + 150, 170);
  stage.style.height = H + "px";
  const k = W/360;
  return pts.map((p,i)=>[cx + p[0] + (i<2 ? 0 : WOBBLE[i%10][0]*k*.6), H/2 + p[1] + (i<2 ? 0 : WOBBLE[i%10][1]*k*.6)]);
}

/* ---------- アイコンをひとつ作る ---------- */
function makeNode(it, i, home, fromX, fromY){

  el.innerHTML = `<span class="ball">${it.ic}</span><span class="nm">${it.nm}</span>`;
  if(path.length === 0 && it.url && it.url === pointUrl()){ el.classList.add("pointed"); el.insertAdjacentHTML("beforeend", '<span class="point" aria-hidden="true">👉</span>'); }
  stage.appendChild(el);
  const n = { el, it, hx:home[0], hy:home[1],
    x: fromX ?? home[0], y: fromY ?? home[1], vx:0, vy:0,
    s: fromX == null ? 1 : .3, ts:1, o: fromX == null ? 1 : 0, to:1,
    ph: i*1.7, delay: i*45, born: performance.now() };
  hook(n);
  return n;
}

/* ---------- 解放されたアイコンだけを、パッと足します ----------
   いま出ているアイコンはそのまま、新しい置き場所へすっと動きます */
function reflow(){
  if(path.length !== 0) return;
  const items = TREE.filter(ok);
  const hs = homes(items.length, true, true);
  const keep = [];
  nodes.forEach(n=>{
    if(items.indexOf(n.it) >= 0) keep.push(n);
    else{ n.to = 0; n.ts = .4; n.hx = null; n.dying = performance.now(); leaving.push(n); }
  });
  nodes = items.map((it,i)=>{
    let n = keep.find(k=>k.it === it);
    if(!n){
      n = makeNode(it, i, hs[i], hs[i][0], hs[i][1]);
      n.delay = 0; n.s = .2; n.ts = 1.25;
      setTimeout(()=>{ n.ts = 1; }, 320);
    }
    n.hx = hs[i][0]; n.hy = hs[i][1];
    return n;
  });
}

/* ---------- アイコンを並べる ---------- */

  if(!last && !me) items = [Object.assign({}, JOIN, { nm: isReturning() ? "ログイン" : "登録" })];  /* まだの方は、まん中のひとつだけ */
  if(last) items = [BACK].concat(items);                      /* 中の段は、まん中が「もどる」 */
  const hs = homes(items.length, path.length === 0 ? true : items.length > 1, path.length === 0 && !!me);  /* いちばん上は、まん中に上下でアカウントと「新しい仲間へ」 */
  nodes = items.map((it,i)=> makeNode(it, i, hs[i], fromX, fromY));

  document.getElementById("crumbTitle").textContent = (last ? last.nm.replace(/\n/g,"") : "");

  if(last && last.info){
    document.getElementById("infoText").textContent = last.info.text;
    const ib = document.getElementById("infoBtn");
    ib.hidden = !last.info.btn;
    if(last.info.btn){
      ib.textContent = last.info.btn; ib.href = last.info.url;
      /* このサイトの中のページは、同じタブで開きます */
      if(/^https?:\/\//.test(last.info.url)){ ib.target = "_blank"; ib.rel = "noopener"; }
      else{ ib.removeAttribute("target"); ib.removeAttribute("rel"); }
    }
  }
  stage.hidden = items.length === 0;

/* 今のアイコンを散らして、次の段へ */
function goTo(change, ox, oy, tapped){
  const cx = W/2, cy = H/2;
  nodes.forEach(n=>{
    if(n === tapped){ n.ts = 1.35; n.to = 0; n.fade = 160; }
    else{
      const dx = n.x - (ox ?? cx), dy = n.y - (oy ?? cy), d = Math.hypot(dx,dy) || 1;
      n.vx += dx/d*14; n.vy += dy/d*14; n.ts = .5; n.to = 0; n.hx = null;
    }
    n.dying = performance.now();
  });
  leaving = leaving.concat(nodes); nodes = [];
  change();
  setTimeout(()=> build(ox ?? cx, oy ?? cy), reduce ? 0 : 200);
}

/* ---------- 指でつまむ・押す ---------- */
function hook(n){
  const el = n.el;
  let sx, sy, moved = false, offx, offy, pid = null;
  el.addEventListener("pointerdown", e=>{
    if(e.button !== undefined && e.button !== 0) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; moved = false; n.justDragged = false;
    const r = stage.getBoundingClientRect();
    offx = e.clientX - r.left - n.x; offy = e.clientY - r.top - n.y;
    try{ el.setPointerCapture(pid); }catch(_){}
  });
  el.addEventListener("pointermove", e=>{
    if(pid !== e.pointerId) return;
    if(!moved && Math.hypot(e.clientX-sx, e.clientY-sy) > 8){
      moved = true; drag = n; n.ts = 1.12; el.classList.add("grab");
    }
    if(moved){
      const r = stage.getBoundingClientRect();
      const nx = e.clientX - r.left - offx, ny = e.clientY - r.top - offy;
      n.vx = nx - n.x; n.vy = ny - n.y; n.x = nx; n.y = ny;
    }
  });
  const end = e=>{
    if(pid !== e.pointerId) return;
    pid = null;
    if(moved){ drag = null; n.ts = 1; el.classList.remove("grab"); n.justDragged = true; lastDragEnd = performance.now(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("click", e=>{
    /* つまんで動かしたあとは、ページへは移らずに元の場所へ戻るだけ */
    if(n.justDragged || performance.now() - lastDragEnd < 500){ e.preventDefault(); e.stopPropagation(); n.justDragged = false; return; }
    /* 裏返せる丸は、少しだけ待って、2回目が来たら裏返します */
    if(n.it.flip){
      if(n.tapT){ clearTimeout(n.tapT); n.tapT = 0; flipNode(n); return; }
      n.tapT = setTimeout(()=>{ n.tapT = 0; tap(n, e); }, 300);
      return;
    }
    tap(n, e);
  });
}
function flipNode(n){
  n.flipped = !n.flipped;
  const face = n.flipped ? n.it.flip : n.it;
  n.el.classList.remove("flipping"); void n.el.offsetWidth; n.el.classList.add("flipping");

    n.el.querySelector(".ball").textContent = face.ic;
    n.el.querySelector(".nm").textContent = face.nm;
  }, reduce ? 0 : 220);
  setTimeout(()=> n.el.classList.remove("flipping"), 460);
  clearTimeout(n.flipBackT);
  if(n.flipped) n.flipBackT = setTimeout(()=>{ if(n.flipped && n.el.isConnected) flipNode(n); }, 8000);   /* しばらくしたら表に戻ります */
}

function tap(n, e){
  const it = n.flipped && n.it.flip ? n.it.flip : n.it;
  if(it.join){ openJoin(n); return; }
  if(it.back){ goBack(n); return; }
  /* 開ける方が決まっている丸：ほかの方には、お知らせだけを出します */
  if(it.lock === "adv" && !isAdv()){

      setTimeout(()=>{ sp.hidden = true; sp.className = "spread"; }, 380);
    }, reduce ? 0 : 650);
    return;
  }

}

/* 「もどる」のアイコンを押したら、1つ前の段へ */

/* ---------- 動き（ばねと、ふわふわ） ---------- */
function frame(t){
  const all = nodes.concat(leaving);
  /* 月：アカウントのまわりを、ゆっくりまわります（つまんでいる間は止まります） */
  const moon = path.length === 0 ? nodes.find(n=>n.it.moon) : null;
  const earth = moon ? nodes.find(n=>n.it === TREE[0]) : null;
  let orb = document.getElementById("orbit");
  if(!orb){ orb = document.createElement("div"); orb.id = "orbit"; orb.className = "orbit"; orb.style.opacity = 0; stage.prepend(orb); }
  if(moon && earth){
    orb.style.width = ORBIT.rx*2 + "px"; orb.style.height = ORBIT.ry*2 + "px";
    orb.style.transform = `translate(${earth.x - ORBIT.rx}px, ${earth.y - ORBIT.ry}px)`;
    orb.style.opacity = earth.o;
  }else orb.style.opacity = 0;
  if(moon && earth && moon !== drag && earth.hx != null){
    const a = reduce ? Math.PI/2 : Math.PI/2 + t/1000 * 2*Math.PI/ORBIT.sec;
    moon.hx = earth.hx + Math.cos(a)*ORBIT.rx;
    moon.hy = earth.hy + Math.sin(a)*ORBIT.ry;
  }
  for(const n of all){
    if(n !== drag){
      let ax = 0, ay = 0;
      if(n.hx != null){ ax = (n.hx - n.x)*.055; ay = (n.hy - n.y)*.055; }
      if(moon && n !== moon && n !== earth && n !== drag && n.hx != null){
        /* 月が近づいたら、ほかのアイコンは少しよけます */
        const dx = n.x - moon.x, dy = n.y - (moon.y + 14), d = Math.hypot(dx,dy) || 1, R = 150;
        if(d < R){ const f = (R-d)/R*7; ax += dx/d*f; ay += dy/d*f; n.dodge = true; } else n.dodge = false;
      }
      /* 「使い方」の丸をつまんで近づけたときも、ほかのアイコンはよけます */
      const fd = [tutF, howF, memF].find(x=>x && x.held && x.el.style.display !== "none") || null;
      if(fd && n.hx != null){
        /* アイコンをつまんだときと同じ動き：よけながら、まわりでくるくる混ざります（登録・ログインの丸も同じ） */
        const dx = n.x - fd.x, dy = n.y - fd.y, d = Math.hypot(dx,dy) || 1, R = 140;
        if(d < R){ const f = (R-d)/R*7; ax += dx/d*f; ay += dy/d*f; }
        ax += (-dy/d)*.35 + (Math.random()-.5)*.9;
        ay += ( dx/d)*.35 + (Math.random()-.5)*.9;
      }
      if(drag && n.hx != null){
        /* つまんだアイコンが近づくと、よけながら混ざる */
        const dx = n.x - drag.x, dy = n.y - drag.y, d = Math.hypot(dx,dy) || 1, R = 140;
        if(d < R){ const f = (R-d)/R*7; ax += dx/d*f; ay += dy/d*f; }
        ax += (-dy/d)*.35 + (Math.random()-.5)*.9;
        ay += ( dx/d)*.35 + (Math.random()-.5)*.9;
      }
      n.vx = (n.vx + ax)*.84; n.vy = (n.vy + ay)*.84;
      n.x += n.vx; n.y += n.vy;
      if(moon && n.hx != null){
        /* よけるのは、もとの場所から少しだけ（となりのアイコンまで押し出さないように） */
        const ox = n.x - n.hx, oy = n.y - n.hy, od = Math.hypot(ox, oy), MAXD = 56;
        if(n.dodge && !drag && od > MAXD){ n.x = n.hx + ox/od*MAXD; n.y = n.hy + oy/od*MAXD; }
        /* よけても、画面の外へは出ません（名前が長いアイコンは、名前の幅まで見ます） */
        if(n.lw == null){ const nm = n.el.querySelector(".nm"); n.lw = nm ? nm.offsetWidth : 0; }
        const lim = Math.max(44, n.lw/2 + 6);
        n.x = Math.min(Math.max(n.x, lim), W - lim);
      }
    }
    const wait = t - n.born < n.delay;
    if(!wait){ n.s += (n.ts - n.s)*.2; n.o += (n.to - n.o)*.2; }
    if(reduce){ n.s = n.ts; n.o = n.to; }
    const fy = reduce || n === drag ? 0 : Math.sin(t/650 + n.ph)*5;
    const fx = reduce || n === drag ? 0 : Math.cos(t/900 + n.ph)*2.5;
    const hw = n.it.join ? 55 : 48, hh = n.it.join ? 50 : (n.it.moon ? 28 : 40);
    n.el.style.transform = `translate(${n.x - hw + fx}px, ${n.y - hh + fy}px) scale(${n.s})`;
    n.el.style.opacity = n.o;
  }
  placeHowto(t);
  placeTut(t);
  placeMem(t);
  leaving = leaving.filter(n=>{
    if(t - n.dying > 420){ n.el.remove(); return false; }
    return true;
  });
  requestAnimationFrame(frame);
}


/* ================================================================
   小さな「使い方」の丸（ほかのアイコンとは別に、ひとつだけで動きます）
   ・ふわふわ浮いています
   ・指でつまんで動かせます（はなすと、元の場所へゆっくり戻ります）
   ・押すと使い方のページへ
================================================================ */
function makeFloater(cls, ph, opt){
  const el = document.createElement("a");
  el.className = cls; el.href = (opt && opt.href) || (B + "howto.html");
  el.setAttribute("aria-label", (opt && opt.aria) || "使い方（このサイトの使い方）を見る");
  el.innerHTML = opt ? `<span class="tb">${opt.ic}</span><span class="tt">${opt.nm}</span>`
               : cls === "howto" ? '<span class="hb">📖</span><span class="ht">使い方</span>'
                                 : '<span class="tb">📖</span><span class="tt">使い方</span>';
  el.draggable = false;
  const f = { el, x: null, y: null, vx: 0, vy: 0, hx: 0, hy: 0, ph, held: false, moved: false, last: -1e9 };
  let sx, sy, offx, offy, pid = null;
  el.addEventListener("pointerdown", e=>{
    if(e.button !== undefined && e.button !== 0) return;
    e.stopPropagation();
    pid = e.pointerId; sx = e.clientX; sy = e.clientY; f.moved = false;
    const r = stage.getBoundingClientRect();
    offx = e.clientX - r.left - f.x; offy = e.clientY - r.top - f.y;
    try{ el.setPointerCapture(pid); }catch(_){}
  });
  el.addEventListener("pointermove", e=>{
    if(pid !== e.pointerId) return;
    e.stopPropagation();
    if(!f.moved && Math.hypot(e.clientX-sx, e.clientY-sy) > 8){ f.moved = true; f.held = true; el.classList.add("grab"); }
    if(f.moved){
      const r = stage.getBoundingClientRect();
      const nx = e.clientX - r.left - offx, ny = e.clientY - r.top - offy;
      f.vx = nx - f.x; f.vy = ny - f.y; f.x = nx; f.y = ny;
    }
  });
  const end = e=>{
    if(pid !== e.pointerId) return;
    pid = null;
    if(f.moved){ f.held = false; el.classList.remove("grab"); f.last = performance.now(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("click", e=>{
    /* つまんで動かしたあとは、ページへは移らずに元の場所へ戻るだけ */
    if(f.moved || performance.now() - f.last < 400){ e.preventDefault(); e.stopPropagation(); f.moved = false; return; }
    if(opt && opt.onTap){ e.preventDefault(); opt.onTap(); }
  });
  return f;
}
/* ばねで元の場所へ戻りながら、ふわふわ揺れます */
function stepFloater(f, t, s, o, hw, hh){
  if(f.x == null){ f.x = f.hx; f.y = f.hy; }
  if(!f.held){
    f.vx = (f.vx + (f.hx - f.x)*.05)*.85; f.vy = (f.vy + (f.hy - f.y)*.05)*.85;
    f.x += f.vx; f.y += f.vy;
  }
  const fy = reduce || f.held ? 0 : Math.sin(t/700 + f.ph)*5;
  const fx = reduce || f.held ? 0 : Math.cos(t/1100 + f.ph)*3;
  f.el.style.transform = `translate(${f.x - hw + fx}px, ${f.y - hh + fy}px) scale(${f.held ? s*1.12 : s})`;
  f.el.style.opacity = o;
}

/* ---- ログイン中のトップ：まわりの輪よりも外の、右下に置きます ---- */
let tutF = null, tutKey = "";
/* ほかのアイコンの「元の場所」と重ならない、輪の外の右下をさがします（並びが変わったときだけ） */
function tutHome(){
  const acc = nodes.find(n=>n.it === TREE[0]) || { hx: W/2, hy: H/2 };
  const boxes = nodes.filter(n=>!n.it.moon && n.hx != null).map(n=>{
    const lw = Math.max(70, n.lw || 0);
    return [n.hx - Math.max(42, lw/2) - 16, n.hy - 48, n.hx + Math.max(42, lw/2) + 16, n.hy + 72];   /* ふわふわ揺れる分も見ておきます */
  });
  /* 月の通り道（輪）にもかからないように */
  const inOrbit = (x, y)=>{ const dx = (x - acc.hx)/(ORBIT.rx + 50), dy = (y - acc.hy)/(ORBIT.ry + 50); return dx*dx + dy*dy < 1; };
  /* 目じるし：輪のいちばん右より外側で、高さはまん中と、いちばん下のアイコンの間くらい */
  const hs = nodes.filter(n=>!n.it.moon && n.hx != null);
  const maxY = Math.max(...hs.map(n=>n.hy)), maxX = Math.max(...hs.map(n=>n.hx));
  /* サポーターの部屋がない方は、いちばん下の「各種スケジュール情報」よりも下の右へ */
  const hasSup = nodes.some(n=>n.it.g === "sup" && n.it.kids);
  const ax = W - 44, ay = hasSup ? acc.hy + (maxY - acc.hy)*.66 : maxY + 60;
  let best = null, bestS = Infinity;
  for(let x = W - 44; x >= W*.45; x -= 4){
    for(let y = Math.min(H + 30, maxY + 80); y >= acc.hy; y -= 4){
      const box = [x - 42, y - 18, x + 42, y + 34];
      let a = 0;
      boxes.forEach(r=>{
        const ox = Math.min(box[2], r[2]) - Math.max(box[0], r[0]);
        const oy = Math.min(box[3], r[3]) - Math.max(box[1], r[1]);
        if(ox > 0 && oy > 0) a += ox*oy;
      });
      if(inOrbit(x, y)) a += 5000;
      const sc = a*100 + Math.hypot(x - ax, y - ay) - .5*Math.hypot(x - acc.hx, y - acc.hy);
      if(sc < bestS){ bestS = sc; best = [x, y]; }
    }
  }
  return best;
}
function placeTut(t){
  const top = path.length === 0 && me;
  const sch = top ? nodes.find(n=>n.it.g === "apply" && n.it.kids) : null;
  if(!sch){ if(tutF) tutF.el.style.display = "none"; tutKey = ""; return; }
  if(!tutF){ tutF = makeFloater("tut", 2.1); stage.insertBefore(tutF.el, stage.firstChild); }
  tutF.el.style.display = "";
  const key = W + "|" + H + "|" + nodes.map(n=>Math.round(n.hx||0) + "," + Math.round(n.hy||0)).join(";");
  if(key !== tutKey){
    nodes.forEach(n=>{ if(n.lw == null){ const nm = n.el.querySelector(".nm"); n.lw = nm ? nm.offsetWidth : 0; } });
    const h = tutHome(); if(h){ tutF.hx = h[0]; tutF.hy = h[1]; } tutKey = key;
  }
  stepFloater(tutF, t, sch.s, sch.o, 40, 16);
}

/* ---- ログイン中のトップ：「会員情報」を左上（はじめの一歩と初期サポートガイドの間の、輪の外）に置きます ---- */
let memF = null, memKey = "";
function memHome(){
  const acc = nodes.find(n=>n.it === TREE[0]) || { hx: W/2, hy: H/2 };
  const a = nodes.find(n=>n.it.url === B + "first-support/");            /* はじめの一歩 */
  const g = nodes.find(n=>n.it.url === B + "first-support/guide.html");  /* 初期サポートガイド */
  const hs = nodes.filter(n=>!n.it.moon && n.hx != null);
  const boxes = hs.map(n=>{
    const lw = Math.max(70, n.lw || 0);
    return [n.hx - Math.max(42, lw/2) - 16, n.hy - 48, n.hx + Math.max(42, lw/2) + 16, n.hy + 72];
  });
  if(tutF && tutF.hx) boxes.push([tutF.hx - 50, tutF.hy - 30, tutF.hx + 50, tutF.hy + 44]);
  const inOrbit = (x, y)=>{ const dx = (x - acc.hx)/(ORBIT.rx + 50), dy = (y - acc.hy)/(ORBIT.ry + 50); return dx*dx + dy*dy < 1; };
  /* 目じるし：2つの丸のまん中から、輪の外へ少し出たところ */
  let tx = 44, ty = acc.hy - 120;
  if(a && g){
    const mx = (a.hx + g.hx)/2, my = (a.hy + g.hy)/2;
    const dx = mx - acc.hx, dy = my - acc.hy, d = Math.hypot(dx, dy) || 1;
    tx = mx + dx/d*70; ty = my + dy/d*70;
  }
  let best = null, bestS = Infinity;
  for(let x = 44; x <= W*.55; x += 4){
    for(let y = Math.max(40, acc.hy - 300); y <= acc.hy + 40; y += 4){
      const box = [x - 42, y - 18, x + 42, y + 34];
      let ar = 0;
      boxes.forEach(r=>{
        const ox = Math.min(box[2], r[2]) - Math.max(box[0], r[0]);
        const oy = Math.min(box[3], r[3]) - Math.max(box[1], r[1]);
        if(ox > 0 && oy > 0) ar += ox*oy;
      });
      if(inOrbit(x, y)) ar += 5000;
      const sc = ar*100 + Math.hypot(x - tx, y - ty);
      if(sc < bestS){ bestS = sc; best = [x, y]; }
    }
  }
  return best;
}
function placeMem(t){
  const top = path.length === 0 && me;
  const sch = top ? nodes.find(n=>n.it.g === "apply" && n.it.kids) : null;
  if(!sch){ if(memF) memF.el.style.display = "none"; memKey = ""; return; }

  if(key !== memKey){

}

  $("#jForm").hidden = (m !== "new");
  $("#lForm").hidden = (m !== "login");
  $("#jTitle").textContent = (m === "new") ? "登録" : "ログイン";
  $("#jLead").textContent = (m === "new") ? "これだけで、はじめられます" : "ご登録のときの内容で入れます";
  msg("");
}
document.querySelectorAll("#jSeg button").forEach(b=>b.addEventListener("click", ()=> setMode(b.dataset.m)));

function setLoginTab(t){
  loginTab = t;
  document.querySelectorAll("#lTabs button").forEach(b=>b.classList.toggle("on", b.dataset.t === t));
  $("#lPaneG").hidden = (t !== "google");
  $("#lPaneId").hidden = (t !== "id");
  $("#lPaneMail").hidden = (t !== "mail");
  msg("");
}
document.querySelectorAll("#lTabs button").forEach(b=>b.addEventListener("click", ()=> setLoginTab(b.dataset.t)));

function msg(t){
  const e = $("#jErr");
  e.innerHTML = t || "";
  e.style.display = t ? "block" : "none";
  if(!t) return;
  /* いま見えている方の「はじめる」「ログイン」ボタンのすぐ上へ動かして、画面に入るように動かします
     （iPhone でキーボードが出ていても見えるように） */
  const btn = $("#lForm").hidden ? $("#jGo") : $("#lGo");
  if(btn && e.nextElementSibling !== btn) btn.parentNode.insertBefore(e, btn);
  try{ e.scrollIntoView({ block:"center", behavior: reduce ? "auto" : "smooth" }); }catch(x){ e.scrollIntoView(); }
}
function onlyDigits(el, max){
  el.addEventListener("input", ()=>{
    el.value = el.value.replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"").slice(0, max || 99);
  });
}
onlyDigits($("#jPin"), 4); onlyDigits($("#lPin"), 4); onlyDigits($("#jId")); onlyDigits($("#lId"));

/* ---------- Google ---------- */
function startGoogle(forWhat){
  gFor = forWhat;
  if(!window.google || !google.accounts){
    msg("Googleの読み込みが終わっていません。少しお待ちください。");
    return;
  }
  google.accounts.id.prompt();
}
function onGoogle(res){
  try{
    const p = JSON.parse(decodeURIComponent(escape(atob(res.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));
    gMail = String(p.email || "").toLowerCase();
    gName = p.name || "";
    const label = "✓ " + gMail;
    $("#jGoogle").classList.add("done"); $("#jGoogle").textContent = label;
    $("#lGoogle").classList.add("done"); $("#lGoogle").textContent = label;
    $("#jMail").value = "";
    if(gFor === "new" && !$("#jName").value.trim() && gName) $("#jName").value = gName;
    msg("");
  }catch(e){
    msg("Googleの確認ができませんでした。");
  }
}
window.addEventListener("load", ()=>{
  if(window.google && google.accounts){
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle });
  }
});
$("#jGoogle").addEventListener("click", ()=> startGoogle("new"));
$("#lGoogle").addEventListener("click", ()=> startGoogle("login"));
$("#jMail").addEventListener("input", e=>{
  if(e.target.value && gMail){
    gMail = "";
    $("#jGoogle").classList.remove("done");
    $("#jGoogle").innerHTML = '<b style="color:#4285F4;">G</b> Googleアカウントでつなぐ';
  }
});

/* ---------- 端末に残す ---------- */
function saveMe(j, pin, fallbackId){
  const m = {
    id: j.id || fallbackId, pin: pin, email: j.email || "",
    name: j.name || "", realName: j.realName || "", area: j.area || "",
    keiretsu: j.keiretsu || "", role: j.role || "",
    sup: j.sup === true, crie: j.crie === true,
    nick: j.nick || "", keiChat: j.keiChat || "", refUrl: j.refUrl || "", linkJoin: j.linkJoin || "",
    badges: j.badges || [], celebrate: j.celebrate || "", helper: j.helper || "",
    dept: j.dept || "", deptLead: j.deptLead === true, schedIn: j.schedIn === true,
    needPin: j.needPin === true
  };
  localStorage.setItem("skyarc_member", JSON.stringify(m));
  if(!localStorage.getItem("skyarc_member")) throw new Error("nosave");
  me = m;
  markReturning();
  pointProg = null; loadPoint();
  return m;
}
function welcome(text){
  $("#jBody").hidden = true;
  $("#jDoneMsg").textContent = text;
  $("#jDone").hidden = false;
  setTimeout(()=>{
    $("#sheet").hidden = true;
    setHello(text);
    path.length = 0;
    goTo(()=>{}, W/2, H/2, nodes.find(n=>n.it.join));
  }, 1300);
}
const ERR = {
  busy: "いま混み合っています。少しおいてお試しください。",
  emailtaken: "このメールアドレス（Googleアカウント）は、すでにご登録があります。<br>上の「登録ずみの方」から、ご自分で決めたパスコードで入ってください。",
  exists: "この会員番号は、すでにご登録があります。<br>上の「登録ずみの方」から、ご自分で決めたパスコードで入ってください。",
  proxy: "あなたは、すでにサポートのどなたかから登録をしてもらっています。<br>上の「登録ずみの方」から、会員番号とはじめのパスコード「1111」で入り、そのあと、ご自分で決めた新しいパスコードに変えてください。",
  pin1111: "1111 は使えません。ご自分で決めた数字4桁を入れてください。<br>サポートの方に先に登録してもらった方は、上の「登録ずみの方」から、会員番号と「1111」で入ることもできます。",
  badpin: "パスコードは数字4桁で入れてください。",
  badid: "会員番号は数字だけで入れてください。",
  bademail: "メールアドレスをご確認ください。",
  noname: "お名前を入れてください。",
  nomember: "ご登録が見つかりません。",
  email: "ご登録のGoogleアカウントと異なります。",
  nosave: "この端末では、ログインの記録を残せない設定になっています。<br>ブラウザの「プライベートモード」を解いてお試しください。"
};

/* ---------- はじめての方：登録 ---------- */
$("#jForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const name = $("#jName").value.trim();
  const mail = gMail || $("#jMail").value.trim().toLowerCase();
  const pin  = $("#jPin").value.trim();
  const id   = $("#jId").value.trim();
  const bad = !name ? ERR.noname
            : !mail ? "Googleアカウントをつなぐか、メールアドレスを入れてください。"
            : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail) ? ERR.bademail
            : !/^\d{4}$/.test(pin) ? ERR.badpin
            : pin === "1111" ? ERR.pin1111
            : "";
  if(bad){ msg(bad); return; }
  msg("");
  const btn = $("#jGo"); btn.disabled = true;
  if(typeof skyLoading === "function") skyLoading("登録しています…");
  try{
    const body = new URLSearchParams({ action:"join", name, email:mail, pin, id, authType: gMail ? "Google" : "メール" });
    const r = await fetch(GAS_URL, { method:"POST", body });
    const j = await r.json();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return;
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(!j || j.ok !== true){ msg(ERR[j && j.error] || "登録できませんでした。少しおいてお試しください。"); return; }
    saveMe(j, pin, j.id);
    welcome(name + "さん、ようこそ");
  }catch(err){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    msg(err && err.message === "nosave" ? ERR.nosave : "通信できませんでした。電波のよい場所でお試しください。");
  }finally{
    btn.disabled = false;
  }
});

/* ---------- 登録ずみの方：ログイン ---------- */
$("#lForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const pin = $("#lPin").value.trim();
  let id = "", email = "";
  if(loginTab === "google"){
    if(!gMail){ msg("先にGoogleアカウントをえらんでください。"); return; }
    email = gMail;
  }else if(loginTab === "mail"){
    email = $("#lMail").value.trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ msg(ERR.bademail); return; }
  }else{
    id = $("#lId").value.trim();
    if(!id){ msg("会員番号を入れてください。"); return; }
  }
  if(!/^\d{4}$/.test(pin)){ msg(ERR.badpin); return; }
  msg("");
  const btn = $("#lGo"); btn.disabled = true;
  if(typeof skyLoading === "function") skyLoading("ログインしています…");
  try{
    if(!id){
      const r0 = await fetch(`${GAS_URL}?action=byEmail&email=${encodeURIComponent(email)}`);
      const j0 = await r0.json();
      if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j0)) return;
      const list = (j0 && j0.members) || [];
      if(!j0.ok || !list.length){
        if(typeof skyLoadingDone === "function") skyLoadingDone();
        msg("このメールアドレス（Googleアカウント）でのご登録が見つかりません。<br>会員番号でお試しいただくか、「はじめての方」から登録してください。");
        return;
      }
      id = list[0].id;
    }
    const url = `${GAS_URL}?action=loginFast&id=${encodeURIComponent(id)}&pin=${encodeURIComponent(pin)}` +
                (loginTab === "google" ? `&email=${encodeURIComponent(email)}` : "");
    const r = await fetch(url);
    const j = await r.json();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return;
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(!j || j.ok !== true){
      if(j && j.error === "locked") msg(`パスコードのお間違いが続いたため、<b>${j.wait || 60}秒ほど</b>おやすみいただきます。`);
      else if(j && j.error === "pin") msg("パスコードが違います。" + (j.rest > 0 ? `<br>あと${j.rest}回まちがえると、少しおやすみになります。` : ""));
      else msg(ERR[j && j.error] || "ログインできませんでした。");
      return;
    }
    const m = saveMe(j, pin, id);
    welcome((m.name || "") + (m.name ? "さん、おかえりなさい" : "おかえりなさい"));
  }catch(err){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    msg(err && err.message === "nosave" ? ERR.nosave : "通信できませんでした。電波のよい場所でお試しください。");
  }finally{
    btn.disabled = false;
  }
});
$("#lForgot").addEventListener("click", e=>{
  e.preventDefault();
  msg("パスコードは、ご登録ページから決めなおしていただけます。<br>" +
      "<a href='./touroku.html' style='color:var(--deep);font-weight:700;'>ご登録ページをひらく ›</a>");
});

/* ================================================================
   ログインしている方は、立場が変わっていないかを裏でそっと確かめます
   （サポーターやクリエになったときに、アイコンが増えるように）
================================================================ */
(async function refresh(){
  if(!me || !me.id || !me.pin || !GAS_URL) return;
  try{
    const r = await fetch(`${GAS_URL}?action=loginFast&id=${encodeURIComponent(me.id)}&pin=${encodeURIComponent(me.pin)}`);
    const j = await r.json();
    if(!j || j.ok !== true) return;
    const before = [me.id, me.sup, me.crie, me.role, me.name, me.dept, me.deptLead, me.schedIn].join("|");
    const keep = me;
    const m = Object.assign({}, keep, {
      id: j.id || keep.id, name: j.name || keep.name || "", realName: j.realName || "",
      area: j.area || "", keiretsu: j.keiretsu || "", role: j.role || "",
      sup: j.sup === true, crie: j.crie === true, email: j.email || keep.email || "",
      nick: j.nick || "", keiChat: j.keiChat || "", refUrl: j.refUrl || "", linkJoin: j.linkJoin || "", helper: j.helper || "",
      dept: j.dept || "", deptLead: j.deptLead === true, schedIn: j.schedIn === true,
      needPin: j.needPin === true
    });
    localStorage.setItem("skyarc_member", JSON.stringify(m));
    me = m;
    if(before !== [me.id, me.sup, me.crie, me.role, me.name, me.dept, me.deptLead, me.schedIn].join("|")){
      setHello();
      if(path.length === 0 && !drag) reflow();
    }
  }catch(e){}
})();

/* ================================================================
   次に進むところを指さします（スプレッドシートの進み具合で決まります）
     はじめの一歩 → 初期サポートガイド → 活用の1stステップ
     「終わった」… その進み具合のタブで、項目がぜんぶチェック済み（または卒業）
     3つとも終わったら、指はなくなります
================================================================ */
const POINT_ORDER = [
  { app:"hajime", url:B+"first-support/" },
  { app:"guide",  url:B+"first-support/guide.html" },
  { app:"step1",  url:B+"first-support/step1.html" }
];
const POINT_KEY = "skyarc_point";
let pointProg = null;                 /* { hajime:true/false, guide:…, step1:… } */
try{
  const c = JSON.parse(localStorage.getItem(POINT_KEY) || "null");
  if(c && me && c.id === me.id) pointProg = c.done;
}catch(e){}
setHello();   /* 前回の記録で、すぐマークを出します（通信を待たない） */
function pointUrl(){
  if(!me || !pointProg) return "";
  const next = POINT_ORDER.find(o=>pointProg[o.app] !== true);
  return next ? next.url : "";
}
function paintPoint(){
  const want = pointUrl();
  nodes.forEach(n=>{
    const on = path.length === 0 && !!n.it.url && n.it.url === want;
    const has = n.el.querySelector(".point");
    if(on && !has){ n.el.classList.add("pointed"); n.el.insertAdjacentHTML("beforeend", '<span class="point" aria-hidden="true">👉</span>'); }
    if(!on && has){ n.el.classList.remove("pointed"); has.remove(); }
  });
}
async function loadPoint(){
  if(!me || !me.id || !me.pin || !GAS_URL) return;
  try{
    const r = await fetch(`${GAS_URL}?action=home&id=${encodeURIComponent(me.id)}&pin=${encodeURIComponent(me.pin)}&apps=${encodeURIComponent(POINT_ORDER.map(o=>o.app).join(","))}`);
    const j = await r.json();
    if(j && j.ok === true && j.links && typeof j.links === "object"){
      LINKS = j.links;
      try{ localStorage.setItem(LINKS_KEY, JSON.stringify(j.links)); }catch(e){}
    }
    if(!j || j.ok !== true || !j.progress) return;
    const done = {};
    POINT_ORDER.forEach(o=>{ done[o.app] = !!(j.progress[o.app] && j.progress[o.app].done); });
    const wasG3 = ok({ need:"grow3" });
    pointProg = done;
    try{ localStorage.setItem(POINT_KEY, JSON.stringify({ id: me.id, done: done })); }catch(e){}
    if(wasG3 !== ok({ need:"grow3" }) && path.length === 0 && !drag) reflow();
    paintPoint();
    setHello();
    celebrateGrowth();
  }catch(e){}
}
loadPoint();

/* 段階が上がったときに、1回だけお祝いします（この端末に、見た段階を覚えておきます） */
function celebrateGrowth(){
  const g = growNow();
  if(g == null || !me) return;
  const KEY = "sky_growth_seen";
  let seen = null;
  try{ const c = JSON.parse(localStorage.getItem(KEY) || "null"); if(c && c.id === me.id) seen = c.s; }catch(e){}
  try{ localStorage.setItem(KEY, JSON.stringify({ id: me.id, s: g })); }catch(e){}
  if(g === 0 || (seen != null && g <= seen)) return;
  const MSG = ["", "🌱 芽が出ました！ はじめの一歩、おつかれさまでした",
               "🌷 花が咲きました！ 初期サポートガイド、おつかれさまでした",
               "🌈 ファーストサポート修了認定！ ここまで、本当におつかれさまでした"];
  showToast(MSG[g], 5200);
}

/* 短いお知らせ（下に少し出て消えます） */
let toastT = 0;
function showToast(msg, ms){
  let t = document.getElementById("toast");
  if(!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=> t.classList.remove("show"), ms || 2600);
}

/* メニューの「ログインする」から来たときは、ログインの画面をそのまま開きます */
function openLoginFromMenu(){
  if(me || (location.hash !== "#login" && location.hash !== "#join")) return;
  const want = location.hash === "#join" ? "new" : "login";   /* 使い方のページの「登録する」からは、登録の画面 */

  if(openMenu){ const bg = document.querySelector(".skym-bg"); if(bg) bg.click(); }
  joinMode = want;
  setTimeout(()=>{ showSheet(); try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){} }, 350);
}
openLoginFromMenu();
window.addEventListener("hashchange", openLoginFromMenu);   /* このページのメニューから押したとき */
