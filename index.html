<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ログイン｜スカイアーク</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./beta.css">
<link rel="icon" type="image/png" sizes="64x64" href="./img/gcon-icon-64.png">
<meta name="theme-color" content="#6E5FB5">
<style>
  :root{
    --ink:#2A2438; --deep:#6E5FB5; --leaf:#3FA98A; --sun:#F2B33D;
    --mist:#F0EDF9; --paper:#FCFBFF; --line:#E4E0F0;
    --shadow:0 4px 20px rgba(60,42,110,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);line-height:1.75;
       font-size:15px;min-height:100vh;display:flex;flex-direction:column;
       padding:0 16px calc(env(safe-area-inset-bottom) + 30px);}
  button{font-family:inherit;cursor:pointer;border:none;}
  .wrap{max-width:400px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column;justify-content:center;padding:30px 0;}

  .hero{text-align:center;margin-bottom:22px;}
  .hero .em{font-size:46px;line-height:1;}
  .hero h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:23px;
    color:var(--deep);margin:10px 0 6px;line-height:1.5;}
  .hero p{font-size:13px;color:#7A7390;line-height:1.9;}

  .card{background:#fff;border-radius:20px;padding:24px 20px;box-shadow:var(--shadow);}

  /* タブ */
  .tabs{display:flex;gap:6px;background:var(--mist);border-radius:13px;padding:4px;margin-bottom:20px;}
  .tabs button{flex:1;padding:11px;border-radius:10px;background:none;color:#7A7390;
    font-size:13px;font-weight:700;transition:.2s;}
  .tabs button.on{background:#fff;color:var(--deep);box-shadow:0 2px 8px rgba(60,42,110,.10);}

  .pane{display:none;}
  .pane.on{display:block;}

  .f{margin-bottom:15px;}
  .f label{display:block;font-size:12px;font-weight:700;color:var(--deep);margin-bottom:6px;}
  .f input{width:100%;padding:14px;font-size:16px;border:2px solid var(--line);
    border-radius:12px;background:var(--paper);font-family:inherit;color:var(--ink);}
  .f input:focus{outline:none;border-color:var(--leaf);background:#fff;}
  .f input.big{text-align:center;font-size:26px;letter-spacing:.5em;padding-left:.5em;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;}
  .f .hint{font-size:11px;color:#9A93B0;margin-top:6px;line-height:1.7;}

  .gbtn{width:100%;padding:14px;border-radius:12px;background:#fff;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:14px;font-weight:700;color:#4A4560;margin-bottom:15px;}
  .gbtn:active{background:var(--mist);}
  .gbtn svg{width:19px;height:19px;flex-shrink:0;}
  .gbtn.done{border-color:var(--leaf);background:#F6FCFA;color:var(--leaf);}

  .main-btn{width:100%;padding:16px;border-radius:14px;background:var(--deep);color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:16px;
    box-shadow:0 4px 16px rgba(110,95,181,.3);}
  .main-btn:active{transform:scale(.985);}
  .main-btn:disabled{opacity:.45;box-shadow:none;}

  .msg{display:none;border-radius:11px;padding:11px 13px;font-size:12.5px;
    line-height:1.8;margin-bottom:15px;}
  .msg.err{display:block;background:#FDEBEB;color:#B3352F;}
  .msg.ok{display:block;background:#EAF7F0;color:#2F7A5C;}
  .msg.warn{display:block;background:#FFF6E0;color:#8A6D00;}

  .sub-links{text-align:center;margin-top:20px;}
  .sub-links a{display:inline-block;font-size:12.5px;color:#7A7390;text-decoration:none;
    padding:8px 10px;line-height:1.8;}
  .sub-links a b{color:var(--deep);}
  .divider{display:flex;align-items:center;gap:12px;margin:22px 0 18px;}
  .divider span{font-size:11.5px;color:#B0AAC4;white-space:nowrap;}
  .divider i{flex:1;height:1px;background:var(--line);}

  .new-btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--mist);
    color:var(--deep);text-align:center;text-decoration:none;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;}

  .foot{text-align:center;font-size:11px;color:#B0AAC4;line-height:2;padding-top:16px;}
  .foot .ver{font-family:monospace;font-size:9.5px;}

  /* 入りなおしのご案内 */
  .welcome{background:var(--mist);border-radius:14px;padding:14px 16px;margin-bottom:18px;
    display:flex;align-items:center;gap:12px;}
  .welcome .av{width:40px;height:40px;border-radius:12px;background:var(--deep);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .welcome .nm{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14.5px;}
  .welcome .sub{font-size:11.5px;color:#7A7390;}
  .welcome button{margin-left:auto;background:none;color:#9A93B0;font-size:11px;
    text-decoration:underline;padding:4px;flex-shrink:0;}
</style>
<script src="loading.js"></script>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="em">🌱</div>
    <h1>おかえりなさい</h1>
    <p>スカイアーク 育成プログラム</p>
  </div>

  <div class="card">

    <!-- ログイン済みの方 -->
    <div class="welcome" id="welcome" style="display:none;">
      <span class="av">🐣</span>
      <div>
        <div class="nm" id="wcName"></div>
        <div class="sub" id="wcSub"></div>
      </div>
      <button onclick="forgetMe()">ちがう方</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="tabs" id="tabs">
      <button class="on" data-t="google" onclick="setTab('google')">Google</button>
      <button data-t="id" onclick="setTab('id')">会員番号</button>
    </div>

    <!-- Googleでログイン -->
    <div class="pane on" id="pane-google">
      <button class="gbtn" id="gBtn" onclick="doGoogle()">
        <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.8-6.8C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.2-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.2 5.6c4.2-3.9 6.6-9.6 6.6-16.4z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.5 0 20.1 0 24s1 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2.1 1.4-4.8 2.3-8.7 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.2C6.5 42.6 14.6 48 24 48z"/></svg>
        <span id="gLabel">Googleでログイン</span>
      </button>
    </div>

    <!-- 会員番号でログイン -->
    <div class="pane" id="pane-id">
      <div class="f">
        <label>会員番号</label>
        <input type="text" id="inId" name="member-id" autocomplete="username"
               inputmode="numeric" placeholder="00012345">
      </div>
    </div>

    <!-- パスコード(共通) -->
    <div class="f">
      <label>パスコード</label>
      <input type="password" id="inPin" class="big" name="pin" autocomplete="current-password"
             inputmode="numeric" maxlength="4" placeholder="••••">
      <p class="hint">ご登録のときに決めていただいた4桁の数字です</p>
    </div>

    <button class="main-btn" id="loginBtn" onclick="doLogin()">ログイン</button>

    <div class="sub-links">
      <a href="#" onclick="openReset();return false;">パスコードをお忘れの方</a>
    </div>

    <div class="divider"><i></i><span>はじめての方</span><i></i></div>
    <a href="./touroku.html" class="new-btn">📝 会員情報を登録する</a>
    <p style="font-size:11.5px;color:#9A93B0;text-align:center;line-height:1.8;margin-top:10px;">
      はじめてご利用の方は、こちらから<br>お名前などをご登録ください
    </p>
  </div>

  <div class="foot">
    Presented by Skyarc-team<br>
    <span class="ver">v1.81 (2026/08/18)</span>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzY2l20zwGULjnKRUqvRpbH79fPkl5e-sWNVoXEIgBrDpqhjDAx2zLvJuqO3sZxAfHj/exec";
const CLIENT_ID = "315827385958-ikdpkfhkr6nmrgql470aolt4pv27pak3.apps.googleusercontent.com";

let tab = "google";
let googleEmail = "", googleName = "";
let knownId = "";     // 前に入られた会員番号

function $(q){ return document.querySelector(q); }
function show(t, cls){
  const m = $("#msg");
  m.innerHTML = t; m.className = "msg " + cls;
}
function hideMsg(){ $("#msg").className = "msg"; }

/* ---------- 前回の方をお迎えします ---------- */
(function(){
  let m = null;
  try{
    const raw = localStorage.getItem("skyarc_member");
    if(raw && raw !== "null") m = JSON.parse(raw);
  }catch(e){}
  if(m && m.id){
    knownId = m.id;
    $("#welcome").style.display = "flex";
    $("#wcName").textContent = (m.name || "会員番号 " + m.id) + " さん";
    $("#wcSub").textContent = (m.keiretsu || "") + "　パスコードを入れてください";
    $("#tabs").style.display = "none";
    $("#pane-google").classList.remove("on");
    $("#pane-id").classList.remove("on");
    setTimeout(()=>$("#inPin").focus(), 300);
  }
})();

function forgetMe(){
  knownId = "";
  try{ localStorage.removeItem("skyarc_member"); }catch(e){}
  $("#welcome").style.display = "none";
  $("#tabs").style.display = "flex";
  setTab("google");
  hideMsg();
}

/* ---------- タブ ---------- */
function setTab(t){
  tab = t;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.t === t));
  $("#pane-google").classList.toggle("on", t === "google");
  $("#pane-id").classList.toggle("on", t === "id");
  hideMsg();
}

/* ---------- Googleでログイン ---------- */
function doGoogle(){
  if(!window.google || !google.accounts){
    show("Googleの読み込みが終わっていません。少しお待ちください。", "warn");
    return;
  }
  google.accounts.id.prompt();
}

function onGoogle(res){
  try{
    const p = JSON.parse(atob(res.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    googleEmail = p.email || "";
    googleName = p.name || "";
    $("#gBtn").classList.add("done");
    $("#gLabel").textContent = "✅ " + googleEmail;
    show("Googleの確認ができました。パスコードを入れてください。", "ok");
    setTimeout(()=>$("#inPin").focus(), 200);
  }catch(e){
    show("Googleの確認ができませんでした。", "err");
  }
}

window.addEventListener("load", ()=>{
  if(window.google && google.accounts){
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onGoogle });
  }
});

/* ---------- ログイン ---------- */
async function doLogin(){
  const pin = $("#inPin").value.trim();
  if(!/^\d{4}$/.test(pin)){
    show("パスコードは4桁の数字で入れてください。", "err");
    $("#inPin").focus();
    return;
  }

  let id = knownId;
  if(!id){
    if(tab === "id"){
      id = $("#inId").value.trim();
      if(!id){ show("会員番号を入れてください。", "err"); $("#inId").focus(); return; }
    }else{
      if(!googleEmail){ show("先にGoogleでログインしてください。", "err"); return; }
    }
  }

  const btn = $("#loginBtn");
  btn.disabled = true; btn.textContent = "確認しています…";
  if(typeof skyLoading === "function") skyLoading("ログインしています…");

  try{
    /* Googleの方は、まずメールから会員番号を調べます */
    if(!id && googleEmail){
      const r0 = await fetch(`${GAS_URL}?action=byEmail&email=${encodeURIComponent(googleEmail)}`);
      const j0 = await r0.json();
      if(!j0.ok || !j0.found){
        if(typeof skyLoadingDone === "function") skyLoadingDone();
        show("このGoogleアカウントでのご登録が見つかりません。<br>" +
             "「会員番号」のタブからお試しいただくか、はじめての方はご登録ください。", "err");
        return;
      }
      id = j0.id;
    }

    const url = `${GAS_URL}?action=login&id=${encodeURIComponent(id)}&pin=${encodeURIComponent(pin)}` +
                (googleEmail ? `&email=${encodeURIComponent(googleEmail)}` : "");
    const res = await fetch(url);
    const j = await res.json();
    if(typeof skyLoadingDone === "function") skyLoadingDone();

    if(j.ok === false){
      if(j.error === "locked"){
        show(`パスコードのお間違いが続いたため、<b>${j.wait || 60}秒ほど</b>おやすみいただきます。<br>` +
             `少し時間をおいて、もう一度お試しください。`, "warn");
      }else if(j.error === "pin"){
        show("パスコードが違います。" +
             (j.rest > 0 ? `<br>あと${j.rest}回まちがえると、少しおやすみになります。` : ""), "err");
      }else{
        show({
          nomember:"その会員番号のご登録が見つかりません。",
          email:"ご登録のGoogleアカウントと異なります。",
          busy:"いま混み合っています。少しおいてお試しください。"
        }[j.error] || "ログインできませんでした。", "err");
      }
      return;
    }

    /* 保存して、進んでいるところへご案内します */
    const m = {
      id: id, pin: pin, email: j.email || googleEmail || "",
      name: j.name || "", realName: j.realName || "", area: j.area || "",
      keiretsu: j.keiretsu || "", role: j.role || "",
      sup: j.sup === true, crie: j.crie === true,
      nick: j.nick || "", keiChat: j.keiChat || "", refUrl: j.refUrl || "",
      badges: j.badges || [], celebrate: j.celebrate || ""
    };
    localStorage.setItem("skyarc_member", JSON.stringify(m));

    show("✅ ログインしました。ご案内しています…", "ok");
    /* 行き先を調べる間も、そのままお待ちいただきます */
    if(typeof skyLoading === "function") skyLoading("ご案内しています", "進んでいるところをお調べしています");
    goNext(id, pin, m);

  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    show("通信できませんでした。電波のよい場所でお試しください。", "err");
  }finally{
    btn.disabled = false; btn.textContent = "ログイン";
  }
}

/* ---------- 進んでいるところへ ---------- */
/* GASから返る場所を、このページから見た道すじに直します */
const ROUTE = {
  "hajime": "./first-support/",
  "guide":  "./first-support/guide.html",
  "step1":  "./first-support/step1.html",
  "crie":   "./ikusei/portal-creators.html",
  "sup":    "./ikusei/portal-supporter.html",
  "member": "./ikusei/member.html"
};

async function goNext(id, pin, m){
  let where = null;
  try{
    const r = await fetch(`${GAS_URL}?action=whereTo&id=${encodeURIComponent(id)}&pin=${encodeURIComponent(pin)}`);
    const j = await r.json();
    if(j.ok && j.key) where = j;
  }catch(e){}

  const url = (where && ROUTE[where.key])
    ? ROUTE[where.key]
    : (m.crie ? ROUTE.crie : (m.sup ? ROUTE.sup : ROUTE.hajime));
  const label = (where && where.label) ? where.label : "つぎのページ";

  /* 行き先が決まったら、そのままページを開きます
     （画面が切り替わるまで、ぐるぐるを出したままにします） */
  show(`✅ ログインしました<br><b>${label}</b> へご案内します…`, "ok");
  if(typeof skyGoTo === "function") skyGoTo(url, label + " をひらいています");
  else location.href = url;
}

/* ---------- パスコードのお忘れ ---------- */
function openReset(){
  show("パスコードは、ご登録ページから決めなおしていただけます。<br>" +
       "<a href='./touroku.html' style='color:#6E5FB5;font-weight:700;'>ご登録ページをひらく ›</a><br>" +
       "同じ会員番号で入力すると、内容が上書きされます。", "warn");
}

/* Enterで進みます */
["inId","inPin"].forEach(k=>{
  const el = document.getElementById(k);
  if(el) el.addEventListener("keydown", e=>{ if(e.key === "Enter") doLogin(); });
});
</script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./track.js"></script>
</body>
</html>
