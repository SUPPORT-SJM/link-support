<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>管理画面</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#3B3550; --leaf:#4FB08C; --mist:#EDEAF9;
    --paper:#F7F6FA; --ink:#22222A;
    --amber:#F5C452; --red:#E8788A; --blue:#5E8FD8;
    --white:#fff; --line:#E2E0EA;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;font-size:14.5px;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px;}

  /* login */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--deep);padding:20px;}
  .lcard{background:var(--white);border-radius:20px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  .lcard h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:var(--deep);font-size:19px;text-align:center;margin-bottom:4px;}
  .lcard .sub{font-size:12px;color:#77748A;text-align:center;margin-bottom:22px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--deep);margin-bottom:5px;}
  .field input{width:100%;padding:12px 13px;font-size:16px;border:2px solid var(--line);border-radius:10px;font-family:inherit;background:var(--paper);}
  .field input:focus{outline:none;border-color:var(--leaf);}
  .btn-main{width:100%;padding:14px;border-radius:12px;background:var(--deep);color:#fff;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;}
  .err{display:none;background:#FDEBEB;color:#B33;border-radius:9px;padding:10px 13px;font-size:12.5px;margin-bottom:12px;}

  /* app */
  #appView{display:none;}
  .head{background:var(--deep);color:#fff;padding:16px 0;position:sticky;top:0;z-index:20;}
  .head .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .head h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:17px;}
  .head .me{font-size:11.5px;opacity:.85;}
  .head .tools{display:flex;gap:8px;align-items:center;}
  .head button{background:rgba(255,255,255,.16);color:#fff;font-size:12px;border-radius:999px;padding:7px 14px;font-weight:700;}
  .head input.search{padding:8px 12px;border-radius:999px;border:none;font-size:13px;font-family:inherit;width:170px;}

  .bar{background:#fff;border-bottom:1px solid var(--line);padding:10px 0;font-size:12px;color:#66647A;}
  .bar b{color:var(--deep);}
  .chip{display:inline-block;background:var(--mist);color:var(--deep);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;margin-left:6px;}

  main{padding:16px 0 60px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.06);}
  th{background:#EFEDF5;font-size:11.5px;font-weight:700;color:#55536B;padding:9px 8px;text-align:left;white-space:nowrap;}
  td{padding:9px 8px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle;}
  tr:hover td{background:#FAFAFE;}
  .nm{font-weight:700;}
  .id{font-size:11px;color:#8B889E;font-family:monospace;}
  .kei{font-size:11.5px;color:#66647A;}
  .prog{font-size:11.5px;white-space:nowrap;}
  .prog .done{color:var(--leaf);font-weight:700;}
  .prog .wip{color:#8B889E;}
  .flags{display:flex;gap:5px;flex-wrap:wrap;}
  .fbtn{
    border:1.5px solid var(--line);background:#fff;color:#8B889E;
    border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:700;
    white-space:nowrap;transition:all .15s;
  }
  .fbtn.on{background:var(--leaf);border-color:var(--leaf);color:#fff;}
  .fbtn.adv.on{background:var(--blue);border-color:var(--blue);}
  .fbtn.rep.on{background:var(--amber);border-color:var(--amber);color:#5C4200;}
  .fbtn.adm.on{background:var(--red);border-color:var(--red);color:#fff;}
  .fbtn:disabled{opacity:.35;cursor:not-allowed;}
  .scope-btn{background:none;color:var(--blue);font-size:11px;text-decoration:underline;padding:2px;}
  .empty{text-align:center;padding:40px;color:#8B889E;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;font-size:13px;border-radius:999px;padding:10px 20px;opacity:0;transition:all .3s;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .legend{font-size:11px;color:#8B889E;margin-top:12px;line-height:1.9;}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="loginView">
  <div class="lcard">
    <h1>🔐 育成システム 管理画面</h1>
    <p class="sub">管理者・チーム代表・アドバンス専用</p>
    <div class="err" id="err"></div>
    <div class="field">
      <label>会員番号</label>
      <input type="text" id="inId" inputmode="numeric" placeholder="00012345">
    </div>
    <div class="field">
      <label>パスワード(4桁)</label>
      <input type="password" id="inPin" inputmode="numeric" maxlength="4">
    </div>
    <div class="field">
      <label>管理パスワード</label>
      <input type="password" id="inPass" placeholder="管理者から共有されたもの">
    </div>
    <button class="btn-main" id="loginBtn" onclick="login()">ログイン</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="appView">
  <div class="head">
    <div class="wrap row">
      <div>
        <h1>🔐 育成システム 管理画面</h1>
        <div class="me" id="meLine"></div>
      </div>
      <div class="tools">
        <input class="search" id="search" placeholder="名前・番号で検索" oninput="render()">
        <button onclick="load()">🔄 更新</button>
        <button onclick="logout()">ログアウト</button>
      </div>
    </div>
  </div>

  <div class="bar"><div class="wrap" id="scopeLine"></div></div>

  <main>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>会員</th>
            <th>系列</th>
            <th>① ぴよぴよ</th>
            <th>② グルコン</th>
            <th>権限</th>
            <th>最終</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="legend">
        ⭕ = 先生の丸の数 / 🐣 = 本人チェックの数<br>
        「クリエ」を付けると②③が解放されます。アドバンスは担当系列の方のクリエ付与のみ可能です。
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzY2l20zwGULjnKRUqvRpbH79fPkl5e-sWNVoXEIgBrDpqhjDAx2zLvJuqO3sZxAfHj/exec";
const $ = (s)=>document.querySelector(s);
let admin = null;       // {id,pin,pass}
let data = null;        // サーバーからの一覧

async function login(){
  const id = $("#inId").value.trim();
  const pin = $("#inPin").value.trim();
  const pass = $("#inPass").value;
  const err = $("#err");
  err.style.display = "none";
  if(!id || !pin || !pass){
    err.textContent = "すべて入力してください"; err.style.display="block"; return;
  }
  $("#loginBtn").disabled = true;
  $("#loginBtn").textContent = "確認中…";
  admin = {id, pin, pass};
  const ok = await load(true);
  if(ok){
    sessionStorage.setItem("skyadmin", JSON.stringify(admin));
    $("#loginView").style.display = "none";
    $("#appView").style.display = "block";
  }else{
    admin = null;
  }
  $("#loginBtn").disabled = false;
  $("#loginBtn").textContent = "ログイン";
}

function logout(){
  sessionStorage.removeItem("skyadmin");
  location.reload();
}

async function load(isLogin){
  try{
    const url = `${GAS_URL}?action=adminList&id=${encodeURIComponent(admin.id)}&pin=${encodeURIComponent(admin.pin)}&pass=${encodeURIComponent(admin.pass)}`;
    const res = await fetch(url);
    const j = await res.json();
    if(j.ok === false){
      const msg = {
        adminpass:"管理パスワードが違います",
        pin:"パスワードが違います",
        noperm:"この会員番号には管理権限がありません",
        nomember:"会員番号が見つかりません"
      }[j.error] || "読み込めませんでした";
      if(isLogin){ $("#err").textContent = msg; $("#err").style.display="block"; }
      else toast(msg);
      return false;
    }
    data = j;
    $("#meLine").textContent = (j.adminName||"") + "さん｜" + (j.isFull ? "全体管理" : "担当系列のみ");
    $("#scopeLine").innerHTML = j.isFull
      ? `全 <b>${j.members.length}</b> 名を表示中`
      : `担当系列:<b>${(j.scope||[]).join(" / ") || "未設定"}</b> <span class="chip">${j.members.length}名</span>`;
    render();
    return true;
  }catch(e){
    const msg = "通信できませんでした";
    if(isLogin){ $("#err").textContent = msg; $("#err").style.display="block"; }
    else toast(msg);
    return false;
  }
}

function has(role, flag){ return String(role||"").indexOf(flag) >= 0; }

function render(){
  if(!data) return;
  const q = $("#search").value.trim().toLowerCase();
  const list = data.members.filter(m=>{
    if(!q) return true;
    return (m.name||"").toLowerCase().includes(q) || String(m.id).includes(q);
  });
  const tb = $("#tbody");
  if(list.length === 0){
    tb.innerHTML = '<tr><td colspan="6" class="empty">該当する方がいません</td></tr>';
    return;
  }
  tb.innerHTML = list.map(m=>{
    const piyo = m.piyoDone
      ? '<span class="done">🎓 卒業</span>'
      : `<span class="wip">⭕${m.piyoMark}/${m.piyoItems||"–"}　🐣${m.piyoSelf}</span>`;
    const gr = m.grDone
      ? '<span class="done">🎓 修了</span>'
      : (m.grSelf || m.grMark ? `<span class="wip">✓${m.grSelf}/${m.grItems||"–"}</span>` : '<span class="wip">–</span>');

    const canFull = data.isFull;
    const fb = (flag, cls) => {
      const on = has(m.role, flag);
      const disabled = (!canFull && flag !== "クリエ") ? "disabled" : "";
      return `<button class="fbtn ${cls} ${on?'on':''}" ${disabled}
        onclick="setFlag('${m.id}','${flag}',${on?0:1})">${flag}</button>`;
    };
    const scopeBtn = canFull && has(m.role,"アドバンス")
      ? `<br><button class="scope-btn" onclick="editScope('${m.id}','${(m.scope||"").replace(/'/g,"")}')">担当系列: ${m.scope || "未設定"}</button>`
      : "";

    return `<tr>
      <td><span class="nm">${m.name || "(名前未登録)"}</span><br><span class="id">${m.id}</span></td>
      <td class="kei">${m.keiretsu || "–"}</td>
      <td class="prog">${piyo}</td>
      <td class="prog">${gr}</td>
      <td><div class="flags">${fb("クリエ","")}${fb("アドバンス","adv")}${fb("チーム代表","rep")}${fb("管理者","adm")}</div>${scopeBtn}</td>
      <td class="kei">${m.lastSeen || "–"}</td>
    </tr>`;
  }).join("");
}

async function setFlag(target, flag, on){
  if(flag === "管理者" && on && !confirm("この方に「管理者」権限を与えます。よろしいですか?")) return;
  try{
    const body = new URLSearchParams({
      action:"adminSetRole", id:admin.id, pin:admin.pin, pass:admin.pass,
      target:String(target), flag:flag, on:String(on)
    });
    const res = await fetch(GAS_URL, {method:"POST", body});
    const j = await res.json();
    if(j.ok === false){
      toast({outofscope:"担当系列外の方は操作できません", noperm:"権限がありません"}[j.error] || "変更できませんでした");
      return;
    }
    toast(flag + (on ? " を付与しました" : " を外しました"));
    load();
  }catch(e){ toast("通信できませんでした"); }
}

async function editScope(target, current){
  const v = prompt("担当系列をカンマ区切りで入力してください\n(自分の系列は自動で含まれます)\n\n例)🪽HERO,📚FairyTail", current);
  if(v === null) return;
  try{
    const body = new URLSearchParams({
      action:"adminSetScope", id:admin.id, pin:admin.pin, pass:admin.pass,
      target:String(target), scope:v
    });
    const res = await fetch(GAS_URL, {method:"POST", body});
    const j = await res.json();
    if(j.ok === false){ toast("変更できませんでした"); return; }
    toast("担当系列を更新しました");
    load();
  }catch(e){ toast("通信できませんでした"); }
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2000);
}

["inId","inPin","inPass"].forEach(k=>{
  document.getElementById(k).addEventListener("keydown", e=>{ if(e.key==="Enter") login(); });
});

/* セッション中は再ログイン不要(タブを閉じると消えます) */
(function(){
  const s = sessionStorage.getItem("skyadmin");
  if(!s) return;
  try{ admin = JSON.parse(s); }catch(e){ return; }
  load(true).then(ok=>{
    if(ok){
      $("#loginView").style.display = "none";
      $("#appView").style.display = "block";
    }else{ admin = null; sessionStorage.removeItem("skyadmin"); }
  });
})();
</script>
</body>
</html>
