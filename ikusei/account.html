<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>アカウント設定｜スカイアーク</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../beta.css">
<link rel="icon" type="image/png" sizes="64x64" href="../img/gcon-icon-64.png">
<meta name="theme-color" content="#6E5FB5">
<style>
  :root{
    --ink:#2A2438; --deep:#6E5FB5; --leaf:#3FA98A; --sun:#F2B33D;
    --mist:#F0EDF9; --paper:#FCFBFF; --line:#E4E0F0;
    --shadow:0 4px 20px rgba(60,42,110,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--paper);
       line-height:1.75;font-size:15px;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}

  #skyNav{position:sticky;top:0;z-index:30;background:rgba(110,95,181,.96);
    backdrop-filter:blur(6px);color:#fff;}
  #skyNav .inner{max-width:520px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;}
  #skyNav .who{opacity:.92;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #skyNav a{background:rgba(255,255,255,.18);color:#fff;font-size:11.5px;font-weight:700;
    border-radius:999px;padding:6px 13px;text-decoration:none;flex-shrink:0;}

  .hero{background:linear-gradient(150deg,#9A86E0,#6E5FB5 55%,#5E8FD8);color:#fff;
    padding:28px 0 24px;text-align:center;}
  .hero .em{font-size:34px;line-height:1;}
  .hero h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;margin:7px 0 5px;}
  .hero p{font-size:12.5px;opacity:.92;}

  main{padding:20px 0 60px;}
  .sec{font-size:11.5px;font-weight:700;color:#9A93B0;letter-spacing:.05em;margin:20px 0 8px;}
  .sec:first-child{margin-top:0;}

  .card{background:#fff;border-radius:16px;padding:6px 4px;box-shadow:var(--shadow);margin-bottom:12px;}
  .row{display:flex;align-items:center;gap:12px;padding:14px 14px;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row .lb{font-size:12.5px;color:#7A7390;flex-shrink:0;min-width:96px;}
  .row .vl{flex:1;font-size:14px;font-weight:500;word-break:break-all;text-align:right;}
  .row .vl.mono{font-family:monospace;font-size:13.5px;}
  .row .vl.empty{color:#B0AAC4;font-weight:400;font-size:13px;}

  .edit-card{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px;}
  .f{margin-bottom:13px;}
  .f:last-of-type{margin-bottom:15px;}
  .f label{display:block;font-size:12px;font-weight:700;color:var(--deep);margin-bottom:6px;}
  .f input,.f select{width:100%;padding:13px 14px;font-size:16px;border:2px solid var(--line);
    border-radius:12px;background:var(--paper);font-family:inherit;color:var(--ink);}
  .f input:focus,.f select:focus{outline:none;border-color:var(--leaf);background:#fff;}
  .f .hint{font-size:11px;color:#9A93B0;margin-top:5px;line-height:1.7;}

  .btn{width:100%;padding:14px;border-radius:13px;font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;font-size:14.5px;}
  .btn-go{background:var(--deep);color:#fff;box-shadow:0 4px 14px rgba(110,95,181,.26);}
  .btn-sub{background:var(--mist);color:var(--deep);}
  .btn-out{background:#FDEBEB;color:#B3352F;}
  .btn:active{transform:scale(.985);}
  .btn:disabled{opacity:.45;box-shadow:none;}
  .btn+.btn{margin-top:9px;}

  .msg{display:none;border-radius:11px;padding:11px 13px;font-size:12.5px;
    line-height:1.8;margin-bottom:13px;}
  .msg.err{display:block;background:#FDEBEB;color:#B3352F;}
  .msg.ok{display:block;background:#EAF7F0;color:#2F7A5C;}
  .msg.warn{display:block;background:#FFF6E0;color:#8A6D00;}

  .copy-row{display:flex;gap:8px;align-items:center;background:var(--mist);
    border-radius:11px;padding:11px 13px;margin-top:9px;}
  .copy-row .u{flex:1;font-size:11.5px;color:#5E5776;word-break:break-all;line-height:1.6;}
  .copy-row button{background:var(--deep);color:#fff;border-radius:99px;padding:7px 14px;
    font-size:11.5px;font-weight:700;flex-shrink:0;}

  .note{background:var(--mist);border-radius:13px;padding:13px 15px;font-size:11.5px;
    color:#5E5776;line-height:1.9;margin-bottom:12px;}
  .note b{color:var(--deep);}
  .verTag{display:block;text-align:center;font-size:9.5px;color:#B4B0C4;
    font-family:monospace;padding:18px 0 26px;}
</style>
<script src="../login.js"></script>
<script src="../loading.js"></script>
</head>
<body>

<div id="skyNav"><div class="inner">
  <span class="who" id="navWho"></span>
  <a href="#" onclick="goBack();return false;">‹ もどる</a>
</div></div>

<header class="hero">
  <div class="wrap">
    <div class="em">⚙️</div>
    <h1>アカウント設定</h1>
    <p>ご登録の内容を確認・変更できます</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="msg" id="msg"></div>

    <!-- ご登録の内容 -->
    <div class="sec">ご登録の内容</div>
    <div class="card">
      <div class="row"><span class="lb">会員番号</span><span class="vl mono" id="vId">–</span></div>
      <div class="row"><span class="lb">ニックネーム</span><span class="vl" id="vName">–</span></div>
      <div class="row"><span class="lb">本名</span><span class="vl" id="vReal">–</span></div>
      <div class="row"><span class="lb">系列</span><span class="vl" id="vKei">–</span></div>
      <div class="row"><span class="lb">お住まい</span><span class="vl" id="vArea">–</span></div>
      <div class="row"><span class="lb">連絡先</span><span class="vl" id="vMail">–</span></div>
      <div class="row"><span class="lb">段階</span><span class="vl" id="vRank">–</span></div>
    </div>

    <!-- 紹介URL -->
    <div class="sec">紹介URL</div>
    <div class="edit-card">
      <div class="f" style="margin-bottom:0;">
        <label>あなたの紹介URL</label>
        <input type="url" id="inUrl" inputmode="url" autocapitalize="off"
               spellcheck="false" placeholder="https://…">
        <p class="hint">お仲間をお誘いするときのリンクです</p>
      </div>
      <div class="copy-row" id="urlBox" style="display:none;">
        <span class="u" id="urlShow"></span>
        <button onclick="copyUrl()">コピー</button>
      </div>
      <button class="btn btn-go" style="margin-top:13px;" onclick="saveUrl()">保存する</button>
    </div>

    <!-- パスコード -->
    <div class="sec">パスコードの変更</div>
    <div class="edit-card">
      <div class="f">
        <label>いまのパスコード</label>
        <input type="password" id="pinNow" inputmode="numeric" maxlength="4" placeholder="••••">
      </div>
      <div class="f">
        <label>新しいパスコード</label>
        <input type="password" id="pin1" inputmode="numeric" maxlength="4" placeholder="4桁の数字">
      </div>
      <div class="f">
        <label>もう一度</label>
        <input type="password" id="pin2" inputmode="numeric" maxlength="4" placeholder="4桁の数字">
      </div>
      <button class="btn btn-go" onclick="changePin()">パスコードを変える</button>
    </div>

    <!-- そのほか -->
    <div class="sec">そのほか</div>
    <div class="note">
      <b>お名前や系列を変えたいとき</b><br>
      ご登録ページから、同じ会員番号で入力しなおしてください。<br>
      内容が上書きされます。
    </div>
    <a href="../touroku.html" class="btn btn-sub" style="display:block;text-align:center;text-decoration:none;">
      📝 ご登録ページをひらく
    </a>
    <button class="btn btn-out" style="margin-top:9px;" onclick="doLogout()">ログアウト</button>

    <div class="verTag">v1.88 (2026/08/18)</div>
  </div>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzY2l20zwGULjnKRUqvRpbH79fPkl5e-sWNVoXEIgBrDpqhjDAx2zLvJuqO3sZxAfHj/exec";

let member = null;

function $(q){ return document.querySelector(q); }
function show(t, cls){ const m = $("#msg"); m.innerHTML = t; m.className = "msg " + cls; }

/* ---------- 読み込み ---------- */
(function(){
  try{
    const raw = localStorage.getItem("skyarc_member");
    if(raw && raw !== "null") member = JSON.parse(raw);
  }catch(e){}
  if(member && !member.id) member = null;

  if(!member){
    document.querySelector("main .wrap").innerHTML =
      '<div class="note" style="text-align:center;padding:34px 20px;">' +
      'ご覧いただくには、ログインが必要です。<br><br>' +
      '<button class="btn btn-go" onclick="skyLoginRequired(function(){ location.reload(); })">🌱 ログインする</button>' +
      '</div>';
    return;
  }

  $("#navWho").textContent = (member.name ? member.name+"さん" : "会員番号 "+member.id);
  fill();
})();

function fill(){
  const set = (id, v) => {
    const el = $(id);
    if(v){ el.textContent = v; el.classList.remove("empty"); }
    else { el.textContent = "未登録"; el.classList.add("empty"); }
  };
  set("#vId", member.id);
  set("#vName", member.name);
  set("#vReal", member.realName);
  set("#vKei", member.keiretsu);
  set("#vArea", member.area);
  set("#vMail", member.email);

  const rank = member.role ? member.role.split(/[,、\s]+/).filter(x=>x).join(" / ")
             : (member.crie ? "クリエイターズ" : (member.sup ? "サポーター" : "メンバー"));
  set("#vRank", rank);

  if(member.refUrl){
    $("#inUrl").value = member.refUrl;
    $("#urlShow").textContent = member.refUrl;
    $("#urlBox").style.display = "flex";
  }
}

/* ---------- 紹介URL ---------- */
async function saveUrl(){
  const url = $("#inUrl").value.trim();
  if(!url){ show("紹介URLを入れてください。", "err"); return; }
  if(!/^https?:\/\//i.test(url)){
    show("URLは https:// から始まる形で入れてください。", "err"); return;
  }
  if(typeof skyLoading === "function") skyLoading("保存しています…");
  try{
    const res = await fetch(GAS_URL, {method:"POST", body:new URLSearchParams({
      action:"saveProfile", id:member.id, pin:member.pin, refUrl:url
    })});
    const j = await res.json();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return;
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(j.ok === false){ show("保存できませんでした。", "err"); return; }
    member.refUrl = url;
    localStorage.setItem("skyarc_member", JSON.stringify(member));
    $("#urlShow").textContent = url;
    $("#urlBox").style.display = "flex";
    show("✅ 保存しました。", "ok");
  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    show("通信できませんでした。", "err");
  }
}

async function copyUrl(){
  try{
    await navigator.clipboard.writeText(member.refUrl || "");
    show("✅ コピーしました。", "ok");
  }catch(e){ show("上のURLを長押しして選んでください。", "warn"); }
}

/* ---------- パスコード ---------- */
async function changePin(){
  const now = $("#pinNow").value.trim();
  const p1 = $("#pin1").value.trim();
  const p2 = $("#pin2").value.trim();

  if(now !== String(member.pin)){ show("いまのパスコードが違います。", "err"); return; }
  if(!/^\d{4}$/.test(p1)){ show("新しいパスコードは4桁の数字で入れてください。", "err"); return; }
  if(p1 !== p2){ show("2つのパスコードが揃っていません。", "err"); return; }
  if(p1 === now){ show("いまと同じパスコードです。", "warn"); return; }

  if(typeof skyLoading === "function") skyLoading("変えています…");
  try{
    const res = await fetch(GAS_URL, {method:"POST", body:new URLSearchParams({
      action:"resetPin", id:member.id, oldPin:now, newPin:p1
    })});
    const j = await res.json();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return;
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(j.ok === false){
      show({pin:"いまのパスコードが違います", nomember:"会員番号が見つかりません"}[j.error]
           || "変えられませんでした。", "err");
      return;
    }
    member.pin = p1;
    localStorage.setItem("skyarc_member", JSON.stringify(member));
    $("#pinNow").value = ""; $("#pin1").value = ""; $("#pin2").value = "";
    show("✅ パスコードを変えました。<br>次からは新しいパスコードでログインしてください。", "ok");
  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    show("通信できませんでした。", "err");
  }
}

/* ---------- ログアウト ---------- */
function doLogout(){
  if(!confirm("ログアウトしますか?\n(この端末に残った学習の記録も消えます)")) return;
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && (k.indexOf("skyarc_")===0 || k.indexOf("piyo_")===0 ||
               k.indexOf("gcon_")===0 || k.indexOf("hajime_")===0 ||
               k.indexOf("link_done_")===0 || k.indexOf("step1_")===0)) keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  location.href = "../index.html";
}

function goBack(){
  if(!member){ location.href = "../index.html"; return; }
  location.href = member.crie ? "./portal-creators.html"
                : (member.sup ? "./portal-supporter.html" : "../first-support/");
}
</script>
<script src="../track.js"></script>
</body>
</html>
