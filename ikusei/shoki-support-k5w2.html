<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../config.js"></script>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>初期サポートマネジメント</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#3B3550; --leaf:#4FB08C; --mist:#EDEAF9;
    --paper:#F7F6FA; --ink:#22222A; --line:#E2E0EA;
    --g:#3DAA6E; --y:#E5A823; --r:#E0566A;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;font-size:14.5px;}
  button,select,input{font-family:inherit;}
  button{cursor:pointer;border:none;}

  .head{background:var(--deep);color:#fff;padding:18px 16px 14px;}
  .head .in{max-width:1080px;margin:0 auto;padding-right:64px;}
  .head h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:19px;}
  .head .who{font-size:12px;opacity:.8;margin-top:2px;}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;}
  .tools #q,.tools select{padding:8px 12px;border-radius:999px;border:none;font-size:13px;background:#fff;color:#3B3550;}
  .tools #q{flex:1 1 180px;min-width:150px;}
  .tools label input{width:15px;height:15px;margin:0;}
  .tools label{font-size:12.5px;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);padding:6px 11px;border-radius:999px;cursor:pointer;}
  .tools .back{background:rgba(255,255,255,.14);color:#fff;padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:700;}

  .bar{max-width:1080px;margin:0 auto;padding:12px 16px 4px;font-size:12.5px;color:#6A6480;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
  .bar b{color:var(--deep);}
  .legend span{margin-right:10px;white-space:nowrap;}

  .list{max-width:1080px;margin:0 auto;padding:6px 16px 30px;}
  .row{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(60,50,110,.06);padding:12px 14px;margin-bottom:10px;
       display:grid;grid-template-columns:minmax(150px,1.1fr) repeat(4,minmax(0,1fr));gap:8px;align-items:center;}
  .who .nm{font-weight:700;color:var(--deep);font-size:14.5px;}
  .who .sub{font-size:11px;color:#9A96AE;line-height:1.6;}
  .chip{display:flex;align-items:flex-start;gap:7px;text-align:left;background:#FAF9FD;border:1.5px solid var(--line);border-radius:11px;padding:8px 9px;min-height:54px;width:100%;}
  .chip:hover{border-color:#C9C2EC;}
  .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;margin-top:4px;}
  .dot.g{background:var(--g);} .dot.y{background:var(--y);} .dot.r{background:var(--r);}
  .chip .t{font-size:10.5px;color:#8A84A0;font-weight:700;line-height:1.4;}
  .chip .v{font-size:12.5px;color:var(--ink);line-height:1.45;}
  .empty{text-align:center;color:#8A84A0;padding:40px 0;}
  @media (max-width:760px){
    .row{grid-template-columns:1fr 1fr;}
    .who{grid-column:1 / -1;}
  }

  .gate{max-width:420px;margin:60px auto;background:#fff;border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 6px 24px rgba(60,50,110,.1);}
  .gate p{font-size:13.5px;color:#5A5470;line-height:1.9;margin-bottom:16px;}
  .gate a{display:inline-block;background:#6E5FB5;color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:12px;}

  /* 状態を変える画面 */
  #ed{display:none;position:fixed;inset:0;z-index:70;background:rgba(30,26,50,.55);align-items:center;justify-content:center;padding:14px;}
  #ed.show{display:flex;}
  #ed .sheet{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;padding:20px 18px;}
  #ed h3{font-size:16px;font-weight:900;color:#4A3F7A;}
  #ed .who2{font-size:12.5px;color:#7A7390;margin-bottom:10px;}
  .sem{border-top:1px solid #F0EDF9;padding:10px 0;}
  .sem:first-of-type{border-top:none;}
  .sem .lb{font-size:13px;font-weight:700;color:var(--deep);margin-bottom:6px;}
  .states{display:flex;flex-wrap:wrap;gap:6px;}
  .states button{padding:7px 11px;border-radius:999px;border:1.5px solid #E1DCF2;background:#fff;color:#5A5470;font-size:12.5px;font-weight:700;}
  .states button.on{background:#6E5FB5;border-color:#6E5FB5;color:#fff;}
  .dt{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#6A6480;}
  .dt input{padding:7px 9px;border-radius:9px;border:1.5px solid #E1DCF2;font-size:14px;}
  .dt .x{background:none;color:#9A96AE;font-size:12px;text-decoration:underline;}
  .msg{display:none;border-radius:10px;padding:9px 12px;font-size:12.5px;margin:10px 0 0;line-height:1.7;}
  .msg.err{display:block;background:#FDEBEB;color:#B3352F;}
  .msg.ok{display:block;background:#EAF7F0;color:#2F7A5C;}
  .btns{display:flex;gap:8px;margin-top:14px;}
  .btns button{flex:1;padding:12px;border-radius:11px;font-weight:700;font-size:14px;}
  .btns .save{background:#6E5FB5;color:#fff;}
  .btns .save:disabled{opacity:.5;}
  .btns .close{background:#F0EDF9;color:#6E5FB5;}
  .upd{font-size:11px;color:#A8A4BC;margin-top:8px;}
  .hidchk{display:inline-flex;align-items:center;gap:4px;margin-top:6px;white-space:nowrap;font-size:11.5px;color:#8A84A0;cursor:pointer;
    border:1.5px solid #E1DCF2;border-radius:999px;padding:3px 10px 3px 7px;background:#fff;}
  .hidchk input{width:14px;height:14px;margin:0;}
  .pend{outline:2.5px dashed #E5A823;outline-offset:1px;}
  .row.hidden-row > .chip{opacity:.4;}
  .row.hidden-row .nm{color:#9A96AE;}
  .tools .savetop{background:#F5C452;color:#3B2A00;}
  .tools .savetop[disabled]{opacity:.45;}
  #leave{display:none;position:fixed;inset:0;z-index:95;background:rgba(30,26,50,.55);align-items:center;justify-content:center;padding:18px;}
  #leave.show{display:flex;}
  #leave .card{background:#fff;border-radius:18px;max-width:360px;width:100%;padding:24px 20px;text-align:center;}
  #leave h3{font-size:16px;font-weight:900;color:#4A3F7A;margin-bottom:8px;}
  #leave p{font-size:13px;color:#5A5470;line-height:1.8;margin-bottom:16px;}
  #leave button{display:block;width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:14px;margin-top:8px;}
  #leave .b1{background:#6E5FB5;color:#fff;} #leave .b2{background:#F0EDF9;color:#6E5FB5;} #leave .b3{background:none;color:#8A84A0;font-size:13px;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#3B3550;color:#fff;font-size:13px;
         padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:all .25s;z-index:90;max-width:92vw;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .verTag{display:block;text-align:center;font-size:11px;color:#B5B1C6;padding:10px 0 24px;font-family:monospace;}
</style>
</head>
<body>
<script src="../loading.js"></script>
<script src="../login.js"></script>

<div id="gate" class="gate" style="display:none;">
  <p id="gateMsg">管理画面からお入りください。</p>
  <a href="kanri-x7k2m9.html">管理画面へ</a>
</div>

<div id="app" style="display:none;">
  <div class="head"><div class="in">
    <h1>🌱 初期サポートマネジメント</h1>
    <div class="who" id="who"></div>
    <div class="tools">
      <input id="q" placeholder="名前・番号で検索" oninput="draw()">
      <select id="fKei" onchange="draw()" data-kei-fixed="1"></select>
      <select id="fUp" onchange="draw()" data-kei-fixed="1"></select>
      <label><input type="checkbox" id="fIdle" onchange="draw()"> 30日以上ログインなし</label>
      <button class="back savetop" id="btnSaveTop" onclick="savePending()" disabled>💾 一覧の変更を保存</button>
      <button class="back" id="btnUndo" onclick="undoPending()" style="display:none;">元にもどす</button>
      <span id="orderNote" style="display:none;font-size:11px;opacity:.85;flex-basis:100%;">※ 保存すると、変えた内容に合わせてメンバーの表示順も変わります</span>
      <button class="back" id="btnShowHid" onclick="toggleShowHidden()">🙈 非表示：ON</button>
      <button class="back" onclick="saveReport()">📄 報告用に保存</button>
      <button class="back" onclick="leaveOk(()=>location.href='kanri-x7k2m9.html')">‹ 管理画面へ</button>
    </div>
  </div></div>
  <div class="bar">
    <span id="count"></span>
    <span class="legend"><span>🟢 OK</span><span>🟡 そろそろ・返事待ち</span><span>🔴 未案内・日付が過ぎた</span></span>
    <span class="legend"><span>（ク）アップクリエ</span><span>（担）サポート担当</span><span>（紹）紹介者</span><span>（説）アドバイザー</span></span>
  </div>
  <div class="list" id="list"></div>
</div>

<div id="ed" onclick="if(event.target===this)closeEd()">
  <div class="sheet">
    <h3 id="edTitle"></h3>
    <div class="who2" id="edWho"></div>
    <div id="edBody"></div>
    <div class="msg" id="edMsg"></div>
    <div class="btns">
      <button class="close" onclick="closeEd()">とじる</button>
      <button class="save" id="edSave" onclick="saveEd()">この内容にする</button>
    </div>
    <div class="upd" id="edUpd"></div>
  </div>
</div>

<div id="leave">
  <div class="card">
    <h3>このページの内容が変更されています</h3>
    <p>保存していない変更が <b id="leaveCount">0</b>件あります。<br>保存しますか？</p>
    <button class="b1" onclick="leaveChoose('save')">保存する</button>
    <button class="b2" onclick="leaveChoose('discard')">保存しないで進む</button>
    <button class="b3" onclick="leaveChoose('stay')">このページにもどる</button>
  </div>
</div>
<div id="toast"></div>

<span class="verTag"></span>

<script>
const GAS_URL = window.SKY_GAS_URL;   /* 共通設定（config.js）から受け取ります */
const $ = s=>document.querySelector(s);
const esc = t=>String(t == null ? "" : t).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================================================================
   項目と状態
================================================================ */
const GROUPS = [
  { key:"u",   title:"① ユーザーサポート会", items:["u"] },
  { key:"sem", title:"② LINKセミナー（5種類）", items:["s1","s2","s3","s4","s5"] },
  { key:"g",   title:"③ グルコン", items:["g"] },
  { key:"k",   title:"④ チーム交流会", items:["k"] }
];
const ITEM_LABEL = { u:"ユーザーサポート会", s1:"通常編", s2:"社長編", s3:"自己ブランディング特化版",
                     s4:"グループ構築特化版", s5:"新サービス特化版", g:"グルコン", k:"チーム交流会" };
const STATES = [
  { v:"",         t:"未案内" },
  { v:"案内した", t:"案内した（返事待ち）" },
  { v:"参加予定", t:"参加予定" },
  { v:"参加済み", t:"参加済み" },
  { v:"見送り",   t:"今回は見送り" }
];

let me = null, data = null;

/* ================================================================
   日付の計算（経過月数・直近3ヶ月）
================================================================ */
function today0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseD(t){
  const m = String(t || "").match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])) : null;
}
function md(t){ const d = parseD(t); return d ? (d.getMonth() + 1) + "/" + d.getDate() : ""; }
function monthsSince(d){
  const t = today0();
  let n = (t.getFullYear() - d.getFullYear()) * 12 + (t.getMonth() - d.getMonth());
  if(t.getDate() < d.getDate()) n--;
  return Math.max(0, n);
}
function within3(d){ return d && monthsSince(d) < 3; }

/* 1つの項目の信号（①③④） */
function sigOne(key, it){
  const s = it.s, d = parseD(it.d);
  if(!s) return { c:"r", v:"未案内" };
  if(s === "案内した") return { c:"y", v:"返事待ち" + (d ? "（" + md(it.d) + " 案内）" : "") };
  if(s === "見送り") return { c:"y", v:"今回は見送り" };
  if(s === "参加予定"){
    if(!d) return { c:"y", v:"参加予定（日付なし）" };
    if(d < today0()) return { c:"r", v:md(it.d) + " の予定が過ぎています" };
    return { c:"y", v:md(it.d) + " に参加予定" };
  }
  /* 参加済み */
  if(!d) return { c:"g", v:"参加済み" };
  const n = monthsSince(d);
  const ago = n === 0 ? "今月" : n + "ヶ月前";
  if(key === "k" && n >= 3) return { c:"y", v:"前回 " + md(it.d) + "（" + ago + "）" };
  return { c:"g", v:"参加済み " + md(it.d) + "（" + ago + "）" };
}
/* セミナー5種のまとめ */
function sigSem(items){
  const ks = ["s1","s2","s3","s4","s5"];
  let done = 0, latest = null, passed = false, moving = false;
  ks.forEach(k=>{
    const it = items[k] || {}; const d = parseD(it.d);
    if(it.s === "参加済み"){ done++; if(d && (!latest || d > latest)) latest = d; }
    else if(it.s === "参加予定"){ moving = true; if(d && d < today0()) passed = true; }
    else if(it.s === "案内した" || it.s === "見送り") moving = true;
  });
  const last = latest ? "／直近 " + (latest.getMonth() + 1) + "/" + latest.getDate() : "";
  if(passed) return { c:"r", v:done + "/5 種・予定日が過ぎています" };
  if(done === 0) return moving ? { c:"y", v:"0/5 種・案内中" } : { c:"r", v:"0/5 種・未案内" };
  /* 参加した日が入っていないときは、3ヶ月の判定はしません */
  const recent = latest ? within3(latest) : null;
  if(recent === false && !moving) return { c:"r", v:done + "/5 種・3ヶ月以上あいています" + last };
  if(done === 5 && recent !== false) return { c:"g", v:"5/5 種 参加済み" + last };
  return { c:"y", v:done + "/5 種" + (recent === false ? "・3ヶ月以上あいています" : "") + last };
}
function signals(m){
  return {
    u: sigOne("u", m.items.u || {}),
    sem: sigSem(m.items),
    g: sigOne("g", m.items.g || {}),
    k: sigOne("k", m.items.k || {})
  };
}
/* 参加予定のいちばん近い日（並べ替えに使います） */
function nextPlan(m){
  let best = null;
  Object.keys(m.items).forEach(k=>{
    const it = m.items[k]; if(it.s !== "参加予定") return;
    const d = parseD(it.d); if(d && d >= today0() && (!best || d < best)) best = d;
  });
  return best;
}

/* ================================================================
   読みこみ
================================================================ */
async function api(params){
  const body = Object.assign({ id:me.id, pin:me.pin, email:me.email || "" }, params);
  const res = await fetch(GAS_URL, { method:"POST", body:new URLSearchParams(body) });
  return res.json();
}
function gate(t){
  $("#gateMsg").innerHTML = t;
  $("#gate").style.display = "block"; $("#app").style.display = "none";
}
async function load(){
  if(typeof skyLoading === "function") skyLoading("サポートの記録を読みこんでいます", "しばらくお待ちください");
  try{
    const j = await api({ action:"supportList" });
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return;
    if(!j || j.ok !== true){
      if(j && j.error === "suplayout"){
        gate("スプレッドシートの「サポート状況」タブの見出しが、決まった形とちがっています。<br>記録がずれないよう、いまは読み書きを止めています。<br>管理者の方にお知らせください。");
      }else if(j && (j.error === "noperm" || j.error === "pin" || j.error === "nomember")){
        gate("この画面は、サポーター以上の方がお使いいただけます。<br>管理画面からログインしてお入りください。");
      }else{
        gate("読みこめませんでした。少しおいてお試しください。");
      }
      return;
    }
    data = j;
    hiddenOrig = {}; (j.hidden || []).forEach(k=>{ hiddenOrig[hkey(k)] = true; });
    pendingHide = {};
    /* 保存前の変更と見くらべるため、読みこんだときの状態を控えます */
    data.members.forEach(m=>{ m.orig = JSON.parse(JSON.stringify(m.items)); });
    $("#gate").style.display = "none"; $("#app").style.display = "block";
    $("#who").textContent = (j.adminName ? j.adminName + "さん" : "") + "｜" + ({ all:"全員", scope:"担当系列の方", kei:"ご自身の系列の方", helper:"ご自身が担当・紹介した方" })[j.viewMode];
    fillKei();
    fillUplines();
    draw();
  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    gate("通信できませんでした。電波のよい場所でお試しください。");
  }
}
/* 系列でしぼりこむ（見えている方の系列だけを、系列の一覧の順にならべます） */
function fillKei(){
  const sel = $("#fKei"), keep = sel.value;
  const has = {}; let none = false;
  data.members.forEach(m=>{ if(m.keiretsu) has[m.keiretsu] = true; else none = true; });
  const order = (window.SKY_KEIRETSU || []).slice();
  const list = order.filter(k=>has[k]).concat(Object.keys(has).filter(k=>order.indexOf(k) < 0));
  sel.innerHTML = '<option value="">系列：すべて</option>'
    + list.map(k=>`<option value="${esc(k)}">系列：${esc(k)}</option>`).join("")
    + (none ? '<option value="__none">系列：チーム未設定</option>' : "");
  sel.value = keep;
  if(sel.value !== keep) sel.value = "";
  /* 系列が1つだけのときは、選ぶ必要がないので出しません */
  sel.style.display = (list.length + (none ? 1 : 0)) > 1 ? "" : "none";
}
/* アップクリエでしぼりこむ（見えている方のアップクリエを、お名前の順にならべます） */
function upKey(m){ const u = String(m.upline || "").trim(); return /^\d+$/.test(u) ? u.replace(/^0+/, "") : u; }
function fillUplines(){
  const sel = $("#fUp"), keep = sel.value;
  const names = {}; let none = false;
  data.members.forEach(m=>{ const k = upKey(m); if(k) names[k] = who(m.uplineName, m.upline); else none = true; });
  const keys = Object.keys(names).sort((a,b)=>names[a].localeCompare(names[b], "ja"));
  const meKey = String(data.me || "").replace(/^0+/, "");
  sel.innerHTML = '<option value="">（ク）アップクリエ：すべて</option>'
    + (names[meKey] ? '<option value="__me">（ク）アップクリエ：自分</option>' : "")
    + keys.map(k=>`<option value="${esc(k)}">（ク）アップクリエ：${esc(names[k])}</option>`).join("")
    + (none ? '<option value="__none">（ク）アップクリエ：未設定</option>' : "");
  sel.value = keep;
  if(sel.value !== keep) sel.value = "";
}

/* ================================================================
   一覧
================================================================ */
function draw(){
  if(!data) return;
  const q = $("#q").value.trim().toLowerCase();
  const fu = $("#fUp").value;
  const fk = $("#fKei").value;
  const fIdle = $("#fIdle").checked;
  const t = today0();
  const sameId = (a,b)=>String(a || "").replace(/^0+/, "") === String(b || "").replace(/^0+/, "");
  let list = data.members.filter(m=>{
    if(!showHidden && hiddenOrig[hkey(m.id)] && !(hkey(m.id) in pendingHide)) return false;
    if(q && !((m.name || "").toLowerCase().includes(q) || String(m.id).includes(q) || pad8(m.id).includes(q))) return false;
    if(fk === "__none" && m.keiretsu) return false;
    if(fk && fk !== "__none" && m.keiretsu !== fk) return false;
    if(fu === "__me" && !sameId(m.upline, data.me)) return false;
    if(fu === "__none" && upKey(m)) return false;
    if(fu && fu !== "__me" && fu !== "__none" && upKey(m) !== fu) return false;
    if(fIdle){ const d = parseD(m.lastSeen); if(d && (t - d) < 30 * 86400000) return false; }
    return true;
  }).map(m=>{
    /* 色は今の（保存前の変更をふくむ）状態で出します */
    const sg = signals(m);
    /* 並び順は「保存ずみの状態」で決めます。保存前に状態を変えても、その方は同じ場所にいます */
    const saved = { items: m.orig || m.items };
    const cs = Object.values(signals(saved)).map(x=>x.c);
    const rr = cs.filter(c=>c === "r").length;
    const yy = cs.filter(c=>c === "y").length;
    return { m, sg, r: Object.values(sg).filter(x=>x.c === "r").length, sr: rr, sy: yy, np: nextPlan(saved) }; });
  /* 🔴が多い方 → 🟡が多い方 → 参加予定が近い方 の順 */
  list.sort((a,b)=> (b.sr - a.sr) || (b.sy - a.sy)
    || ((a.np ? a.np.getTime() : 9e15) - (b.np ? b.np.getTime() : 9e15))
    || (a.m.name || "").localeCompare(b.m.name || "", "ja"));
  lastList = list;
  drawHiddenBtn();
  const red = list.filter(x=>x.r > 0).length;
  $("#count").innerHTML = `<b>${list.length}</b> 名を表示中／🔴 がある方 <b>${red}</b> 名`;
  if(!list.length){ $("#list").innerHTML = '<div class="empty">該当する方がいません</div>'; return; }
  $("#list").innerHTML = list.map(x=>{
    const m = x.m;
    const hidOn = effHidden(m), hidPend = hidOn !== !!hiddenOrig[hkey(m.id)];
    const chip = g=>`<button class="chip ${g.items.some(k=>itemChanged(m, k)) ? "pend" : ""}" onclick="openEd('${esc(m.id)}','${g.key}')">
        <span class="dot ${x.sg[g.key].c}"></span>
        <span><span class="t">${esc(g.title)}</span><br><span class="v">${esc(x.sg[g.key].v)}</span></span></button>`;
    return `<div class="row ${hidOn ? "hidden-row" : ""}">
      <div class="who"><div class="nm">${esc(m.name || "(名前未登録)")}</div>
        <div class="sub">${esc(pad8(m.id))}${m.keiretsu ? "｜" + esc(m.keiretsu) : ""}
          <br><span title="アップクリエ">（ク）${esc(who(m.uplineName, m.upline))}</span>　<span title="サポート担当">（担）${esc(who(m.helperName, m.helper))}</span>
          <br><span title="紹介者">（紹）${esc(who(m.introName, m.intro))}</span>　<span title="アドバイザー（説明してくださった方）">（説）${esc(who(m.advName, m.advId))}</span></div>
        <label class="hidchk ${hidPend ? "pend" : ""}" title="あなたの画面だけで非表示にします"><input type="checkbox" ${hidOn ? "checked" : ""} onchange="toggleHide('${esc(m.id)}', this.checked)">非表示</label></div>
      ${GROUPS.map(chip).join("")}
    </div>`;
  }).join("");
}

/* ================================================================
   一覧の変更（状態・非表示）は、まずこの画面の中だけで変えます
   ・点線の枠＝まだ保存していない変更
   ・上の「💾 一覧の変更を保存」で、まとめて保存します
   ・保存しないままほかのページへ移ろうとしたときは、保存するかをおたずねします
   ・非表示は、あなたの画面だけに効きます（管理画面の一覧と同じ設定です）
================================================================ */
let hiddenOrig = {}, pendingHide = {}, showHidden = false, lastList = [];
function hkey(id){ return String(id || "").replace(/^0+/, ""); }
/* 会員番号は 8けた（頭に0をつけて）で出します。仮の番号（T00001 など）はそのまま */
function pad8(id){ const t = String(id || ""); return /^\d+$/.test(t) && t.length < 8 ? t.padStart(8, "0") : t; }
/* お名前があればお名前、なければ番号、どちらもなければ「未設定」 */
function who(name, id){ return name || (id ? (/^\d+$/.test(String(id)) ? pad8(id) : String(id)) : "未設定"); }
function effHidden(m){ const k = hkey(m.id); return (k in pendingHide) ? pendingHide[k] : !!hiddenOrig[k]; }
function itemChanged(m, k){
  const a = (m.items && m.items[k]) || {}, b = (m.orig && m.orig[k]) || {};
  return (a.s || "") !== (b.s || "") || (a.d || "") !== (b.d || "");
}
function supChanges(){
  const out = [];
  (data ? data.members : []).forEach(m=>Object.keys(m.items || {}).forEach(k=>{
    if(itemChanged(m, k)) out.push({ target: m.id, item: k, state: m.items[k].s || "", date: m.items[k].d || "" });
  }));
  return out;
}
function pendCount(){ return supChanges().length + Object.keys(pendingHide).length; }
function toast(t){
  const e = $("#toast"); e.textContent = t; e.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>e.classList.remove("show"), 2600);
}
function drawHiddenBtn(){
  const n = data ? data.members.filter(m=>hiddenOrig[hkey(m.id)]).length : 0;
  /* ON＝非表示にした方をかくしている／OFF＝非表示にした方も（うすく）出している */
  $("#btnShowHid").textContent = "🙈 非表示：" + (showHidden ? "OFF" : "ON") + (n ? "（" + n + "名）" : "");
  $("#btnShowHid").title = showHidden ? "押すと、非表示にした方をかくします" : "押すと、非表示にした方もうすく出します（チェックを外すと表示に戻せます）";
  const c = pendCount();
  $("#btnSaveTop").disabled = c === 0;
  $("#btnSaveTop").textContent = "💾 一覧の変更を保存" + (c ? "（" + c + "件）" : "");
  $("#btnUndo").style.display = c ? "" : "none";
  $("#orderNote").style.display = c ? "" : "none";
}
function toggleHide(id, on){
  const k = hkey(id);
  if(!!hiddenOrig[k] === !!on) delete pendingHide[k]; else pendingHide[k] = !!on;
  draw();
}
function toggleShowHidden(){ showHidden = !showHidden; draw(); }
function undoPending(){
  if(!pendCount()) return;
  if(!confirm("保存していない変更（" + pendCount() + "件）を元にもどします。よろしいですか？")) return;
  pendingHide = {};
  data.members.forEach(m=>{ m.items = JSON.parse(JSON.stringify(m.orig)); });
  draw();
}

async function savePending(){
  const changes = supChanges();
  const hideIds = Object.keys(pendingHide).filter(k=>pendingHide[k]);
  const showIds = Object.keys(pendingHide).filter(k=>!pendingHide[k]);
  if(!changes.length && !hideIds.length && !showIds.length) return true;
  if(typeof skyBusy === "function" && skyBusy("savelist")) return false;
  const btn = $("#btnSaveTop"); btn.disabled = true;
  if(typeof skyLoading === "function") skyLoading("一覧の変更を保存しています", "しばらくお待ちください");
  let allOk = true;
  try{
    if(changes.length){
      const j = await api({ action:"supportSetMany", changes: JSON.stringify(changes) });
      if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return false;
      if(!j || j.ok !== true){
        allOk = false;
        toast(({ busy:"いま混み合っています。少しおいてお試しください",
                 suplayout:"「サポート状況」タブの見出しが決まった形とちがうため、保存を止めました。管理者の方にお知らせください" })[j && j.error] || "保存できませんでした");
      }else{
        const bad = [];
        j.results.forEach(r=>{
          const m = data.members.find(x=>x.id === r.target);
          if(!m) return;
          if(r.ok){ m.orig[r.item] = { s: r.s, d: r.d }; m.items[r.item] = { s: r.s, d: r.d }; m.updated = j.updated; m.updatedBy = j.updatedBy; }
          else{
            m.items[r.item] = JSON.parse(JSON.stringify(m.orig[r.item] || { s:"", d:"" }));
            bad.push((m.name || r.target) + "さん：" + ({ outofscope:"担当の範囲外の方です", baddate:"日付の形がちがいます" }[r.error] || "保存できませんでした"));
          }
        });
        if(bad.length){ allOk = false; alert("保存できなかった変更があります（" + bad.length + "件）\n\n" + bad.join("\n")); }
      }
    }
    if(hideIds.length || showIds.length){
      const j = await api({ action:"supportHide", hideIds: JSON.stringify(hideIds), showIds: JSON.stringify(showIds) });
      if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return false;
      if(!j || j.ok !== true){ allOk = false; toast(({ busy:"いま混み合っています。少しおいてお試しください" })[j && j.error] || "非表示の保存ができませんでした"); }
      else{ hiddenOrig = {}; (j.hidden || []).forEach(k=>{ hiddenOrig[hkey(k)] = true; }); pendingHide = {}; }
    }
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    draw();
    if(allOk) toast("✅ 一覧の変更を保存しました");
    return allOk;
  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    toast("通信できませんでした");
    return false;
  }finally{
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(typeof skyBusyEnd === "function") skyBusyEnd("savelist");
    drawHiddenBtn();
  }
}

/* ほかのページへ移る前に、保存していない変更がないかを確かめます */
let leaveNext = null;
function leaveOk(next){
  if(!pendCount()){ next(); return true; }
  leaveNext = next;
  $("#leaveCount").textContent = pendCount();
  $("#leave").classList.add("show");
  return false;
}
async function leaveChoose(c){
  $("#leave").classList.remove("show");
  const next = leaveNext; leaveNext = null;
  if(c === "stay" || !next) return;
  if(c === "save"){ const ok = await savePending(); if(!ok) return; }
  if(c === "discard"){ pendingHide = {}; data.members.forEach(m=>{ m.items = JSON.parse(JSON.stringify(m.orig)); }); }
  next();
}
document.addEventListener("click", function(e){
  if(!data || !pendCount()) return;
  const a = e.target.closest && e.target.closest("a[href]");
  if(!a) return;
  const href = a.getAttribute("href") || "";
  if(!href || href.charAt(0) === "#" || /^javascript:/i.test(href) || a.target === "_blank") return;
  e.preventDefault(); e.stopPropagation();
  leaveOk(()=>{ location.href = a.href; });
}, true);
window.addEventListener("beforeunload", function(e){
  if(!data || !pendCount()) return;
  e.preventDefault(); e.returnValue = "";
});

/* ================================================================
   報告用に保存：いま表示している一覧を、スプレッドシートの「初期サポート報告」タブに足します
================================================================ */
async function saveReport(){
  if(!data) return;
  if(!lastList.length){ toast("表示している方がいません"); return; }
  if(pendCount()){ toast("先に「💾 一覧の変更を保存」を押してから、報告用に保存してください"); return; }
  const parts = [];
  ["#fKei", "#fUp"].forEach(sel=>{ const o = $(sel).selectedOptions[0]; if($(sel).value && o) parts.push(o.textContent); });
  if($("#fIdle").checked) parts.push("30日以上ログインなし");
  if($("#q").value.trim()) parts.push("検索：" + $("#q").value.trim());
  const cond = parts.join("／") || "すべて";
  if(!confirm("いま表示している " + lastList.length + "名の一覧を、スプレッドシートの「初期サポート報告」タブに保存します。\n（しぼりこみ：" + cond + "）\nよろしいですか？")) return;
  const mark = { g:"🟢", y:"🟡", r:"🔴" };
  const rows = lastList.map(x=>({
    id: x.m.id, name: x.m.name, keiretsu: x.m.keiretsu || "チーム未設定",
    helper: x.m.helperName || (x.m.helper ? "会員番号 " + x.m.helper : "未設定"),
    u: mark[x.sg.u.c] + " " + x.sg.u.v, sem: mark[x.sg.sem.c] + " " + x.sg.sem.v,
    g: mark[x.sg.g.c] + " " + x.sg.g.v, k: mark[x.sg.k.c] + " " + x.sg.k.v, red: String(x.r)
  }));
  if(typeof skyBusy === "function" && skyBusy("report")) return;
  if(typeof skyLoading === "function") skyLoading("報告用に保存しています", "しばらくお待ちください");
  try{
    const j = await api({ action:"supportReport", rows: JSON.stringify(rows), cond: cond });
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    if(typeof skyCheckMaintenance === "function" && skyCheckMaintenance(j)) return;
    if(!j || j.ok !== true){
      toast(({ busy:"いま混み合っています。少しおいてお試しください",
               suplayout:"「初期サポート報告」タブの見出しが決まった形とちがうため、保存を止めました" })[j && j.error] || "保存できませんでした");
      return;
    }
    toast("✅ " + j.count + "名分を「" + j.sheet + "」タブに保存しました（" + j.at + "）");
  }catch(e){
    if(typeof skyLoadingDone === "function") skyLoadingDone();
    toast("通信できませんでした");
  }finally{
    if(typeof skyBusyEnd === "function") skyBusyEnd("report");
  }
}

/* ================================================================
   状態を変える
================================================================ */
let edMember = null, edGroup = null, edDraft = {};
function openEd(id, gkey){
  edMember = data.members.find(m=>m.id === id);
  edGroup = GROUPS.find(g=>g.key === gkey);
  if(!edMember || !edGroup) return;
  edDraft = {};
  edGroup.items.forEach(k=>{ const it = edMember.items[k] || {}; edDraft[k] = { s: it.s || "", d: it.d || "" }; });
  $("#edTitle").textContent = edGroup.title;
  $("#edWho").textContent = (edMember.name || "") + "さん（" + edMember.id + "）";
  $("#edMsg").className = "msg";
  $("#edUpd").textContent = edMember.updated ? "最後の更新：" + edMember.updated + "　" + (edMember.updatedBy || "") : "";
  drawEd();
  $("#ed").classList.add("show");
}
function closeEd(){ $("#ed").classList.remove("show"); }
function toInputDate(t){ const d = parseD(t); if(!d) return ""; const p = n=>String(n).padStart(2,"0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
function todayText(){ const d = today0(); return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate(); }
function drawEd(){
  $("#edBody").innerHTML = edGroup.items.map(k=>{
    const dr = edDraft[k];
    const dateLabel = dr.s === "参加予定" ? "参加する日" : dr.s === "参加済み" ? "参加した日" : dr.s === "案内した" ? "案内した日" : "日付";
    return `<div class="sem">
      ${edGroup.items.length > 1 ? `<div class="lb">${esc(ITEM_LABEL[k])}</div>` : ""}
      <div class="states">${STATES.map(st=>`<button type="button" class="${dr.s === st.v ? "on" : ""}" onclick="pickState('${k}','${st.v}')">${esc(st.t)}</button>`).join("")}</div>
      ${dr.s ? `<div class="dt">${dateLabel}<input type="date" value="${toInputDate(dr.d)}" onchange="pickDate('${k}',this.value)">
        ${dr.d ? `<button type="button" class="x" onclick="pickDate('${k}','')">日付を消す</button>` : ""}</div>` : ""}
    </div>`;
  }).join("");
}
function pickState(k, v){
  const dr = edDraft[k];
  dr.s = v;
  if(!v) dr.d = "";
  /* 案内した・参加済みは、日付が空なら今日を入れておきます（あとで直せます） */
  else if(!dr.d && (v === "案内した" || v === "参加済み")) dr.d = todayText();
  else if(v === "参加予定" || v === "見送り"){ const d = parseD(dr.d); if(v === "見送り") dr.d = ""; else if(d && d < today0()) dr.d = ""; }
  drawEd();
}
function pickDate(k, v){ edDraft[k].d = v ? v.replace(/-/g, "/") : ""; drawEd(); }
function saveEd(){
  const changed = edGroup.items.filter(k=>{ const it = edMember.items[k] || {}; return (it.s || "") !== edDraft[k].s || (it.d || "") !== edDraft[k].d; });
  if(!changed.length){ closeEd(); return; }
  const noDate = changed.filter(k=>edDraft[k].s === "参加予定" && !edDraft[k].d);
  if(noDate.length){ $("#edMsg").className = "msg err"; $("#edMsg").textContent = "参加予定の日付を入れてください"; return; }
  /* この画面の中だけで変えます。上の「💾 一覧の変更を保存」でまとめて保存します */
  changed.forEach(k=>{ edMember.items[k] = { s: edDraft[k].s, d: edDraft[k].d }; });
  closeEd();
  draw();
}
