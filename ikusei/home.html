<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイホーム|スカイアーク育成プログラム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./gcon-manifest.json">
<link rel="icon" type="image/png" sizes="64x64" href="../img/gcon-icon-64.png">
<link rel="apple-touch-icon" href="../img/gcon-icon-180.png">
<meta name="theme-color" content="#6E5FB5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="育成ホーム">
<style>
  :root{
    --deep:#6E5FB5; --leaf:#4FB08C; --mist:#EDEAF9;
    --blue:#5E8FD8; --purple:#9E7CD4;
    --paper:#FBF8FE; --ink:#22322A;
    --amber:#F5C452; --amber-soft:#FDF3DC;
    --gray:#9AA8A0; --white:#FFFFFF; --radius:20px;
    --grad:linear-gradient(150deg,#9A86E0 0%,#6E5FB5 45%,#5E8FD8 100%);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Zen Kaku Gothic New",sans-serif;background:var(--paper);color:var(--ink);line-height:1.75;font-size:15.5px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px;}
  button{font-family:inherit;cursor:pointer;border:none;}

  /* ===== login ===== */
  #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--grad);padding:20px;}
  .login-card{background:var(--white);border-radius:24px;padding:32px 24px;width:100%;max-width:400px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .login-card .logo{font-size:40px;text-align:center;}
  .login-card h1{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:var(--deep);font-size:21px;line-height:1.5;margin:6px 0 4px;text-align:center;}
  .login-card .sub{font-size:12.5px;color:#5A6B60;margin-bottom:22px;text-align:center;}
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--deep);margin-bottom:6px;}
  .field input,.field select{width:100%;padding:13px 14px;font-size:16px;border:2px solid var(--mist);border-radius:12px;font-family:inherit;background:var(--paper);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--leaf);}
  .field small{font-size:11px;color:#7A8A80;display:block;margin-top:4px;}
  .btn-main{width:100%;padding:15px;border-radius:14px;background:var(--leaf);color:var(--white);font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:16px;}
  .btn-main:active{transform:scale(.98);}
  .btn-main:disabled{opacity:.6;}
  .login-err{display:none;background:#FDEBEB;color:#B33;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;}

  /* ===== home ===== */
  #homeView{display:none;}
  .head{background:var(--grad);color:var(--white);padding:26px 0 30px;}
  .head .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .head .hello{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:20px;line-height:1.4;}
  .head .meta{font-size:11.5px;opacity:.88;margin-top:2px;}
  .head .role{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:4px 12px;margin-top:8px;}
  .head .role.crie{background:var(--amber);color:#5C4200;}
  .logout{background:rgba(255,255,255,.16);color:var(--white);font-size:11.5px;border-radius:999px;padding:5px 12px;flex-shrink:0;}

  main{padding:22px 0 50px;}
  .sec-title{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;color:var(--deep);font-size:16px;margin-bottom:4px;}
  .sec-note{font-size:12.5px;color:#7A8A80;margin-bottom:16px;}

  .mission{
    background:var(--white);border-radius:var(--radius);
    box-shadow:0 2px 10px rgba(110,95,181,.10);
    padding:18px;margin-bottom:14px;border-left:6px solid var(--leaf);
    display:block;text-decoration:none;color:inherit;
  }
  .mission.m2{border-left-color:var(--blue);}
  .mission.m3{border-left-color:var(--purple);}
  .mission.locked{background:#F3F2F0;border-left-color:#D5D5CE;box-shadow:none;}
  .m-top{display:flex;gap:12px;align-items:flex-start;}
  .m-em{font-size:30px;line-height:1.2;flex-shrink:0;}
  .m-body{flex:1;}
  .m-body h3{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:16.5px;color:var(--deep);line-height:1.45;}
  .mission.m2 .m-body h3{color:var(--blue);}
  .mission.m3 .m-body h3{color:var(--purple);}
  .mission.locked .m-body h3{color:#9A9A92;}
  .m-body p{font-size:13px;color:#5A6B60;margin-top:2px;}
  .mission.locked .m-body p{color:#9A9A92;}
  .m-status{
    display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;
    padding:4px 12px;margin-top:8px;background:var(--mist);color:var(--deep);
  }
  .m-status.done{background:var(--leaf);color:var(--white);}
  .m-status.now{background:var(--amber);color:#5C4200;}
  .m-status.lock{background:#E4E4DE;color:#8A8A80;}
  .m-bar{height:8px;background:var(--mist);border-radius:99px;overflow:hidden;margin-top:10px;}
  .m-bar i{display:block;height:100%;background:var(--leaf);border-radius:99px;width:0%;transition:width .6s ease;}
  .mission.m2 .m-bar i{background:var(--blue);}
  .m-lockmsg{margin-top:10px;font-size:12px;color:#8A8A80;background:#EAEAE4;border-radius:10px;padding:8px 12px;}

  .refresh{
    display:block;margin:4px auto 0;background:var(--mist);color:var(--deep);
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:12.5px;
    border-radius:999px;padding:9px 18px;
  }
  footer{text-align:center;font-size:11.5px;color:#7A8A80;padding:14px 0 40px;line-height:2;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:var(--white);font-size:13px;border-radius:999px;padding:10px 20px;opacity:0;transition:all .3s ease;pointer-events:none;z-index:50;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .verTag{
    display:block;text-align:center;
    font-size:9.5px;color:#B4B0C4;letter-spacing:.05em;
    padding:6px 0 10px;font-family:monospace;
  }
</style>
<link rel="stylesheet" href="../beta.css">
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="loginView">
  <div class="login-card">
    <div class="logo">🌱</div>
    <h1>スカイアーク<br>育成プログラム</h1>
    <p class="sub">会員番号でログインしてください</p>
    <div class="login-err" id="loginErr"></div>
    <div class="field">
      <label>会員番号</label>
      <input type="text" id="inId" inputmode="numeric" placeholder="例:00012345" autocomplete="username">
    </div>
    <div class="field">
      <label>パスコード(4桁の数字)</label>
      <input type="password" id="inPin" inputmode="numeric" maxlength="4" placeholder="初回は好きな4桁の数字を決めてください" autocomplete="current-password">
      <small>※次回から同じ会員番号とパスコードで、どの端末からでも続きができます。<br>
      <a href="./index.html" style="color:var(--leaf);font-weight:700;">パスコードを忘れた・変更したい方はこちら</a></small>
    </div>
    <div class="field">
      <label>系列</label>
      <select id="inKeiretsu"></select>
      <input type="text" id="inKeiretsuOther" placeholder="系列名を入力してください" style="display:none;margin-top:8px;">
    </div>
    <div class="field">
      <label>お名前(初回のみ)</label>
      <input type="text" id="inName" placeholder="例:高山翔子">
    </div>
    <button class="btn-main" id="loginBtn" onclick="login()">ログイン ▶</button>
  </div>
</div>

<!-- ========== HOME ========== -->
<div id="homeView">
  <div class="head">
    <div class="wrap">
      <div class="row">
        <div>
          <div class="hello" id="helloName">こんにちは!</div>
          <div class="meta" id="metaLine"></div>
          <span class="role" id="roleBadge">メンバー / サポーター</span>
        </div>
        <button class="logout" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </div>

  <main>
    <div class="wrap">
      <div class="sec-title">🎯 いまのミッション</div>
      <div class="sec-note">上から順に進めていきましょう。</div>
      <div id="missions"></div>
      <button class="refresh" onclick="loadHome(true)">🔄 最新の状況に更新</button>
    </div>
  </main>

  <footer>
    交通整備課|クリエイターズ育成部門
    <div class="verTag" style="margin-top:8px;color:rgba(255,255,255,.4);">v1.44 (2026/08/15)</div>
</footer>
</div>

<div id="toast"></div>

<script>
/* ================================================================
   設定
================================================================ */
/* ================================================================
   接続先の設定【将来の系列分割用】
   ----------------------------------------------------------------
   ★いまは全系列が同じ1ファイルに保存されます("default" だけ)。
   ★人数が増えて分けたくなったら、系列名をキーにURLを足すだけ。
     会員の操作は何も変わりません(自動で振り分けられます)。

     例)HEROとFairyTailだけ別ファイルにする場合:
       const GAS_MAP = {
         "🪽HERO":      "https://…HERO用のURL…/exec",
         "📚FairyTail": "https://…FairyTail用のURL…/exec",
         "default":     "https://script.google.com/macros/s/AKfycbzY2l20zwGULjnKRUqvRpbH79fPkl5e-sWNVoXEIgBrDpqhjDAx2zLvJuqO3sZxAfHj/exec"
       };
================================================================ */
const GAS_MAP = {
  "default": "https://script.google.com/macros/s/AKfycbzY2l20zwGULjnKRUqvRpbH79fPkl5e-sWNVoXEIgBrDpqhjDAx2zLvJuqO3sZxAfHj/exec"
};

/* 系列に応じた接続先を返す(見つからなければ default) */
function gasUrlFor(keiretsu){
  try{ return GAS_MAP[keiretsu] || GAS_MAP["default"] || ""; }
  catch(e){ return GAS_MAP["default"] || ""; }
}


const KEIRETSU = [
  "🚀SkyExceed","🦅Zenith1","🏰Utop","🌟グローハピネス🌟","🥷HOT STUFF⚜️",
  "TELLUS.","FEAT","🌬️ザ・クラウドブルー(蒼雲)","✈️JET RISE","✨アフロディーテ",
  "⭐️ルミナス","エネルギー🔥","💎プリズム","📚FairyTail","ミラメリ🪄","🪽HERO","♾️ZERO♾️",
];

/* ================================================================
   ミッション定義:新しいプログラムを足すときはここに1つ追加するだけ
     app     … APP_ID(進捗タブの名前になる)
     needCrie… true にするとクリエイターズ限定
     needDone… 先に修了が必要なミッションのapp(なければ null)
================================================================ */
const MISSIONS = [
  { app:"piyo", cls:"", em:"🐣", title:"① ぴよぴよ脱出クイズ",
    desc:"スカイアークの基本を7問で確認。サポート力の基礎を固めます。",
    url:"./piyo-quiz.html", needCrie:false, needDone:null },

  { app:"gr", cls:"m2", em:"🌱", title:"② グルコンリーダー育成",
    desc:"人を導き、場をつくる力を育てる4週間プログラム。",
    url:"./gcon-mypage.html", needCrie:true, needDone:"piyo" },

  { app:"senryaku", cls:"m3", em:"📈", title:"③ 戦略立案マニュアル",
    desc:"戦略を立て、成果を創り出す力を身につけます。",
    url:null, needCrie:true, needDone:"gr", prep:true },
];

const APPS = MISSIONS.map(m=>m.app).join(",");
const $ = (s)=>document.querySelector(s);
let member = null;
let homeData = null;

/* 系列セレクト */
(function(){
  const sel = $("#inKeiretsu");
  sel.innerHTML = '<option value="">選択してください</option>'
    + KEIRETSU.map(k=>`<option value="${k}">${k}</option>`).join("")
    + '<option value="__other__">その他(自分で入力)</option>';
  sel.addEventListener("change", ()=>{
    $("#inKeiretsuOther").style.display = sel.value === "__other__" ? "block" : "none";
  });
})();

async function login(){
  const id = $("#inId").value.trim();
  const pin = $("#inPin").value.trim();
  const name = $("#inName").value.trim();
  let keiretsu = $("#inKeiretsu").value;
  if(keiretsu === "__other__") keiretsu = $("#inKeiretsuOther").value.trim();
  const err = $("#loginErr");
  err.style.display = "none";
  if(!id || !/^\d{4}$/.test(pin)){
    err.textContent = "会員番号と、4桁の数字のパスコードを入力してください";
    err.style.display = "block"; return;
  }
  $("#loginBtn").disabled = true;
  $("#loginBtn").textContent = "確認中…";
  try{
    const body = new URLSearchParams({action:"login", id, pin, name:name||"", keiretsu:keiretsu||""});
    const res = await fetch(gasUrlFor(keiretsu), {method:"POST", body});
    const j = await res.json();
    if(j.ok === false){
      err.textContent = j.error === "pin"
        ? "パスコードが一致しません。忘れた場合は担当コーチにご確認ください。"
        : "ログインできませんでした。もう一度お試しください。";
      err.style.display = "block";
      return;
    }
    member = {id, pin, name:j.name||name, keiretsu:j.keiretsu||keiretsu, role:j.role||""};
    localStorage.setItem("skyarc_member", JSON.stringify(member));
    enterHome();
    loadHome(false);
  }catch(e){
    err.textContent = "通信できませんでした。電波のよい場所でお試しください。";
    err.style.display = "block";
  }finally{
    $("#loginBtn").disabled = false;
    $("#loginBtn").textContent = "ログイン ▶";
  }
}

function logout(){
  if(!confirm("ログアウトしますか?\n(この端末に残った学習の記録も消えます)")) return;
  try{
    const keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && (k.indexOf("skyarc_")===0 || k.indexOf("piyo_")===0 || k.indexOf("gcon_")===0)) keys.push(k);
    }
    keys.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
  location.href = "./index.html";
}

function enterHome(){
  $("#loginView").style.display = "none";
  $("#homeView").style.display = "block";
  $("#helloName").textContent = (member.name ? member.name+"さん、" : "") + "こんにちは!";
  $("#metaLine").textContent = "会員番号:" + member.id + (member.keiretsu ? "|" + member.keiretsu : "");
  updateRole();
  render();
}

function updateRole(){
  const isCrie = member.crie === true;
  const badge = $("#roleBadge");
  badge.textContent = member.role ? member.role : "メンバー / サポーター";
  badge.classList.toggle("crie", isCrie);
}

async function loadHome(showToast){
  try{
    const res = await fetch(`${gasUrlFor(member && member.keiretsu)}?action=home&id=${encodeURIComponent(member.id)}&pin=${encodeURIComponent(member.pin)}&apps=${encodeURIComponent(APPS)}`);
    const j = await res.json();
    if(j.ok){
      homeData = j.progress || {};
      member.role = j.role || ""; member.crie = j.crie === true;
      member.name = j.name || member.name;
      localStorage.setItem("skyarc_member", JSON.stringify(member));
      updateRole();
      render();
      if(showToast) toast("最新の状況に更新しました");
    }
  }catch(e){
    if(showToast) toast("通信できませんでした");
  }
}

function render(){
  const isCrie = member.crie === true;
  const root = $("#missions");
  root.innerHTML = "";

  MISSIONS.forEach(m=>{
    const st = (homeData && homeData[m.app]) || {started:false, marks:0, items:0, done:false};
    const prereq = m.needDone ? ((homeData && homeData[m.needDone]) || {}).done : true;

    let locked = false, lockMsg = "";
    if(m.needCrie && !isCrie){
      locked = true;
      lockMsg = "🔒 クリエイターズになると学べます(面談については担当リーダーへ)";
    }else if(m.needDone && !prereq){
      const prevTitle = (MISSIONS.find(x=>x.app===m.needDone)||{}).title || "前のミッション";
      locked = true;
      lockMsg = "🔒 " + prevTitle + " の修了後にひらきます";
    }else if(m.prep){
      locked = true;
      lockMsg = "🛠 ただいま準備中です。おたのしみに!";
    }

    let statusHtml = "", barHtml = "";
    if(!locked){
      if(st.done){
        statusHtml = '<span class="m-status done">🎓 修了しました!</span>';
      }else if(st.started){
        statusHtml = `<span class="m-status now">挑戦中 ${st.marks}/${st.items||"?"}</span>`;
        if(st.items) barHtml = `<div class="m-bar"><i style="width:${Math.min(100, st.marks/st.items*100)}%"></i></div>`;
      }else{
        statusHtml = '<span class="m-status">▶ はじめる</span>';
      }
    }else{
      statusHtml = '<span class="m-status lock">🔒 ロック中</span>';
    }

    const inner = `
      <div class="m-top">
        <span class="m-em">${locked ? "🔒" : m.em}</span>
        <div class="m-body">
          <h3>${m.title}</h3>
          <p>${m.desc}</p>
          ${statusHtml}
          ${barHtml}
          ${locked ? `<div class="m-lockmsg">${lockMsg}</div>` : ""}
        </div>
      </div>`;

    let el;
    if(locked || !m.url){
      el = document.createElement("div");
      el.className = "mission locked " + m.cls;
    }else{
      el = document.createElement("a");
      el.className = "mission " + m.cls;
      el.href = m.url;
    }
    el.innerHTML = inner;
    root.appendChild(el);
  });
}

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* 自動ログイン */
(function(){
  const saved = localStorage.getItem("skyarc_member");
  if(saved){
    member = JSON.parse(saved);
    enterHome();
    loadHome(false);
  }
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("./gcon-sw.js").catch(()=>{}); }
})();
</script>
</body>
</html>
